          subprocess.run(["ffmpeg", "-y", "-i", source_audio, "-af", "highpass=f=75,lowpass=f=11000,equalizer=f=180:t=q:w=1:g=1.0,equalizer=f=2800:t=q:w=1:g=1.5,acompressor=threshold=-21dB:ratio=2.0:attack=15:release=160,loudnorm=I=-16:TP=-1.5:LRA=10", "-b:a", "192k", "output/voiceover.mp3"], check=True)
          if os.path.getsize("output/voiceover.mp3") < 1000:
              raise RuntimeError("Voice-over file is too small")
          subprocess.run(["ffmpeg", "-y", "-i", "output/voiceover.mp3", "-ar", "24000", "-ac", "1", "output/voiceover.wav"], check=True)
          if not os.path.exists("output/voiceover.wav") or os.path.getsize("output/voiceover.wav") < 1000:
              raise RuntimeError("Compatibility WAV for caption timing was not created")
          print("HINDI_MALE_VOICE_SUCCESS")
          PY

