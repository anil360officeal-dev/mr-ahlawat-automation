                  subprocess.run(["curl", "-fL", "--retry", "3", base + "/hi_IN-rohan-medium.onnx.json", "-o", "models/hi_IN-rohan-medium.onnx.json"], check=True)
                  subprocess.run(["piper", "--model", "models/hi_IN-rohan-medium.onnx", "--length_scale", "0.94", "--noise_scale", "0.38", "--noise_w_scale", "0.58", "--sentence_silence", "0.22", "--output_file", "output/voiceover-rohan.wav"], input=script, text=True, check=True)
                  if os.path.getsize("output/voiceover-rohan.wav") < 1000:
                      raise RuntimeError("Piper Rohan output is too small")
                  source_audio = "output/voiceover-rohan.wav"
                  print("VOICE_ENGINE=fallback-offline-piper-hi_IN-rohan-male")
              except Exception as piper_error:
