              print("CJP_LOGO_IMAGE_READY: image_00_cjp.png")
          except Exception as logo_error:
              print("CJP_LOGO_IMAGE_WARNING:", repr(logo_error))
              # Offline-safe fallback: create a clean CJP title card so the opening
