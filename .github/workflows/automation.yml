              raise RuntimeError("Voice comparison script is empty")

          async def make_sample(voice, filename):
              try:
                  communicate = edge_tts.Communicate(script, voice, rate="+0%", pitch="-2Hz")
                  await communicate.save(filename)
                  if os.path.getsize(filename) < 1000:
                      raise RuntimeError("sample too small")
                  print(f"VOICE_SAMPLE_READY={voice}:{filename}")
