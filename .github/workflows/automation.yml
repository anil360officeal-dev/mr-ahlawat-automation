              import glob
              social_queries = [
                  topic + " protest site:facebook.com/reel OR site:facebook.com/watch",
                  topic + " protest site:instagram.com/reel OR site:instagram.com/p",
                  topic + " protest site:x.com OR site:twitter.com"
              ]
              social_urls = []
              # Use the selected X post itself first, including any attached public media.
              try:
                  with open("output/cjp_source.json", encoding="utf-8") as source_file:
                      selected_source = json.load(source_file)
                  selected_x_url = str(selected_source.get("url", "")).strip()
                  if selected_x_url.startswith(("https://x.com/", "https://twitter.com/")):
                      social_urls.append(selected_x_url)
              except Exception as source_error:
                  print("Selected X source URL unavailable:", source_error)
              for social_query in social_queries:
                  try:
                      rss = session.get("https://www.bing.com/search", params={"format": "rss", "q": social_query}, timeout=25)
                      rss.raise_for_status()
                      root = ET.fromstring(rss.text)
                      for item in root.findall(".//item"):
                          link = (item.findtext("link") or "").strip()
                          if not link:
                              continue
                          lower = link.lower()
                          is_fb = "facebook.com/" in lower and any(part in lower for part in ("/reel", "/watch", "/videos/"))
                          is_ig = "instagram.com/" in lower and any(part in lower for part in ("/reel/", "/p/", "/tv/"))
                          is_x = ("x.com/" in lower or "twitter.com/" in lower) and ("/status/" in lower)
                          if (is_fb or is_ig or is_x) and link not in social_urls:
                              social_urls.append(link)
                  except Exception as search_error:
                      print("Public social-post search warning:", search_error)
              print("PUBLIC_FACEBOOK_INSTAGRAM_X_POSTS_FOUND:", len(social_urls))
