```yaml
name: Mr Ahlawat Shorts Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * *"

permissions:
  contents: read

jobs:
  create-short:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create vertical Short
        run: |
          mkdir -p output

          ffmpeg -y \
            -f lavfi \
            -i "color=c=black:s=1080x1920:r=30:d=10" \
            -vf "drawtext=text='MR AHLAWAT':fontcolor=white:fontsize=100:x=(w-text_w)/2:y=(h-text_h)/2,drawtext=text='New Short Coming Soon':fontcolor=yellow:fontsize=48:x=(w-text_w)/2:y=(h-text_h)/2+140" \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -movflags +faststart \
            output/mr-ahlawat-short.mp4

      - name: Save generated video
        uses: actions/upload-artifact@v6
        with:
          name: mr-ahlawat-short
          path: output/mr-ahlawat-short.mp4
          retention-days: 3
```
