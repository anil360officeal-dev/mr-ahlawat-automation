          if is_protest_story:
              for search_term in queries[:5] + ["India protest demonstration rally crowd", "Jantar Mantar protest India"]:
                  if video_count >= 2:
                      break
                  try:
                      response = session.get("https://commons.wikimedia.org/w/api.php", params={"action": "query", "format": "json", "list": "search", "srnamespace": 6, "srsearch": search_term, "srlimit": 8}, timeout=30)
                      response.raise_for_status()
                      results = response.json().get("query", {}).get("search", [])
                      for result in results:
                          if video_count >= 2:
                              break
                          file_title = result.get("title", "")
                          if not file_title:
                              continue
                          detail = session.get("https://commons.wikimedia.org/w/api.php", params={"action": "query", "format": "json", "titles": file_title, "prop": "imageinfo", "iiprop": "url|mime|extmetadata"}, timeout=30)
                          detail.raise_for_status()
                          pages = detail.json().get("query", {}).get("pages", {})
                          for page in pages.values():
                              info = page.get("imageinfo", [{}])[0]
                              if not info.get("mime", "").startswith("video/") or not info.get("url"):
                                  continue
                              raw_path = "output/media/commons_video_source"
                              try:
                                  raw = session.get(info["url"], timeout=90)
                                  raw.raise_for_status()
                                  if len(raw.content) < 20000:
                                      continue
                                  with open(raw_path, "wb") as out:
                                      out.write(raw.content)
                                  mp4_path = f"output/media/clip_{video_count + 1:02d}.mp4"
                                  converted = subprocess.run(["ffmpeg", "-y", "-i", raw_path, "-t", "20", "-vf", "scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2", "-an", "-c:v", "libx264", "-preset", "veryfast", "-pix_fmt", "yuv420p", mp4_path], stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
                                  os.remove(raw_path)
                                  if converted.returncode != 0 or not os.path.exists(mp4_path) or os.path.getsize(mp4_path) < 10000:
                                      if os.path.exists(mp4_path): os.remove(mp4_path)
                                      continue
                                  video_count += 1
                                  meta = info.get("extmetadata", {})
                                  artist = meta.get("Artist", {}).get("value", "Unknown")
                                  license_name = meta.get("LicenseShortName", {}).get("value", "Check license")
                                  source_page = "https://commons.wikimedia.org/wiki/" + quote(file_title.replace(" ", "_"))
                                  attribution.append(f"Commons video | {file_title} | Creator: {artist} | License: {license_name} | Source: {source_page}")
                                  print(f"COMMONS_PROTEST_VIDEO_DOWNLOADED: {video_count}: {file_title}")
                                  break
                              except Exception as video_error:
                                  print("Commons video candidate failed:", video_error)
                  except Exception as commons_error:
                      print(f"Commons video search warning for '{search_term}': {commons_error}")

          with open("output/media_attribution.txt", "w", encoding="utf-8") as f:
