                          if thumb_convert.returncode == 0 and os.path.exists(thumb_path) and os.path.getsize(thumb_path) > 5000:
                              social_image_count += 1
                              attribution.append(f"Public social post thumbnail (review usage rights before publishing) | Source post: {post_url}")
                              print(f"PUBLIC_SOCIAL_THUMBNAIL_SAVED: {prefix} image {social_image_count}")
                      if video_count >= 2:
                          continue
                      temp_template = f"output/media/social_{prefix}_%(id)s.%(ext)s"
                      result = subprocess.run(["python", "-m", "yt_dlp", "--no-warnings", "--no-playlist", "--no-progress", "--max-filesize", "80M", "-f", "best[ext=mp4]/best", "-o", temp_template, post_url], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=100)
                      print("PUBLIC_SOCIAL_DOWNLOAD_RESULT:", result.stdout[-1800:])
                      candidates = [p for p in glob.glob(f"output/media/social_{prefix}_*") if p.lower().endswith((".mp4", ".webm", ".mkv", ".mov"))]
                      if result.returncode != 0 or not candidates:
                          print("Public post video unavailable without login; thumbnail search attempted.")
                          continue
                      source_path = max(candidates, key=os.path.getmtime)
                      if social_image_count < 5:
                          frame_path = f"output/media/social_image_{social_image_count + 1:02d}.jpg"
                          frame_result = subprocess.run(["ffmpeg", "-y", "-ss", "1", "-i", source_path, "-frames:v", "1", "-q:v", "2", frame_path], stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
                          if frame_result.returncode == 0 and os.path.exists(frame_path) and os.path.getsize(frame_path) > 5000:
                              social_image_count += 1
                              attribution.append(f"Still frame extracted from public social video (review usage rights before publishing) | Source post: {post_url}")
                              print(f"PUBLIC_SOCIAL_VIDEO_FRAME_SAVED: {prefix} image {social_image_count}")
                          elif os.path.exists(frame_path):
                              os.remove(frame_path)
                      mp4_path = f"output/media/clip_{video_count + 1:02d}.mp4"
                      converted = subprocess.run(["ffmpeg", "-y", "-i", source_path, "-t", "20", "-vf", "scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2", "-an", "-c:v", "libx264", "-preset", "veryfast", "-pix_fmt", "yuv420p", mp4_path], stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
                      if converted.returncode == 0 and os.path.exists(mp4_path) and os.path.getsize(mp4_path) > 10000:
                          video_count += 1
                          attribution.append(f"Public social video (review usage rights before publishing) | Source post: {post_url}")
                          print(f"PUBLIC_SOCIAL_VIDEO_DOWNLOADED: {prefix} clip {video_count}")
                      elif os.path.exists(mp4_path):
                          os.remove(mp4_path)
                  except subprocess.TimeoutExpired:
                      print("Public social thumbnail/video fetch timed out; skipping URL.")
                  except Exception as social_error:
                      print("Public social image/video fetch skipped:", social_error)
          # Free Wikimedia Commons moving-footage fallback; no API key required.
