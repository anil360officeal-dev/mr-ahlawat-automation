name: Mr Ahlawat Shorts Automation

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Hindi Short ka topic"
        required: true
        default: "भारत और दुनिया की टेक्नोलॉजी पर एक रोचक खबर"
        type: string

permissions:
  contents: read

jobs:
  create-short:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests piper-tts google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Generate Hindi Short with Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHORT_TOPIC: ${{ inputs.topic }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          api_key = os.environ["GEMINI_API_KEY"]
          topic = os.environ.get("SHORT_TOPIC", "").strip()

          if not api_key:
              raise RuntimeError("GEMINI_API_KEY secret is missing")

          prompt = f"""
          Create metadata and a spoken script for a YouTube Short
          for the Hindi/Hinglish channel Mr Ahlawat.

          Topic: {topic}

          Rules:
          - Natural, engaging Hindi/Hinglish.
          - Script should be around 30 seconds.
          - Do not invent facts, quotes, or breaking news.
          - Title must be under 100 characters and include 3 relevant hashtags.
          - Description should explain the topic and include relevant hashtags.
          - Return valid JSON only with these keys:
            script, title, description, hashtags
          - script, title, description, hashtags, visual_search_terms
          - visual_search_terms must be a JSON array containing 3 short English search queries for relevant news photos or video B-roll.
          """

          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.5-flash-lite:generateContent"
          )

          
          import time

          for attempt in range(5):
              try:
                  response = requests.post(
                      url,
                      params={"key": api_key},
                      json={
                          "contents": [
                              {"parts": [{"text": prompt}]}
                          ],
                          "generationConfig": {
                              "responseMimeType": "application/json"
                          }
                      },
                      timeout=90
                  )

                  if response.ok:
                      break

                  if response.status_code not in (429, 500, 502, 503, 504):
                      break

                  print(
                      f"Gemini temporary error HTTP {response.status_code}; "
                      f"attempt {attempt + 1}/5"
                  )

              except requests.RequestException as e:
                  print(f"Gemini connection error: {e}")

              if attempt < 4:
                  delay = 5 * (2 ** attempt)
                  print(f"Retrying in {delay} seconds...")
                  time.sleep(delay)

          if not response.ok:
              raise RuntimeError(
                  f"Gemini API failed: HTTP {response.status_code}. "
                  "Check API access, quota, and billing settings."
              )

          result = response.json()
          text = result["candidates"][0]["content"]["parts"][0]["text"]
          data = json.loads(text)

          required = ["script", "title", "description", "hashtags"]
          if any(key not in data for key in required):
              raise RuntimeError("Gemini response is missing required fields")

          data["title"] = data["title"].strip()[:100]
          data["description"] = data["description"].strip()

          os.makedirs("output", exist_ok=True)
          with open("output/metadata.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("GEMINI_SCRIPT_SUCCESS")
          print("Generated title:", data["title"])
          print("Generated script:", data["script"])
          PY

      - name: Generate Hindi male voice-over
        run: |
          set -e
          mkdir -p models output

          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/rohan/medium"

          curl -fL "$BASE/hi_IN-rohan-medium.onnx" \
            -o models/hi_IN-rohan-medium.onnx

          curl -fL "$BASE/hi_IN-rohan-medium.onnx.json" \
            -o models/hi_IN-rohan-medium.onnx.json

          python - <<'PY'
          import json
          import subprocess
          import os

          with open("output/metadata.json", encoding="utf-8") as f:
              data = json.load(f)

          script = data["script"].strip()
          if not script:
              raise RuntimeError("AI script is empty")

          subprocess.run(
              [
                  "piper",
                  "--model", "models/hi_IN-rohan-medium.onnx",
                  "--output_file", "output/voiceover.wav"
              ],
              input=script,
              text=True,
              check=True
          )

          subprocess.run(
              [
                  "ffmpeg", "-y",
                  "-i", "output/voiceover.wav",
                  "output/voiceover.mp3"
              ],
              check=True
          )

          if os.path.getsize("output/voiceover.mp3") < 1000:
              raise RuntimeError("Voice-over file is too small")

          print("HINDI_MALE_VOICE_SUCCESS")
          PY
    
      - name: Download relevant Wikimedia images
          SHORT_TOPIC: ${{ inputs.topic }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from urllib.parse import quote

          os.makedirs("output/media", exist_ok=True)

          for name in os.listdir("output/media"):
              path = os.path.join("output/media", name)
              if os.path.isfile(path):
                  os.remove(path)

          with open("output/metadata.json", encoding="utf-8") as f:
              metadata = json.load(f)

          queries = metadata.get("visual_search_terms", [])
          if isinstance(queries, str):
              queries = [queries]
          queries = [q.strip() for q in queries if isinstance(q, str) and q.strip()]

          if not queries:
              topic = os.environ.get("SHORT_TOPIC", "").strip()
              queries = [topic] if topic else ["India news"]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "MrAhlawatShorts/1.0 (image search)"
          })

          saved = 0
          attribution = []
          seen = set()

          for search_term in queries[:4]:
              if saved >= 5:
                  break

              try:
                  print(f"Searching Wikimedia Commons: {search_term}")

                  response = session.get(
                      "https://commons.wikimedia.org/w/api.php",
                      params={
                          "action": "query",
                          "format": "json",
                          "list": "search",
                          "srnamespace": 6,
                          "srsearch": search_term,
                          "srlimit": 10
                      },
                      timeout=30
                  )
                  response.raise_for_status()
                  results = response.json().get("query", {}).get("search", [])

                  for result in results:
                      if saved >= 5:
                          break

                      title = result.get("title", "")
                      if not title or title in seen:
                          continue
                      seen.add(title)

                      detail = session.get(
                          "https://commons.wikimedia.org/w/api.php",
                          params={
                              "action": "query",
                              "format": "json",
                              "titles": title,
                              "prop": "imageinfo",
                              "iiprop": "url|mime|extmetadata",
                              "iiurlwidth": 1280
                          },
                          timeout=30
                      )
                      detail.raise_for_status()
                      pages = detail.json().get("query", {}).get("pages", {})

                      for page in pages.values():
                          info = page.get("imageinfo", [{}])[0]
                          mime = info.get("mime", "")
                          if mime not in ("image/jpeg", "image/png", "image/webp"):
                              continue

                          url = info.get("thumburl") or info.get("url")
                          if not url:
                              continue

                          image = session.get(url, timeout=45)
                          image.raise_for_status()
                          if len(image.content) < 5000:
                              continue

                          ext = {
                              "image/jpeg": "jpg",
                              "image/png": "png",
                              "image/webp": "webp"
                          }[mime]

                          saved += 1
                          with open(f"output/media/image_{saved:02d}.{ext}", "wb") as out:
                              out.write(image.content)

                          meta = info.get("extmetadata", {})
                          artist = meta.get("Artist", {}).get("value", "Unknown")
                          license_name = meta.get("LicenseShortName", {}).get("value", "Check license")
                          source_page = "https://commons.wikimedia.org/wiki/" + quote(title.replace(" ", "_"))
                          attribution.append(
                              f"{title} | Creator: {artist} | "
                              f"License: {license_name} | Source: {source_page}"
                          )
                          print(f"Downloaded image {saved}: {title}")
                          break

              except Exception as e:
                  print(f"Search warning for '{search_term}': {e}")

          with open("output/media_attribution.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(attribution))

          print(f"WIKIMEDIA_IMAGES_DOWNLOADED: {saved}")
          if saved == 0:
              print("No images found; check the search terms or Wikimedia API response.")
          PY          
      - name: Create video with Hindi captions and animated visuals
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core

          python - <<'PY'
          import json
          import wave
          import re
          import os

          with open("output/metadata.json", encoding="utf-8") as f:
              script = json.load(f)["script"].strip()

          with wave.open("output/voiceover.wav", "rb") as wav:
              duration = wav.getnframes() / wav.getframerate()

          sentences = re.split(r'(?<=[।!?])\s+', script)
          chunks = []

          for sentence in sentences:
              words = sentence.split()
              line = ""
              for word in words:
                  candidate = (line + " " + word).strip()
                  if len(candidate) > 32 and line:
                      chunks.append(line)
                      line = word
                  else:
                      line = candidate
              if line:
                  chunks.append(line)

          if not chunks:
              raise RuntimeError("No captions generated")

          def stamp(seconds):
              cs = int(round(seconds * 100))
              h, cs = divmod(cs, 360000)
              m, cs = divmod(cs, 6000)
              s, cs = divmod(cs, 100)
              return f"{h}:{m:02}:{s:02}.{cs:02}"

          weights = [max(1, len(c)) for c in chunks]
          total_weight = sum(weights)
          elapsed = 0.0

          os.makedirs("output", exist_ok=True)
          with open("output/captions.ass", "w", encoding="utf-8") as f:
              f.write("[Script Info]\n")
              f.write("ScriptType: v4.00+\n")
              f.write("PlayResX: 1080\nPlayResY: 1920\n\n")
              f.write("[V4+ Styles]\n")
              f.write("Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\n")
              f.write("Style: Default,Noto Sans Devanagari,58,&H00FFFFFF,&H0000FFFF,&H0010152B,&H90000000,-1,0,0,0,100,100,0,0,1,4,1,2,70,70,340,1\n\n")
              f.write("[Events]\n")
              f.write("Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n")

              for chunk, weight in zip(chunks, weights):
                  start = elapsed
                  elapsed += duration * weight / total_weight
                  safe_chunk = chunk.replace("{", "(").replace("}", ")")
                  f.write(
                      f"Dialogue: 0,{stamp(start)},{stamp(elapsed)},Default,,0,0,0,,"
                      f"{safe_chunk}\n"
                  )

          print("HINDI_CAPTIONS_CREATED")
          PY
          ffmpeg -y \
            -f lavfi \
            -i "color=c=0x071426:s=1080x1920:r=30" \
            -i output/voiceover.mp3 \
            -filter_complex "\
            [0:v]drawgrid=width=100:height=100:thickness=1:color=0x183454@0.45,\
            drawbox=x=0:y=0:w=1080:h=12:color=0x00D9FF:t=fill,\
            drawbox=x=0:y=250:w=1080:h=130:color=0xC90024:t=fill,\
            drawbox=x=0:y=390:w=1080:h=4:color=0xFF334F:t=fill,\
            drawbox=x=65:y=500:w=950:h=420:color=0x102B49@0.95:t=fill,\
            drawbox=x=65:y=500:w=950:h=6:color=0x00D9FF:t=fill,\
            drawbox=x=65:y=960:w=950:h=6:color=0x00D9FF:t=fill,\
            drawbox=x=0:y=1510:w=1080:h=125:color=0xC90024:t=fill,\
            drawbox=x=0:y=1635:w=1080:h=4:color=0xFFFFFF:t=fill,\
            drawbox=x=0:y=1760:w=1080:h=160:color=0x020811:t=fill,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='MR AHWALAT':fontcolor=white:fontsize=58:x=(w-text_w)/2:y=100,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='BREAKING NEWS':fontcolor=white:fontsize=76:x=(w-text_w)/2:y=275,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='LATEST UPDATE':fontcolor=0x00D9FF:fontsize=48:x=(w-text_w)/2:y=430,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='LIVE  NEWS  UPDATE':fontcolor=white:fontsize=44:x='1080-mod(t*180\\,1800)':y=1550,\
            drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='MR AHWALAT  |  HINDI NEWS':fontcolor=white:fontsize=38:x=(w-text_w)/2:y=1810,\
            subtitles=output/captions.ass[v]" \
            -map "[v]" \
            -map 1:a:0 \
            -c:v libx264 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -shortest \
            output/mr-ahlawat-short.mp4
      - name: Save generated files
        uses: actions/upload-artifact@v6
        with:
          name: mr-ahlawat-ai-short
          path: output/
          retention-days: 3

      - name: Upload video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          with open("output/metadata.json", encoding="utf-8") as f:
              metadata = json.load(f)

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"]
          )

          youtube = build(
              "youtube", "v3",
              credentials=credentials,
              cache_discovery=False
          )

          video = MediaFileUpload(
              "output/mr-ahlawat-short.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": metadata["title"],
                      "description": metadata["description"],
                      "categoryId": "22"
                  },
                  "status": {
                      "privacyStatus": "private",
                      "selfDeclaredMadeForKids": False
                  }
              },
              media_body=video
          )

          response = request.execute()
          print("YOUTUBE_UPLOAD_SUCCESS")
          print("Video ID:", response["id"])
          print("Video URL: https://www.youtube.com/watch?v=" + response["id"])
          PY
