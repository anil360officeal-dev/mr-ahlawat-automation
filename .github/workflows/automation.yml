                                         outline=white, width=18, fill=(12, 20, 38))
                  draw.arc((420, 500, 505, 625), 190, 300, fill=gold, width=12)
                  draw.arc((575, 500, 660, 625), 240, 350, fill=gold, width=12)
                  draw.text((540, 780), "CJP", fill=gold,
                            font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 104),
                            anchor="mm")
                  draw.text((540, 1390), "COCKROACH JANATA PARTY", fill=white,
                            font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 48),
                            anchor="mm")
                  draw.text((540, 1470), "CJP", fill=gold,
                            font=ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 90),
                            anchor="mm")
                  card.save(cjp_logo_path)
                  print("CJP_LOGO_FALLBACK_CARD_READY: image_00_cjp.png")
              except Exception as fallback_error:
                  print("CJP_LOGO_FALLBACK_FAILED:", repr(fallback_error))

          # Also fetch an India landmark image to keep the visual sequence India-focused.
          try:
              gate_search = session.get(
                  "https://commons.wikimedia.org/w/api.php",
                  params={"action": "query", "format": "json", "list": "search",
                          "srnamespace": 6, "srsearch": "India Gate New Delhi landmark photograph",
                          "srlimit": 8},
                  timeout=25
              )
              gate_search.raise_for_status()
              for gate_item in gate_search.json().get("query", {}).get("search", []):
                  gate_title = gate_item.get("title", "")
                  # Wikimedia search can return unrelated satellite/aerial photos.
                  # Only accept a file whose actual title identifies India Gate.
