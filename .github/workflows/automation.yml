      - name: Download relevant Wikimedia images
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        env:
          SHORT_TOPIC: ${{ inputs.topic }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          import subprocess
          from urllib.parse import quote

          os.makedirs("output/media", exist_ok=True)

          for name in os.listdir("output/media"):
              path = os.path.join("output/media", name)
              if os.path.isfile(path):
                  os.remove(path)

          with open("output/metadata.json", encoding="utf-8") as f:
              metadata = json.load(f)

          topic = os.environ.get("SHORT_TOPIC", "").strip()
          title = str(metadata.get("title", "")).strip()
          generated_queries = metadata.get("visual_search_terms", [])
          if isinstance(generated_queries, str):
              generated_queries = [generated_queries]
          generated_queries = [
              q.strip() for q in generated_queries
              if isinstance(q, str) and q.strip()
          ]

          # Classify public-affairs stories for protest-style visuals even when the
          # generated title/script omits the word "protest" (e.g. CJP/government stories).
          topic_text = " ".join([topic, title] + generated_queries + [str(metadata.get("script", ""))]).lower()
          protest_terms = ("protest", "protests", "demonstration", "rally", "dharna", "andolan", "jantarmantar", "जंतर मंतर", "प्रदर्शन", "धरना", "आंदोलन", "मोर्चा")
          public_affairs_terms = ("cjp", "bjp", "modi", "government", "court", "election", "activist", "democracy", "citizens for justice", "राजनीति", "सरकार", "अदालत", "चुनाव", "विरोध")
          is_protest_story = any(term in topic_text for term in protest_terms) or any(term in topic_text for term in public_affairs_terms)

          # For protest/public-affairs stories, put protest footage queries FIRST.
          # Otherwise the first four AI queries were consuming the photo/video search
          # budget and generic newsroom-looking stock images kept winning.
          queries = []
          if is_protest_story:
              priority_queries = [
                  topic + " protest rally crowd",
                  topic + " demonstration banners police barricades",
                  "India public protest rally crowd police barricades",
                  "Jantar Mantar protest India crowd"
              ]
          else:
              priority_queries = []
          for q in priority_queries + generated_queries[:4] + [title, topic]:
              q = q.strip() if isinstance(q, str) else ""
              if q and q.lower() not in {item.lower() for item in queries}:
                  queries.append(q)
          if not queries:
              raise RuntimeError("No topic-specific visual search queries were generated.")
          print("TOPIC_FOCUSED_VISUAL_QUERIES:")
          for q in queries:
              print(" - " + q)
          print("PROTEST_VISUAL_MODE:", is_protest_story)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "MrAhlawatShorts/1.0 (image search)"
          })

          saved = 0
          attribution = []
          seen = set()

          # Prefer Pixabay photos first, using the configured repository secret.
          # If Pixabay has no matching photos, Wikimedia Commons is the topic-focused fallback.
          image_key = os.environ.get("PIXABAY_API_KEY", "").strip()
          if image_key:
              for search_term in queries[:4]:
                  if saved >= 5:
                      break
                  try:
                      print(f"Searching Pixabay photos: {search_term}")
                      api = session.get(
                          "https://pixabay.com/api/",
                          params={
                              "key": image_key,
                              "q": search_term,
                              "image_type": "photo",
                              "orientation": "vertical",
                              "safesearch": "true",
                              "per_page": 5
                          },
                          timeout=30
                      )
                      api.raise_for_status()
                      for hit in api.json().get("hits", []):
                          if saved >= 5:
                              break
                          image_url = hit.get("largeImageURL") or hit.get("webformatURL")
                          if not image_url or image_url in seen:
                              continue
                          seen.add(image_url)
                          image = session.get(image_url, timeout=45)
                          image.raise_for_status()
                          if len(image.content) < 5000:
                              continue
                          saved += 1
                          with open(f"output/media/image_{saved:02d}.jpg", "wb") as out:
                              out.write(image.content)
                          attribution.append(
                              f"Pixabay photo | ID: {hit.get('id', 'unknown')} | "
                              f"Source: https://pixabay.com/"
                          )
                          print(f"PIXABAY_IMAGE_DOWNLOADED: {saved}")
                  except Exception as pixabay_error:
                      print(f"Pixabay photo search warning for '{search_term}': {pixabay_error}")

          for search_term in queries[:4]:
              if saved >= 5:
                  break

              try:
                  print(f"Searching Wikimedia Commons: {search_term}")

                  response = session.get(
                      "https://commons.wikimedia.org/w/api.php",
                      params={
                          "action": "query",
                          "format": "json",
                          "list": "search",
                          "srnamespace": 6,
                          "srsearch": search_term,
                          "srlimit": 10
                      },
                      timeout=30
                  )
                  response.raise_for_status()
                  results = response.json().get("query", {}).get("search", [])

                  for result in results:
                      if saved >= 5:
                          break

                      title = result.get("title", "")
                      if not title or title in seen:
                          continue
                      seen.add(title)

                      detail = session.get(
                          "https://commons.wikimedia.org/w/api.php",
                          params={
                              "action": "query",
                              "format": "json",
                              "titles": title,
                              "prop": "imageinfo",
                              "iiprop": "url|mime|extmetadata",
                              "iiurlwidth": 1280
                          },
                          timeout=30
                      )
                      detail.raise_for_status()
                      pages = detail.json().get("query", {}).get("pages", {})

                      for page in pages.values():
                          info = page.get("imageinfo", [{}])[0]
                          mime = info.get("mime", "")
                          if mime not in ("image/jpeg", "image/png", "image/webp"):
                              continue

                          url = info.get("thumburl") or info.get("url")
                          if not url:
                              continue

                          image = session.get(url, timeout=45)
                          image.raise_for_status()
                          if len(image.content) < 5000:
                              continue

                          ext = {
                              "image/jpeg": "jpg",
                              "image/png": "png",
                              "image/webp": "webp"
                          }[mime]

                          saved += 1
                          with open(f"output/media/image_{saved:02d}.{ext}", "wb") as out:
                              out.write(image.content)

                          meta = info.get("extmetadata", {})
                          artist = meta.get("Artist", {}).get("value", "Unknown")
                          license_name = meta.get("LicenseShortName", {}).get("value", "Check license")
                          source_page = "https://commons.wikimedia.org/wiki/" + quote(title.replace(" ", "_"))
                          attribution.append(
                              f"{title} | Creator: {artist} | "
                              f"License: {license_name} | Source: {source_page}"
                          )
                          print(f"Downloaded image {saved}: {title}")
                          break

              except Exception as e:
                  print(f"Search warning for '{search_term}': {e}")
          
          video_count = 0
          # Best-effort search of publicly indexed Facebook/Instagram posts.
          # yt-dlp is used without login cookies; private/login-gated content is skipped.
          if is_protest_story:
              import xml.etree.ElementTree as ET
              import glob
              social_queries = [
                  topic + " protest site:facebook.com/reel OR site:facebook.com/watch",
                  topic + " protest site:instagram.com/reel OR site:instagram.com/p",
                  topic + " protest site:x.com OR site:twitter.com"
              ]
              social_urls = []
              # Use the selected X post itself first, including any attached public media.
              try:
                  with open("output/cjp_source.json", encoding="utf-8") as source_file:
                      selected_source = json.load(source_file)
                  selected_x_url = str(selected_source.get("url", "")).strip()
                  if selected_x_url.startswith(("https://x.com/", "https://twitter.com/")):
                      social_urls.append(selected_x_url)
              except Exception as source_error:
                  print("Selected X source URL unavailable:", source_error)
              for social_query in social_queries:
                  try:
                      rss = session.get("https://www.bing.com/search", params={"format": "rss", "q": social_query}, timeout=25)
                      rss.raise_for_status()
                      root = ET.fromstring(rss.text)
                      for item in root.findall(".//item"):
                          link = (item.findtext("link") or "").strip()
                          if not link:
                              continue
                          lower = link.lower()
                          is_fb = "facebook.com/" in lower and any(part in lower for part in ("/reel", "/watch", "/videos/"))
                          is_ig = "instagram.com/" in lower and any(part in lower for part in ("/reel/", "/p/", "/tv/"))
                          is_x = ("x.com/" in lower or "twitter.com/" in lower) and ("/status/" in lower)
                          if (is_fb or is_ig or is_x) and link not in social_urls:
                              social_urls.append(link)
                  except Exception as search_error:
                      print("Public social-post search warning:", search_error)
              print("PUBLIC_FACEBOOK_INSTAGRAM_X_POSTS_FOUND:", len(social_urls))
              social_image_count = 0
              for post_url in social_urls[:5]:
                  lower_post_url = post_url.lower()
                  prefix = ("facebook" if "facebook.com" in lower_post_url else
                            "instagram" if "instagram.com" in lower_post_url else "x")
                  try:
                      # First try the post thumbnail as a still image; it may work when video download is blocked.
                      thumb_template = f"output/media/social_thumb_{prefix}_%(id)s.%(ext)s"
                      subprocess.run(["python", "-m", "yt_dlp", "--no-warnings", "--no-playlist", "--no-progress", "--skip-download", "--write-thumbnail", "--convert-thumbnails", "jpg", "-o", thumb_template, post_url], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=45)
                      thumb_candidates = [p for p in glob.glob(f"output/media/social_thumb_{prefix}_*") if p.lower().endswith((".jpg", ".jpeg", ".png", ".webp"))]
                      if thumb_candidates and social_image_count < 5:
