                                  raise RuntimeError("Neural voice output is too small")
                              except Exception as exc:
                                  errors.append(f"{voice} attempt {attempt+1}: {exc!r}")
                                  await asyncio.sleep(1.5)
                      raise RuntimeError("All Hindi neural voices failed: " + " | ".join(errors))
                  source_audio = asyncio.run(make_neural_voice())
              except Exception as edge_error:
                  print("NEURAL_HINDI_VOICE_UNAVAILABLE; using offline Piper fallback:", repr(edge_error))

          if source_audio is None:
