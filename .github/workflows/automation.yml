          elif os.environ.get("USE_OPENAI_TTS", "true").lower() == "true":
              print("OPENAI_TTS_SKIPPED: OPENAI_API_KEY secret not configured; using free voice fallback.")

          if source_audio is None:
              try:
                  import asyncio, edge_tts
                  async def make_neural_voice():
                      errors = []
                      for voice, rate, pitch in [
                          ("hi-IN-KunalNeural", "+4%", "+2Hz"),
                          ("hi-IN-RehaanNeural", "+4%", "+2Hz"),
                          ("hi-IN-MadhurNeural", "+4%", "+2Hz"),
                      ]:
                          for attempt in range(2):
