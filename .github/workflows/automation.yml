name: Mr Ahlawat Shorts Automation

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Shayari, comedy, ya news ka topic"
        required: true
        default: "CJP से जुड़ी ताज़ा और सत्यापित दिल्ली-NCR खबर"
        type: string
      content_mode:
        description: "Manual Short ka content style"
        required: true
        default: news
        type: choice
        options:
          - both
          - shayari
          - comedy
          - news
      preview_only:
        description: "Build and save MP4 artifact only; NEVER upload to YouTube"
        required: true
        default: true
        type: boolean
      generate_ai_images:
        description: "Generate one AI editorial illustration using OpenAI Images API (may incur API charges)"
        required: true
        default: true
        type: boolean
      use_openai_tts:
        description: "Prefer natural expressive OpenAI Hindi narration when OPENAI_API_KEY is configured (API charges may apply)"
        required: true
        default: true
        type: boolean
  # Temporarily paused: run previews manually until the talking-avatar output passes review.
  # Re-enable scheduled news builds after the preview pipeline is verified.
  # schedule:
  #   # India time (IST): 08:00, 14:00, 19:00 = 02:30, 08:30, 13:30 UTC
  #   - cron: "30 2,8,13 * * *"

concurrency:
  group: mr-ahlawat-daily-news-upload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-short:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check preview configuration (never print secrets)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PREVIEW_ONLY: ${{ inputs.preview_only || github.event_name != 'schedule' }}
          AI_IMAGES: ${{ inputs.generate_ai_images }}
          OPENAI_TTS: ${{ inputs.use_openai_tts }}
        run: |
          python - <<'PY'
          import os
          key = os.environ.get("OPENAI_API_KEY", "").strip()
          print("PREVIEW_ONLY:", os.environ.get("PREVIEW_ONLY", "true"))
          print("OPENAI_API_KEY_CONFIGURED:", "yes" if key else "NO")
          print("AI_IMAGE_REQUESTED:", os.environ.get("AI_IMAGES", "true"))
          print("OPENAI_TTS_REQUESTED:", os.environ.get("OPENAI_TTS", "true"))
          if not key:
              print("ACTION_REQUIRED: add OPENAI_API_KEY in GitHub Settings > Secrets and variables > Actions. The secret value is never printed.")
          PY

      - name: Restore daily upload counter
        uses: actions/cache/restore@v5
        with:
          path: .github/daily-upload-count.json
          key: daily-upload-count-${{ github.run_id }}
          restore-keys: |
            daily-upload-count-

      - name: Check daily upload limit
        id: daily
        env:
          PREVIEW_ONLY: ${{ inputs.preview_only || github.event_name != 'schedule' }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          path = ".github/daily-upload-count.json"
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
          try:
              with open(path, encoding="utf-8") as f:
                  state = json.load(f)
          except (OSError, json.JSONDecodeError):
              state = {}
          count = int(state.get("count", 0)) if state.get("date") == today else 0
          preview_only = os.environ.get("PREVIEW_ONLY", "false").lower() == "true"
          allowed = count < 3 or preview_only
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("allowed=" + ("true" if allowed else "false") + chr(10))
          print(f"IST_DATE={today}; successful_uploads_today={count}; preview_only={preview_only}; allowed={allowed}")
          if not allowed:
              print("DAILY_UPLOAD_LIMIT_REACHED: maximum 3 successful uploads per India calendar day.")
          PY

      - name: Restore CJP duplicate-post state
        if: github.event_name == 'schedule' && steps.daily.outputs.allowed != 'false'
        uses: actions/cache/restore@v5
        with:
          path: .github/cjp-seen.json
          key: cjp-seen-${{ github.run_id }}
          restore-keys: |
            cjp-seen-

      - name: Select and verify CJP or BJP-critical news
        id: cjp
        if: steps.daily.outputs.allowed != 'false' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.content_mode == 'news' || inputs.content_mode == 'both')))
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import hashlib
          import time
          import urllib.parse
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime
          from urllib.parse import urlparse

          out_path = os.environ["GITHUB_OUTPUT"]
          state_path = ".github/cjp-seen.json"
          os.makedirs("output", exist_ok=True)
          try:
              with open(state_path, encoding="utf-8") as f:
                  state = json.load(f)
          except (OSError, json.JSONDecodeError):
              state = {"ids": []}
          seen = set(str(v) for v in state.get("ids", []))

          def output(key, value):
              with open(out_path, "a", encoding="utf-8") as f:
                  f.write(f"{key}={str(value).replace(chr(10), ' ').replace(chr(13), ' ')}\n")

          def get_json(url):
              req = urllib.request.Request(
                  url, headers={"Accept": "application/json",
                                "User-Agent": "MrAhlawatShorts/1.0"}
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  return json.loads(response.read().decode("utf-8"))

          def words(text):
              return set(re.findall(r"[A-Za-z0-9\u0900-\u097F]+", text.lower()))

          stop = {
              "cjp", "the", "and", "for", "with", "from", "that", "this",
              "have", "has", "was", "were", "are", "its", "into", "about",
              "after", "before", "over", "under", "their", "they", "them",
              "protest", "protests", "government", "india", "indian", "news",
              "update", "today", "latest", "viral", "breaking", "people",
              "says", "said", "claims", "claim", "video", "post", "https",
              "पर", "और", "का", "की", "के", "को", "से", "में", "है", "हैं",
              "एक", "यह", "कि", "भी", "लिए", "द्वारा", "आज", "कल", "अब",
          }
          trusted_domains = (
              "reuters.com", "thehindu.com", "indianexpress.com", "ndtv.com",
              "hindustantimes.com", "indiatimes.com", "indiatoday.in",
              "theprint.in", "scroll.in", "news18.com", "barandbench.com",
              "livelaw.in", "tribuneindia.com", "aninews.in", "ptinews.in",
              "bbc.com", "bbc.co.uk", "thewire.in", "newslaundry.com",
              "deccanherald.com", "outlookindia.com", "thequint.com",
              "telegraphindia.com", "livemint.com", "moneycontrol.com"
          )

          # Search CJP/BJP plus major India-wide public issues; no official X API key.
          search_queries = [
              'CJP -filter:replies',
            'from:abhijeet_dipke -filter:replies',
            'from:AshutoshRanka -filter:replies',
            'from:SauravDassss -filter:replies',
            '"Ashutosh Ranka" OR "Saurav Das" OR "Abhijeet Dipke" -filter:replies',
              '"BJP" (against OR criticism OR protest OR scandal OR controversy OR viral) India -filter:replies',
              '"BJP government" (failure OR question OR protest OR corruption OR inflation OR unemployment) -filter:replies',
              'Modi government criticism viral India protest court election -filter:replies',
              'भारत BJP सरकार विरोध महंगाई बेरोजगारी किसान वायरल -filter:replies',
            'India (breaking OR viral OR latest) (court OR election OR protest OR policy OR minister) -filter:replies',
            'India Supreme Court Parliament government latest news -filter:replies'
          ]
          items = []
          known_ids = set()
          search_failed = 0
          for query in search_queries:
              search_url = "https://unifapi.com/tools/x/search?" + urllib.parse.urlencode({"q": query})
              try:
                  payload = get_json(search_url)
                  found = payload.get("posts", {}).get("items", [])
                  if not isinstance(found, list):
                      found = []
                  for post in found:
                      post_id = str(post.get("id", "")).strip()
                      if post_id and post_id not in known_ids:
                          known_ids.add(post_id)
                          items.append(post)
              except Exception as e:
                  search_failed += 1
                  print("X_SEARCH_WARNING:", query, repr(e))
          # X search has recently returned HTTP 402. Add indexed public Facebook/Instagram
          # results as discovery leads, then verify every selected claim against trusted news.
          social_queries = [
              ("facebook", 'site:facebook.com ("CJP" OR "Abhijeet Dipke" OR "Ashutosh Ranka" OR "Saurav Das")'),
              ("instagram", 'site:instagram.com ("CJP" OR "Abhijeet Dipke" OR "Ashutosh Ranka" OR "Saurav Das")'),
              ("facebook", 'site:facebook.com India (BJP OR protest OR "Supreme Court" OR election)'),
              ("instagram", 'site:instagram.com India (BJP OR protest OR "Supreme Court" OR election)'),
          ]
          social_leads_added = 0
          for platform, query in social_queries:
              rss_url = (
                  "https://news.google.com/rss/search?q="
                  + urllib.parse.quote(query)
                  + "&hl=en-IN&gl=IN&ceid=IN:en"
              )
              try:
                  req = urllib.request.Request(
                      rss_url, headers={"User-Agent": "Mozilla/5.0 MrAhlawatShorts/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=20) as response:
                      root = ET.fromstring(response.read())
                  for item in root.findall(".//item")[:12]:
                      title = (item.findtext("title") or "").strip()
                      link = (item.findtext("link") or "").strip()
                      source_node = item.find("source")
                      source_url = source_node.get("url", "") if source_node is not None else ""
                      source_domain = (urlparse(source_url or link).hostname or "").lower()
                      expected_domain = "facebook.com" if platform == "facebook" else "instagram.com"
                      if not (source_domain == expected_domain or source_domain.endswith("." + expected_domain)):
                          continue
                      pub_date = item.findtext("pubDate") or ""
                      try:
                          published = parsedate_to_datetime(pub_date)
                          if published.tzinfo is None:
                              published = published.replace(tzinfo=timezone.utc)
                          created_at = published.astimezone(timezone.utc).isoformat()
                      except Exception:
                          continue
                      lead_id = "indexed-" + platform + "-" + hashlib.sha256((link or title).encode("utf-8")).hexdigest()[:20]
                      if not title or not link or lead_id in known_ids:
                          continue
                      known_ids.add(lead_id)
                      items.append({
                          "id": lead_id,
                          "text": title,
                          "url": link,
                          "createdAt": created_at,
                          "sourceType": "Google News indexed public " + platform + " result"
                      })
                      social_leads_added += 1
              except Exception as e:
                  print("SOCIAL_INDEX_SEARCH_WARNING:", platform, repr(e))

          # Always add fresh trusted-news RSS leads, even when X returns unrelated/duplicate
          # posts. These are news articles, not mislabelled Facebook/Instagram posts.
          news_leads_added = 0
          fallback_queries = [
              '"CJP" "Abhijeet Dipke"',
              '"Ashutosh Ranka" OR "Saurav Das"',
              'India protest Supreme Court election latest',
          ]
          for query in fallback_queries:
              rss_url = (
                  "https://news.google.com/rss/search?q="
                  + urllib.parse.quote(query)
                  + "&hl=en-IN&gl=IN&ceid=IN:en"
              )
              try:
                  req = urllib.request.Request(
                      rss_url, headers={"User-Agent": "Mozilla/5.0 MrAhlawatShorts/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=20) as response:
                      root = ET.fromstring(response.read())
                  for item in root.findall(".//item")[:12]:
                      title = (item.findtext("title") or "").strip()
                      link = (item.findtext("link") or "").strip()
                      source_node = item.find("source")
                      source_url = source_node.get("url", "") if source_node is not None else ""
                      domain = (urlparse(source_url or link).hostname or "").lower()
                      if not any(domain == d or domain.endswith("." + d) for d in trusted_domains):
                          continue
                      pub_date = item.findtext("pubDate") or ""
                      try:
                          published = parsedate_to_datetime(pub_date)
                          if published.tzinfo is None:
                              published = published.replace(tzinfo=timezone.utc)
                          created_at = published.astimezone(timezone.utc).isoformat()
                      except Exception:
                          continue
                      lead_id = "news-rss-" + hashlib.sha256((link or title).encode("utf-8")).hexdigest()[:20]
                      if not title or not link or lead_id in known_ids:
                          continue
                      known_ids.add(lead_id)
                      items.append({
                          "id": lead_id,
                          "text": title,
                          "url": link,
                          "createdAt": created_at,
                          "sourceType": "Google News RSS lead"
                      })
                      news_leads_added += 1
              except Exception as e:
                  print("NEWS_RSS_FALLBACK_WARNING:", query, repr(e))

          print("SOCIAL_INDEXED_LEADS_ADDED:", social_leads_added)
          print("TRUSTED_NEWS_RSS_LEADS_ADDED:", news_leads_added)
          if not items:
              if search_failed == len(search_queries):
                  print("X_SEARCH_UNAVAILABLE: X and fallback discovery sources returned no usable leads")
              output("should_run", "false")
              raise SystemExit(0)

          print("INDIA_ISSUE_X_AND_FALLBACK_LEADS_RETURNED:", len(items))
          now = datetime.now(timezone.utc)
          selected = None

          # Prioritize posts that explicitly concern CJP/BJP or a major national issue.
          issue_terms = {
              "cjp", "bjp", "parliament", "supreme", "court", "election",
              "government", "minister", "protest", "unemployment", "inflation",
              "farmers", "women", "safety", "corruption", "constitution",
              "democracy", "policy", "india", "लोकसभा", "संसद", "चुनाव",
              "सरकार", "महंगाई", "बेरोजगारी", "किसान", "भ्रष्टाचार",
              "संविधान", "न्यायालय", "विरोध", "महिला", "भारत"
          }
          def post_priority(post):
              body = str(post.get("text", "")).lower()
              tokens = words(body)
              relevant = len(tokens & issue_terms)
              # Prefer CJP updates when they are present, then rank broader public-interest stories.
              cjp_priority = 1 if any(term in body for term in ("cjp", "abhijeet dipke", "ashutosh ranka", "saurav das", "ashu", "अभिजीत दीपके", "अभिजीत दिपके", "आशुतोष रांका", "सौरव दास")) else 0
              created = str(post.get("createdAt", ""))
              return (cjp_priority, relevant, created)
          items.sort(key=post_priority, reverse=True)

          for post in items[:40]:
              # Only build from fresh X posts; don't recycle an old viral post as today's news.
              raw_created = str(post.get("createdAt", "")).strip()
              post_time = None
              if raw_created:
                  try:
                      post_time = datetime.fromisoformat(raw_created.replace("Z", "+00:00"))
                  except ValueError:
                      try:
                          post_time = datetime.strptime(raw_created, "%a %b %d %H:%M:%S %z %Y")
                      except ValueError:
                          post_time = None
              if post_time is None:
                  print("SKIP_SOCIAL_OR_NEWS_LEAD_WITH_UNPARSEABLE_DATE:", raw_created[:100])
                  continue
              if post_time.tzinfo is None:
                  post_time = post_time.replace(tzinfo=timezone.utc)
              if now - post_time.astimezone(timezone.utc) > timedelta(hours=72) or post_time > now + timedelta(minutes=10):
                  print("SKIP_STALE_OR_FUTURE_SOCIAL_OR_NEWS_LEAD:", raw_created[:100])
                  continue
              post_id = str(post.get("id", "")).strip()
              text = str(post.get("text", "")).strip()
              post_url = str(post.get("url", "")).strip()
              if not post_id or post_id in seen or not text or not post_url:
                  continue
              lower_text = text.lower()
              # Run any CJP-related post; for BJP stories, focus on criticism/opposition
              # and major controversies rather than generic/supportive BJP chatter.
              is_cjp = any(term in lower_text for term in ("cjp", "abhijeet dipke", "ashutosh ranka", "saurav das", "ashu", "अभिजीत दीपके", "अभिजीत दिपके", "आशुतोष रांका", "सौरव दास"))
              bjp_criticism_terms = (
                  "against bjp", "bjp government", "modi government", "protest",
                  "criticism", "scandal", "controversy", "corruption", "failure",
                  "unemployment", "inflation", "farmers", "women safety", "paper leak",
                  "electoral bonds", "vote", "election", "court", "constitution",
                  "विरोध", "आलोचना", "घोटाला", "भ्रष्टाचार", "नाकामी", "महंगाई",
                  "बेरोजगारी", "किसान", "पेपर लीक", "चुनाव", "सरकार", "मोदी"
              )
              is_bjp_criticism = ("bjp" in lower_text or "भारतीय जनता पार्टी" in lower_text
                                  or "modi" in lower_text or "मोदी" in lower_text) and any(
                                      term in lower_text for term in bjp_criticism_terms
                                  )
              major_issue_terms = (
                  "supreme court", "high court", "election commission", "gyanesh kumar",
                  "parliament", "minister resign", "resignation", "paper leak", "neet",
                  "farmers protest", "unemployment", "inflation", "women safety", "corruption",
                  "लोकसभा", "सुप्रीम कोर्ट", "हाई कोर्ट", "चुनाव आयोग", "ज्ञानेश कुमार",
                  "पेपर लीक", "बेरोजगारी", "महंगाई", "किसान आंदोलन", "भ्रष्टाचार"
              )
              is_major_india_issue = any(term in lower_text for term in major_issue_terms)
              if not (is_cjp or is_bjp_criticism or is_major_india_issue):
                  continue

              substantive = [
                  t for t in words(text)
                  if len(t) >= 4 and t not in stop and not t.isdigit()
              ]
              if not substantive:
                  continue

              # Verify against a recent independent news article from an established outlet.
              # A social post alone is never treated as confirmation.
              # Search the actual issue keywords; don't force every story to mention CJP.
              query_terms = substantive[:6]
              rss_query = urllib.parse.quote(" ".join(query_terms))
              rss_url = (
                  "https://news.google.com/rss/search?q=" + rss_query
                  + "&hl=en-IN&gl=IN&ceid=IN:en"
              )
              try:
                  req = urllib.request.Request(
                      rss_url, headers={"User-Agent": "Mozilla/5.0 MrAhlawatShorts/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=20) as response:
                      xml_data = response.read()
                  root = ET.fromstring(xml_data)
              except Exception as e:
                  print("NEWS_CORROBORATION_SEARCH_WARNING:", repr(e))
                  continue

              matches = []
              for item in root.findall(".//item")[:15]:
                  article_title = (item.findtext("title") or "").strip()
                  article_link = (item.findtext("link") or "").strip()
                  source_node = item.find("source")
                  source_name = source_node.text.strip() if source_node is not None and source_node.text else ""
                  source_url = source_node.get("url", "") if source_node is not None else ""
                  domain = (urlparse(source_url or article_link).hostname or "").lower()
                  if not any(domain == d or domain.endswith("." + d) for d in trusted_domains):
                      continue
                  pub_date = item.findtext("pubDate") or ""
                  try:
                      published = parsedate_to_datetime(pub_date)
                      if published.tzinfo is None:
                          published = published.replace(tzinfo=timezone.utc)
                      if now - published.astimezone(timezone.utc) > timedelta(days=7):
                          continue
                  except Exception:
                      continue
                  title_words = words(article_title)
                  overlap = (set(substantive) & title_words)
                  if len(overlap) >= 2:
                      matches.append({
                          "title": article_title, "url": article_link,
                          "source": source_name, "matched_terms": sorted(overlap)
                      })
              if matches:
                  selected = {
                      "id": post_id, "text": text, "url": post_url,
                      "createdAt": post.get("createdAt", ""),
                      "author": post.get("author", {}),
                      "corroborating_articles": matches[:3],
                  "raw_post": post
                  }
                  break

          if not selected:
              # X search can return HTTP 402 when the account's API plan does not include search.
              # Keep X as the first-choice lead; if unavailable, use current independent coverage
              # to create a preview rather than silently failing or inventing an X post.
              fallback_queries = [
                  '"CJP" "Abhijeet Dipke" "Ashutosh Ranka" "Saurav Das"',
                  '"Ashutosh Ranka" "Saurav Das" custody Delhi',
                  '"CJP" Jantar Mantar Gyanesh Kumar latest'
              ]
              for fallback_query in fallback_queries:
                  rss_url = "https://news.google.com/rss/search?q=" + urllib.parse.quote(fallback_query) + "&hl=en-IN&gl=IN&ceid=IN:en"
                  try:
                      req = urllib.request.Request(rss_url, headers={"User-Agent": "Mozilla/5.0 MrAhlawatShorts/1.0"})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          root = ET.fromstring(response.read())
                  except Exception as e:
                      print("NEWS_FALLBACK_WARNING:", repr(e))
                      continue
                  for item in root.findall(".//item")[:20]:
                      article_title = (item.findtext("title") or "").strip()
                      article_link = (item.findtext("link") or "").strip()
                      source_node = item.find("source")
                      source_name = source_node.text.strip() if source_node is not None and source_node.text else ""
                      source_url = source_node.get("url", "") if source_node is not None else ""
                      domain = (urlparse(source_url or article_link).hostname or "").lower()
                      if not any(domain == d or domain.endswith("." + d) for d in trusted_domains):
                          continue
                      pub_date = item.findtext("pubDate") or ""
                      try:
                          published = parsedate_to_datetime(pub_date)
                          if published.tzinfo is None:
                              published = published.replace(tzinfo=timezone.utc)
                          if now - published.astimezone(timezone.utc) > timedelta(days=3):
                              continue
                      except Exception:
                          continue
                      lower_title = article_title.lower()
                      if not any(term in lower_title for term in ("cjp", "cockroach", "abhijeet", "ashutosh ranka", "saurav das", "sourav das", "gyanesh kumar")):
                          continue
                      selected = {
                          "id": "news-fallback-" + str(abs(hash(article_link))),
                          "text": article_title,
                          "url": article_link,
                          "createdAt": pub_date,
                          "author": {"username": source_name, "name": source_name},
                          "corroborating_articles": [{
                              "title": article_title, "url": article_link,
                              "source": source_name, "matched_terms": ["CJP/current-affairs fallback"]
                          }],
                          "raw_post": {},
                          "source_type": "news_fallback_x_search_unavailable"
                      }
                      print("X_SEARCH_UNAVAILABLE_USING_RECENT_VERIFIED_NEWS_FALLBACK:", article_link)
                      break
                  if selected:
                      break

          if not selected:
              print("NO_CJP_OR_BJP_CRITICISM_STORY_CORROBORATED_BY_RECENT_TRUSTED_NEWS; skipping upload.")
              output("should_run", "false")
              raise SystemExit(0)

          # Persist the selected ID in the cache file; cache is saved only after successful upload.
          seen.add(selected["id"])
          state["ids"] = list(seen)[-5000:]
          with open(state_path, "w", encoding="utf-8") as f:
              json.dump(state, f, ensure_ascii=False, indent=2)
          with open("output/cjp_source.json", "w", encoding="utf-8") as f:
              json.dump(selected, f, ensure_ascii=False, indent=2)

          topic = ("CJP update: " if "cjp" in selected["text"].lower() else "BJP-विरोधी वायरल/बड़ा मुद्दा: ") + selected["text"][:500]
          output("should_run", "true")
          output("topic", topic)
          output("post_id", selected["id"])
          print("INDIA_ISSUE_POST_SELECTED:", selected["url"])
          print("INDEPENDENT_NEWS_MATCHES:", len(selected["corroborating_articles"]))
          for article in selected["corroborating_articles"]:
              print("CORROBORATING_SOURCE:", article["source"], article["url"])
          PY

