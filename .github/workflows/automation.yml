                  except Exception as image_error:
                      print("Reporter photo candidate failed:", image_error)

              if not downloaded:
                  print("Free reporter intro skipped: could not download a suitable photo.")
                  raise SystemExit(0)

              # The main renderer mixes in the existing Hindi Piper narration.
              subprocess.run([
                  "ffmpeg", "-y",
                  "-loop", "1", "-framerate", "30", "-t", "7.5",
                  "-i", portrait_path,
                  "-vf",
                  "scale=1080:1920:force_original_aspect_ratio=increase,"
                  "crop=1080:1920,"
                  "zoompan=z='min(zoom+0.0007,1.10)':"
                  "x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':"
                  "d=1:s=1080x1920:fps=30,"
                  "format=yuv420p",
                  "-an", "-c:v", "libx264", "-preset", "veryfast",
                  "-pix_fmt", "yuv420p", "-r", "30",
                  output_path
              ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)

              if not os.path.exists(output_path) or os.path.getsize(output_path) < 10000:
                  raise RuntimeError("FFmpeg did not create a valid reporter intro clip")
              print("FREE_REPORTER_INTRO_SUCCESS")
          except SystemExit:
              raise
          except Exception as error:
              print("Free reporter intro unavailable; main video will use its regular visuals.")
              print(type(error).__name__ + ": " + str(error))
          PY

      - name: Create Ground Report video with Hindi captions
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core

          python - <<'PY'
          import json
          import wave
          import re
          import os
          import glob
          import subprocess

          with open("output/metadata.json", encoding="utf-8") as f:
              script = json.load(f)["script"].strip()

          with wave.open("output/voiceover.wav", "rb") as wav:
              duration = wav.getnframes() / wav.getframerate()

          if duration <= 0:
              raise RuntimeError("Voice-over duration is invalid")

          sentences = re.split(r'(?<=[।!?])\s+', script)
          chunks = []

          for sentence in sentences:
              words = sentence.split()
              line = ""
              for word in words:
                  candidate = (line + " " + word).strip()
                  if len(candidate) > 32 and line:
                      chunks.append(line)
                      line = word
                  else:
                      line = candidate
              if line:
                  chunks.append(line)

          if not chunks:
              raise RuntimeError("No captions generated")

          def stamp(seconds):
              cs = int(round(seconds * 100))
              h, cs = divmod(cs, 360000)
              m, cs = divmod(cs, 6000)
              s, cs = divmod(cs, 100)
              return f"{h}:{m:02}:{s:02}.{cs:02}"

          weights = [max(1, len(c)) for c in chunks]
          total_weight = sum(weights)
          elapsed = 0.0

          with open("output/captions.ass", "w", encoding="utf-8") as f:
              f.write("[Script Info]\n")
              f.write("ScriptType: v4.00+\n")
              f.write("PlayResX: 1080\nPlayResY: 1920\n\n")
              f.write("[V4+ Styles]\n")
              f.write("Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\n")
              f.write("Style: Default,Noto Sans Devanagari,46,&H00FFFFFF,&H0000FFFF,&H0010152B,&HFF000000,-1,0,0,0,100,100,0,0,1,2,0,2,70,70,260,1\\n\\n")
              f.write("[Events]\n")
              f.write("Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n")

              for chunk, weight in zip(chunks, weights):
                  start = elapsed
                  elapsed += duration * weight / total_weight
                  safe_chunk = chunk.replace("{", "(").replace("}", ")")
                  f.write(
                      f"Dialogue: 0,{stamp(start)},{stamp(elapsed)},Default,,0,0,0,,{safe_chunk}\n"
                  )

          # Create topic-specific text assets for the newsroom layout.
          with open("output/metadata.json", encoding="utf-8") as f:
              metadata = json.load(f)
          headline = re.sub(r"\s+", " ", metadata.get("title", "MR AHLAWAT NEWS")).strip()
          headline = headline.replace("\\", " ").replace("'", "’")
          ticker = re.sub(r"\s+", " ", metadata.get("description", script)).strip()
          ticker = ticker.replace("\\", " ").replace("'", "’")
          with open("output/headline.txt", "w", encoding="utf-8") as f:
              f.write(headline[:90])
          with open("output/ticker.txt", "w", encoding="utf-8") as f:
              f.write(("  •  BREAKING UPDATE  •  " + ticker + "  •  ")[:240])

          video_clips = sorted(glob.glob("output/media/clip_*.mp4"))[:2]
          images = sorted(glob.glob("output/media/image_*"))[:5]
          reporter_path = "output/media/reporter_intro.mp4"
          assets = ([("reporter", reporter_path)] if os.path.exists(reporter_path) else [])
          assets += [("video", path) for path in video_clips] + [
              ("image", path) for path in images
          ]

          if not assets:
              raise RuntimeError("No image or video visuals found.")

          # If D-ID succeeded, show the lip-synced reporter first, then B-roll/photos.
          transition_duration = 0.45
          if assets[0][0] == "reporter" and len(assets) > 1:
              reporter_duration = min(7.5, max(3.0, duration * 0.2))
              remaining_duration = (
                  duration + transition_duration * (len(assets) - 1) - reporter_duration
              ) / (len(assets) - 1)
              segment_durations = [reporter_duration] + [
                  remaining_duration for _ in assets[1:]
              ]
          else:
              segment_duration = (
                  duration + transition_duration * (len(assets) - 1)
              ) / len(assets)
              segment_durations = [segment_duration] * len(assets)

          args = ["ffmpeg", "-y"]
          for (kind, path), segment_duration in zip(assets, segment_durations):
              if kind in ("video", "reporter"):
                  args += ["-stream_loop", "-1", "-i", path]
              else:
                  args += ["-loop", "1", "-framerate", "30",
                           "-t", f"{segment_duration:.3f}", "-i", path]

          filters = []
          labels = []

          for i, ((kind, path), segment_duration) in enumerate(zip(assets, segment_durations)):
              label = f"v{i}"
              if kind in ("video", "reporter"):
                  filters.append(
                      f"[{i}:v]trim=duration={segment_duration:.3f},"
                      f"setpts=PTS-STARTPTS,scale=1080:1920:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop=1080:1920,setsar=1,fps=30,"
                      f"eq=contrast=1.04:saturation=1.08:brightness=-0.01,"
                      f"unsharp=5:5:0.35:3:3:0.12,"
                      f"format=yuv420p,settb=AVTB[{label}]"
                  )
              else:
                  filters.append(
                      f"[{i}:v]scale=1080:1920:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop=1080:1920,setsar=1,fps=30,"
                      f"zoompan=z='min(zoom+0.0005,1.08)':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,"
                      f"eq=contrast=1.04:saturation=1.08:brightness=-0.01,"
                      f"unsharp=5:5:0.35:3:3:0.12,"
                      f"format=yuv420p,settb=AVTB[{label}]"
                  )
              labels.append(f"[{label}]")

          previous = labels[0]
          for i in range(1, len(labels)):
              output_label = f"xf{i}"
              offset = sum(segment_durations[:i]) - i * transition_duration
              filters.append(
                  f"{previous}{labels[i]}"
                  f"xfade=transition=fade:duration={transition_duration}:"
                  f"offset={offset:.3f}[{output_label}]"
              )
              previous = f"[{output_label}]"

          filters.append(f"{previous}format=yuv420p[outv]")

          args += [
              "-filter_complex", ";".join(filters),
              "-map", "[outv]", "-an",
              "-c:v", "libx264", "-preset", "veryfast",
              "-pix_fmt", "yuv420p",
              "-t", f"{duration:.3f}",
              "output/visuals.mp4"
          ]

          subprocess.run(args, check=True)
          print(f"GROUND_REPORT_VISUALS_CREATED: {len(assets)} segments ({len(video_clips)} video clips, {len(images)} photos)")
          print(f"VOICEOVER_DURATION: {duration:.2f} seconds")
          PY

          ffmpeg -y \
            -i output/visuals.mp4 \
            -i output/voiceover.mp3 \
            -filter_complex "[0:v]drawbox=x=0:y=0:w=1080:h=112:color=0x071426@0.62:t=fill,drawbox=x=0:y=108:w=14:h=112:color=0xE53935:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='MR AHLAWAT':fontcolor=white:fontsize=42:x=42:y=27:shadowcolor=black:shadowx=2:shadowy=2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='GROUND REPORT':fontcolor=0x00D9FF:fontsize=25:x=42:y=76,subtitles=filename=output/captions.ass[v]" \
            -map "[v]" \
            -map 1:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -tune stillimage \
            -shortest \
            output/mr-ahlawat-short.mp4

      - name: Save generated files
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        uses: actions/upload-artifact@v6
        with:
          name: mr-ahlawat-ai-short
          path: output/
          retention-days: 3

      - name: Upload video to YouTube
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        id: upload
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import sys

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError, ResumableUploadError

          with open("output/metadata.json", encoding="utf-8") as f:
              metadata = json.load(f)

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"]
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials,
              cache_discovery=False
          )

          video = MediaFileUpload(
              "output/mr-ahlawat-short.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": metadata["title"],
                      "description": metadata["description"],
                      "categoryId": "22"
                  },
                  "status": {
                      "privacyStatus": "private",
                      "selfDeclaredMadeForKids": False
                  }
              },
              media_body=video
          )

          try:
              response = request.execute()
          except (HttpError, ResumableUploadError) as e:
              if "uploadLimitExceeded" in str(e):
                  print("YOUTUBE_UPLOAD_LIMIT_REACHED")
                  print("Generated video is saved in the workflow artifact.")
                  sys.exit(0)
              raise

          print("YOUTUBE_UPLOAD_SUCCESS")
          print("Video ID:", response["id"])
          print("Video URL: https://www.youtube.com/watch?v=" + response["id"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write("uploaded=true\n")
          PY

      - name: Update daily upload counter after successful upload
        if: steps.upload.outputs.uploaded == 'true' && success()
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          path = ".github/daily-upload-count.json"
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
          try:
              with open(path, encoding="utf-8") as f:
                  state = json.load(f)
          except (OSError, json.JSONDecodeError):
              state = {}
          count = int(state.get("count", 0)) if state.get("date") == today else 0
          state = {"date": today, "count": count + 1}
          with open(path, "w", encoding="utf-8") as f:
              json.dump(state, f)
          print(f"DAILY_UPLOAD_COUNT_SAVED: {state['count']}/3 for {today} IST")
          PY

      - name: Save daily upload counter
        if: steps.upload.outputs.uploaded == 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .github/daily-upload-count.json
          key: daily-upload-count-${{ github.run_id }}

      - name: Save CJP duplicate state after successful upload
        if: github.event_name == 'schedule' && steps.cjp.outputs.should_run == 'true' && steps.upload.outputs.uploaded == 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: .github/cjp-seen.json
          key: cjp-seen-${{ github.run_id }}
