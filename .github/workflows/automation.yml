                  )
                  nasa_response.raise_for_status()
                  nasa_items = nasa_response.json().get("collection", {}).get("items", [])
                  for nasa_item in nasa_items:
                      if video_count >= 5:
                          break
                      data = (nasa_item.get("data") or [{}])[0]
                      nasa_id = data.get("nasa_id", "")
                      nasa_title = data.get("title", "")
                      if not nasa_id:
                          continue
                      # Require meaningful query/title overlap to avoid generic unrelated clips.
                      query_words = {w.lower() for w in re.findall(r"[A-Za-z0-9]+", (queries[0] if queries else topic)) if len(w) > 3}
                      title_words = {w.lower() for w in re.findall(r"[A-Za-z0-9]+", nasa_title) if len(w) > 3}
                      if query_words and not (query_words & title_words):
                          continue
                      asset_response = session.get(
                          f"https://images-api.nasa.gov/asset/{nasa_id}", timeout=25
                      )
                      asset_response.raise_for_status()
                      asset_urls = asset_response.json().get("collection", {}).get("items", [])
                      mp4_url = next((x.get("href") for x in asset_urls
                                      if str(x.get("href", "")).lower().endswith(".mp4")), None)
                      if not mp4_url:
                          continue
                      raw = session.get(mp4_url, timeout=90)
                      raw.raise_for_status()
                      if len(raw.content) < 20000 or len(raw.content) > 120_000_000:
                          continue
                      raw_path = "output/media/nasa_video_source.mp4"
                      with open(raw_path, "wb") as out:
                          out.write(raw.content)
                      mp4_path = f"output/media/clip_{video_count + 1:02d}.mp4"
                      converted = subprocess.run(
                          ["ffmpeg", "-y", "-i", raw_path, "-t", "20",
                           "-vf", "scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2",
                           "-an", "-c:v", "libx264", "-preset", "veryfast", "-pix_fmt", "yuv420p", mp4_path],
                          stdout=subprocess.DEVNULL, stderr=subprocess.PIPE
                      )
                      os.remove(raw_path)
                      if converted.returncode == 0 and os.path.exists(mp4_path) and os.path.getsize(mp4_path) > 10000:
                          video_count += 1
                          source_page = f"https://images.nasa.gov/details/{nasa_id}"
                          attribution.append(f"NASA video | {nasa_title} | Review NASA media usage guidelines and third-party notices | Source: {source_page}")
                          print("NASA_VIDEO_DOWNLOADED:", nasa_id, nasa_title[:120])
              except Exception as nasa_error:
                  print("NASA_VIDEO_SOURCE_WARNING:", repr(nasa_error))
          
          # Internet Archive advanced search: download only when the item metadata explicitly
          # declares public-domain/CC0/Creative Commons terms; otherwise keep a review link.
          if video_count < 5:
              try:
                  ia_query = (queries[0] if queries else topic or title).replace('"', " ")
                  ia_response = session.get(
                      "https://archive.org/advancedsearch.php",
                      params={"q": f'mediatype:movies AND (title:({ia_query}) OR description:({ia_query}))',
                              "fl[]": ["identifier", "title", "licenseurl", "rights", "description"],
                              "rows": 10, "page": 1, "output": "json"},
                      timeout=30
                  )
                  ia_response.raise_for_status()
                  ia_docs = ia_response.json().get("response", {}).get("docs", [])
                  for doc in ia_docs:
                      if video_count >= 5:
                          break
                      ident = str(doc.get("identifier", "")).strip()
                      if not ident:
                          continue
                      ia_url = f"https://archive.org/details/{ident}"
                      source_links.append(f"Internet Archive candidate (check item rights): {ia_url} | {str(doc.get('title',''))[:150]}")
                      rights_text = " ".join(str(doc.get(k, "")) for k in ("licenseurl", "rights")).lower()
                      allowed_rights = any(term in rights_text for term in (
                          "creativecommons.org/licenses/by/", "creativecommons.org/licenses/by-sa/",
                          "creativecommons.org/publicdomain/zero", "creativecommons.org/publicdomain/mark",
                          "public domain", "cc0", "creative commons attribution"
                      ))
                      if not allowed_rights:
                          continue
                      meta_response = session.get(f"https://archive.org/metadata/{ident}", timeout=25)
                      meta_response.raise_for_status()
                      files = meta_response.json().get("files", [])
                      candidates = [f for f in files if str(f.get("name", "")).lower().endswith((".mp4", ".m4v", ".mov"))
                                    and int(f.get("size", 0) or 0) < 120_000_000]
                      if not candidates:
                          continue
                      file_meta = min(candidates, key=lambda f: int(f.get("size", 0) or 0))
                      file_url = f"https://archive.org/download/{urllib.parse.quote(ident)}/{urllib.parse.quote(file_meta['name'])}"
                      raw = session.get(file_url, timeout=90)
                      raw.raise_for_status()
                      if len(raw.content) < 20000:
                          continue
                      raw_path = "output/media/internet_archive_source.mp4"
                      with open(raw_path, "wb") as out:
                          out.write(raw.content)
                      mp4_path = f"output/media/clip_{video_count + 1:02d}.mp4"
                      converted = subprocess.run(
                          ["ffmpeg", "-y", "-i", raw_path, "-t", "20",
                           "-vf", "scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2",
                           "-an", "-c:v", "libx264", "-preset", "veryfast", "-pix_fmt", "yuv420p", mp4_path],
                          stdout=subprocess.DEVNULL, stderr=subprocess.PIPE
                      )
                      os.remove(raw_path)
                      if converted.returncode == 0 and os.path.exists(mp4_path) and os.path.getsize(mp4_path) > 10000:
                          video_count += 1
                          attribution.append(f"Internet Archive video | {doc.get('title', ident)} | Rights metadata: {rights_text[:240]} | Source: {ia_url}")
                          print("INTERNET_ARCHIVE_VIDEO_DOWNLOADED:", ident)
              except Exception as ia_error:
                  print("INTERNET_ARCHIVE_SOURCE_WARNING:", repr(ia_error))
          
          # Optional DVIDS API: only searches when the user adds a DVIDS_API_KEY secret.
          # Candidate URLs are written for review; DVIDS item restrictions must be checked.
          dvids_key = os.environ.get("DVIDS_API_KEY", "").strip()
          if dvids_key:
              try:
                  dvids_response = session.get(
                      "https://api.dvidshub.net/search",
                      params={"type": "video", "q": (topic or title)[:150],
                              "page": 1, "max_results": 8, "api_key": dvids_key},
                      timeout=25
                  )
                  dvids_response.raise_for_status()
                  dvids_data = dvids_response.json()
                  for entry in (dvids_data.get("results") or dvids_data.get("data") or [])[:8]:
                      link = entry.get("url") or entry.get("share_url") or entry.get("link")
                      if link:
                          source_links.append("DVIDS candidate (check item restrictions): " + str(link))
                  print("DVIDS_CANDIDATES_FOUND:", len(source_links))
              except Exception as dvids_error:
                  print("DVIDS_API_DISCOVERY_WARNING:", repr(dvids_error))
          else:
              print("DVIDS_API_KEY_NOT_SET: source site link saved; optional API discovery skipped.")
          
          with open("output/video_source_links.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(source_links) + "\n")
          print("VIDEO_SOURCE_LINKS_SAVED:", len(source_links))
          
          # Free Wikimedia Commons moving-footage fallback; no API key required.
          # Use it for protest stories, while preserving creator/license attribution.
          if is_protest_story:
              for search_term in queries[:5] + ["India protest demonstration rally crowd", "Jantar Mantar protest India"]:
                  if video_count >= 5:
                      break
                  try:
                      response = session.get("https://commons.wikimedia.org/w/api.php", params={"action": "query", "format": "json", "list": "search", "srnamespace": 6, "srsearch": search_term, "srlimit": 8}, timeout=30)
                      response.raise_for_status()
                      results = response.json().get("query", {}).get("search", [])
                      for result in results:
                          if video_count >= 5:
                              break
                          file_title = result.get("title", "")
                          if not file_title:
                              continue
                          detail = session.get("https://commons.wikimedia.org/w/api.php", params={"action": "query", "format": "json", "titles": file_title, "prop": "imageinfo", "iiprop": "url|mime|extmetadata"}, timeout=30)
                          detail.raise_for_status()
                          pages = detail.json().get("query", {}).get("pages", {})
                          for page in pages.values():
                              info = page.get("imageinfo", [{}])[0]
                              if not info.get("mime", "").startswith("video/") or not info.get("url"):
                                  continue
                              raw_path = "output/media/commons_video_source"
                              try:
                                  raw = session.get(info["url"], timeout=90)
                                  raw.raise_for_status()
                                  if len(raw.content) < 20000:
                                      continue
                                  with open(raw_path, "wb") as out:
                                      out.write(raw.content)
                                  mp4_path = f"output/media/clip_{video_count + 1:02d}.mp4"
                                  converted = subprocess.run(["ffmpeg", "-y", "-i", raw_path, "-t", "20", "-vf", "scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2", "-an", "-c:v", "libx264", "-preset", "veryfast", "-pix_fmt", "yuv420p", mp4_path], stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
                                  os.remove(raw_path)
                                  if converted.returncode != 0 or not os.path.exists(mp4_path) or os.path.getsize(mp4_path) < 10000:
                                      if os.path.exists(mp4_path): os.remove(mp4_path)
                                      continue
                                  video_count += 1
                                  meta = info.get("extmetadata", {})
                                  artist = meta.get("Artist", {}).get("value", "Unknown")
                                  license_name = meta.get("LicenseShortName", {}).get("value", "Check license")
                                  source_page = "https://commons.wikimedia.org/wiki/" + quote(file_title.replace(" ", "_"))
                                  attribution.append(f"Commons video | {file_title} | Creator: {artist} | License: {license_name} | Source: {source_page}")
                                  print(f"COMMONS_PROTEST_VIDEO_DOWNLOADED: {video_count}: {file_title}")
                                  break
                              except Exception as video_error:
                                  print("Commons video candidate failed:", video_error)
                  except Exception as commons_error:
                      print(f"Commons video search warning for '{search_term}': {commons_error}")

          with open("output/media_attribution.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(attribution))

          print(f"WIKIMEDIA_IMAGES_DOWNLOADED: {saved}")
          print(f"PROTEST_OR_TOPIC_VIDEO_CLIPS_DOWNLOADED: {video_count}")

          if saved == 0:
              print("No topic-matched photos found; do not generate text-card images as fake footage.")

          # Try Pixabay only when its own tags/title explicitly match the current story.
          # Never fill a protest report with generic birds, landmarks, nature or travel footage.
          video_key = os.environ.get("PIXABAY_API_KEY", "").strip()
          if video_key:
              for search_term in queries[:3]:
                  if video_count >= 5:
                      break
                  try:
                      api = session.get(
                          "https://pixabay.com/api/videos/",
                          params={"key": video_key, "q": search_term, "per_page": 5,
                                  "safesearch": "true", "video_type": "film"},
                          timeout=30
                      )
                      api.raise_for_status()
                      hits = api.json().get("hits", [])
                      protest_terms = {"protest", "protests", "demonstration", "demonstrations", "rally", "march", "dharna", "andolan", "crowd", "activist", "activists", "police", "demonstrators", "barricade", "barricades", "cjp", "court", "judge", "justice", "election", "commission"}
                      for hit in hits:
                          if video_count >= 5:
                              break
                          asset_words = {w.lower() for w in re.findall(r"[A-Za-z0-9\u0900-\u097F]+", str(hit.get("tags", "")) + " " + str(hit.get("pageURL", "")) + " " + str(hit.get("title", "")) if len(w) > 2}
                          if is_protest_story and not (asset_words & protest_terms):
                              print("PIXABAY_VIDEO_REJECTED_IRRELEVANT:", hit.get("id"), str(hit.get("tags", ""))[:120])
                              continue
                          variants = hit.get("videos", {})
                          clip = variants.get("medium") or variants.get("small") or variants.get("large")
                          if not clip or not clip.get("url"):
                              continue
                          try:
                              video_response = session.get(clip["url"], timeout=60)
                              video_response.raise_for_status()
                              if len(video_response.content) < 20000:
                                  continue
                              video_count += 1
                              video_path = f"output/media/clip_{video_count:02d}.mp4"
                              with open(video_path, "wb") as out:
                                  out.write(video_response.content)
                              attribution.append(
                                  f"Pixabay video | ID: {hit.get('id', 'unknown')} | "
                                  f"Source: https://pixabay.com/videos/"
                              )
                              print(f"PIXABAY_VIDEO_DOWNLOADED: {video_count}")
                          except Exception as clip_error:
                              print(f"Video download warning: {clip_error}")
                  except Exception as api_error:
                      print(f"Pixabay video search unavailable: {api_error}")
          else:
              print("PIXABAY_API_KEY not configured; using photo visuals for this run.")

          # Additional official free-video source: Pexels API (optional key).
          # Search multiple topic-relevant queries; preserve creator/source attribution.
          pexels_key = os.environ.get("PEXELS_API_KEY", "").strip()
          if pexels_key:
              pexels_queries = queries[:3] + ["India street crowd", "Indian city traffic", "public demonstration India"]
              for search_term in pexels_queries:
                  if video_count >= 5:
                      break
                  try:
                      response = session.get(
                          "https://api.pexels.com/videos/search",
                          headers={"Authorization": pexels_key},
                          params={"query": search_term, "orientation": "portrait", "per_page": 10},
                          timeout=30
                      )
                      response.raise_for_status()
                      for hit in response.json().get("videos", []):
                          if video_count >= 5:
                              break
                          files = sorted(hit.get("video_files", []),
                              key=lambda item: item.get("width", 0) * item.get("height", 0), reverse=True)
                          clip = next((item for item in files if item.get("link") and item.get("file_type", "").startswith("video/")), None)
                          if not clip:
                              continue
                          try:
                              video_response = session.get(clip["link"], timeout=60)
                              video_response.raise_for_status()
                              if len(video_response.content) < 20000:
                                  continue
                              video_path = f"output/media/clip_{video_count + 1:02d}.mp4"
                              with open(video_path, "wb") as out:
                                  out.write(video_response.content)
                              video_count += 1
                              user = hit.get("user", {}).get("name", "unknown creator")
                              attribution.append(
                                  f"Pexels video | ID: {hit.get('id', 'unknown')} | Creator: {user} | "
                                  f"Query: {search_term} | Source: {hit.get('url', 'https://www.pexels.com/')}"
                              )
                              print(f"PEXELS_VIDEO_DOWNLOADED: {video_count} query={search_term}")
                          except Exception as clip_error:
                              print("Pexels video download warning:", repr(clip_error))
                  except Exception as api_error:
                      print(f"Pexels video search unavailable for '{search_term}': {api_error}")
          else:
              print("PEXELS_API_KEY not configured; Pexels B-roll search skipped.")

          with open("output/media_attribution.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(attribution))

          visuals = [
              name for name in os.listdir("output/media")
              if (name.startswith("image_") or name.startswith("social_image_")
                  or name == "india_gate_landmark.jpg")
              and name.lower().endswith((".jpg", ".jpeg", ".png", ".webp"))
          ]
          visuals = sorted(visuals)[:7]
          if not visuals:
              raise RuntimeError("No visuals were downloaded or generated")
          print(f"VISUAL_FILES_READY: {len(visuals)}")
          PY

      - name: Generate one AI editorial illustration for the visual storyboard
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false' && inputs.generate_ai_images == true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SHORT_TOPIC: ${{ steps.cjp.outputs.topic || inputs.topic || 'CJP से जुड़ी ताज़ा और सत्यापित दिल्ली-NCR खबर' }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import os, json, base64, requests
          key = os.environ.get("OPENAI_API_KEY", "").strip()
          if not key:
              print("AI_IMAGE_SKIPPED: OPENAI_API_KEY secret is not configured; continuing with sourced media.")
              raise SystemExit(0)
          with open("output/metadata.json", encoding="utf-8") as f:
              metadata = json.load(f)
          topic = str(metadata.get("title") or os.environ.get("SHORT_TOPIC", "current affairs")).strip()
          script = str(metadata.get("script", "")).strip()[:500]
          prompt = (
              "Create a high-quality vertical 9:16 editorial illustration for a Hindi current-affairs short. "
              "Topic: " + topic + ". Context: " + script + ". "
              "Show a grounded Indian public-interest reporting atmosphere with realistic street-level lighting, "
              "documentary composition, natural colors, strong visual storytelling, no TV studio, no text, no logos. "
              "This must be an illustrative scene, not a fabricated photograph of a real named person or a claim that "
              "this exact event was photographed. Do not depict identifiable politicians or activists."
          )
          response = requests.post(
              "https://api.openai.com/v1/images/generations",
              headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"},
              json={"model": "gpt-image-1", "prompt": prompt, "size": "1024x1536", "quality": "medium", "output_format": "png", "n": 1},
              timeout=180
          )
          if response.status_code != 200:
              print("AI_IMAGE_API_WARNING:", response.status_code, response.text[:1200])
              raise SystemExit(0)
          data = response.json().get("data", [])
          if not data or not data[0].get("b64_json"):
              print("AI_IMAGE_API_WARNING: response did not include image bytes")
              raise SystemExit(0)
          path = "output/media/image_00a_ai_generated.png"
          with open(path, "wb") as f:
              f.write(base64.b64decode(data[0]["b64_json"]))
          if os.path.getsize(path) < 10000:
              os.remove(path)
              print("AI_IMAGE_REJECTED: generated file was unexpectedly small")
              raise SystemExit(0)
          with open("output/media/ai_generated_image_note.txt", "w", encoding="utf-8") as f:
              f.write("AI-generated editorial illustration, not documentary evidence of the reported event.\n")
          with open("output/media/attribution.txt", "a", encoding="utf-8") as f:
              f.write("\nAI-generated editorial illustration via OpenAI Images API; illustrative only, not evidence of the specific event.\n")
          print("AI_EDITORIAL_ILLUSTRATION_CREATED:", path, os.path.getsize(path), "bytes")
          PY

      - name: Find free moving street-reporter video intro (fallback only if talking avatar fails)
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          SHORT_TOPIC: ${{ steps.cjp.outputs.topic || inputs.topic }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import os, re, requests, subprocess
          from urllib.parse import quote

          media_dir = "output/media"
          os.makedirs(media_dir, exist_ok=True)
          output_path = os.path.join(media_dir, "reporter_stock_intro.mp4")
          topic = os.environ.get("SHORT_TOPIC", "").strip()
          pixabay_key = os.environ.get("PIXABAY_API_KEY", "").strip()
          pexels_key = os.environ.get("PEXELS_API_KEY", "").strip()
          session = requests.Session()
          session.headers.update({"User-Agent": "MrAhlawatShortsAutomation/1.0 (video sourcing)"})

          # Multiple searches, less brittle metadata filters. Never use a still image as video.
          # Only seek an outdoor Indian field-report look; avoid generic anchors and studio portraits.
          pixabay_queries = [
              "Indian street reporter microphone outdoor",
              "India protest field reporter microphone",
              "Indian journalist street interview crowd",
              "Delhi protest reporter microphone",
              "Indian reporter outdoor interview"
          ]
          pexels_queries = [
              "Indian street reporter outdoor microphone",
              "India protest field reporter",
              "Indian journalist street interview crowd",
              "Delhi protest street interview",
              "outdoor reporter microphone India"
          ]
          female_terms = ("woman", "women", "female", "girl", "blonde", "brunette", "lady", "actress", "beauty", "makeup")
          role_terms = ("reporter", "journalist", "interview", "microphone", "news", "press", "correspondent", "interviewing")
          outdoor_india_terms = ("india", "indian", "delhi", "street", "outdoor", "outside", "protest", "rally", "crowd", "roadside", "field report")
          def convert_to_intro(url, source_label):
              temp = os.path.join(media_dir, "reporter_candidate_source")
              try:
                  response = session.get(url, timeout=75)
                  response.raise_for_status()
                  if len(response.content) < 20000:
                      print("SKIP_TINY_REPORTER_CLIP:", source_label)
                      return False
                  with open(temp, "wb") as out:
                      out.write(response.content)
                  result = subprocess.run([
                      "ffmpeg", "-y", "-i", temp, "-t", "7.5",
                      "-vf", "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30,format=yuv420p",
                      "-an", "-c:v", "libx264", "-preset", "veryfast", "-pix_fmt", "yuv420p", output_path
                  ], stdout=subprocess.DEVNULL, stderr=subprocess.PIPE, timeout=90)
                  if result.returncode == 0 and os.path.exists(output_path) and os.path.getsize(output_path) > 10000:
                      with open(os.path.join(media_dir, "reporter_stock_intro_source.txt"), "w", encoding="utf-8") as marker:
                          marker.write(source_label + "\nReal moving reporter/interview footage with Hindi voice-over; not lip-synced and not proof of the specific event. Check source license before publication.\n")
                      print("REAL_VIDEO_INTRO_CREATED:", source_label)
                      return True
                  print("REPORTER_CLIP_CONVERT_FAILED:", source_label, result.stderr.decode("utf-8", "ignore")[-500:])
              except Exception as exc:
                  print("REPORTER_CLIP_FAILED:", source_label, repr(exc))
              finally:
                  if os.path.exists(temp):
                      os.remove(temp)
              return False

          found = False
          # Pixabay API: use role-based tags, but do not require a literal 'male' tag;
          # stock metadata often omits gender. Reject explicit female/model/beauty tags.
          if pixabay_key:
              for query in pixabay_queries:
                  if found: break
                  try:
                      resp = session.get("https://pixabay.com/api/videos/", params={
                          "key": pixabay_key, "q": query, "video_type": "film",
                          "safesearch": "true", "per_page": 30
                      }, timeout=30)
                      resp.raise_for_status()
                      hits = resp.json().get("hits", [])
                      print("PIXABAY_REPORTER_SEARCH:", query, "results:", len(hits))
                      for hit in hits:
                          tags = str(hit.get("tags", "")).lower()
                          if any(word in tags for word in female_terms):
                              continue
                          if not any(word in tags for word in role_terms):
                              continue
                          if not any(word in tags for word in outdoor_india_terms):
                              print("SKIP_GENERIC_OR_INDOOR_REPORTER_CLIP:", tags[:160])
                              continue
                          if not any(word in tags for word in ("microphone", "mic")):
                              print("SKIP_REPORTER_VIDEO_WITHOUT_MIC_TAG:", tags[:140])
                              continue
                          variants = hit.get("videos", {})
                          candidate = variants.get("medium") or variants.get("small") or variants.get("large")
                          if not candidate or not candidate.get("url"):
                              continue
                          source = f"Pixabay video ID {hit.get('id','unknown')} | Query: {query} | https://pixabay.com/videos/"
                          if convert_to_intro(candidate["url"], source):
                              found = True
                              break
                  except Exception as exc:
                      print("PIXABAY_REPORTER_SEARCH_WARNING:", query, repr(exc))
          else:
              print("PIXABAY_REPORTER_SEARCH_SKIPPED: PIXABAY_API_KEY secret not configured")

          # Pexels API: official video-search endpoint; optional free API key secret.
          if not found and pexels_key:
              for query in pexels_queries:
                  if found: break
                  try:
                      resp = session.get("https://api.pexels.com/videos/search",
                          headers={"Authorization": pexels_key},
                          params={"query": query, "orientation": "portrait", "per_page": 20}, timeout=30)
                      resp.raise_for_status()
                      videos = resp.json().get("videos", [])
                      print("PEXELS_REPORTER_SEARCH:", query, "results:", len(videos))
                      for video in videos:
                          files = sorted(video.get("video_files", []),
                              key=lambda item: (item.get("width", 0) * item.get("height", 0)), reverse=True)
                          candidate = next((item for item in files if item.get("link") and item.get("file_type", "").startswith("video/")), None)
                          if not candidate:
                              continue
                          user = video.get("user", {}).get("name", "unknown creator")
                          source = f"Pexels video ID {video.get('id','unknown')} | Creator: {user} | Query: {query} | {video.get('url','https://www.pexels.com/')}"
                          if convert_to_intro(candidate["link"], source):
                              found = True
                              break
                  except Exception as exc:
                      print("PEXELS_REPORTER_SEARCH_WARNING:", query, repr(exc))
          elif not found:
              print("PEXELS_REPORTER_SEARCH_SKIPPED: optional PEXELS_API_KEY secret not configured")

          # Wikimedia Commons API: no key required; only download files identified as video/*.
          if not found:
              commons_queries = ["Indian journalist interview video", "India street reporter video",
                  "India protest interview video", "journalist microphone video"]
              for query in commons_queries:
                  if found: break
                  try:
                      search = session.get("https://commons.wikimedia.org/w/api.php", params={
                          "action":"query", "format":"json", "list":"search", "srnamespace":6,
                          "srsearch": query, "srlimit":20
                      }, timeout=30)
                      search.raise_for_status()
                      results = search.json().get("query", {}).get("search", [])
                      print("COMMONS_REPORTER_SEARCH:", query, "results:", len(results))
                      for item in results:
                          title = item.get("title", "")
                          if not title:
                              continue
                          detail = session.get("https://commons.wikimedia.org/w/api.php", params={
                              "action":"query", "format":"json", "titles":title,
                              "prop":"imageinfo", "iiprop":"url|mime|extmetadata"
                          }, timeout=30)
                          detail.raise_for_status()
                          pages = detail.json().get("query", {}).get("pages", {})
                          for page in pages.values():
                              info = page.get("imageinfo", [{}])[0]
                              if not info.get("mime", "").startswith("video/") or not info.get("url"):
                                  continue
                              meta = info.get("extmetadata", {})
                              artist = re.sub("<[^>]+>", "", meta.get("Artist", {}).get("value", "Unknown creator"))
                              license_name = re.sub("<[^>]+>", "", meta.get("LicenseShortName", {}).get("value", "Check license"))
                              source_page = "https://commons.wikimedia.org/wiki/" + quote(title.replace(" ", "_"))
                              source = f"Wikimedia Commons: {title} | Creator: {artist} | License: {license_name} | {source_page}"
                              if convert_to_intro(info["url"], source):
                                  found = True
                                  break
                          if found: break
                  except Exception as exc:
                      print("COMMONS_REPORTER_SEARCH_WARNING:", query, repr(exc))

          if not found:
              print("STREET_REPORTER_INTRO_NOT_FOUND: no suitable moving reporter clip found; do not substitute still photos.")
          PY

      - name: Cache SadTalker model checkpoints
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        uses: actions/cache@v5
        with:
          path: /tmp/sadtalker-checkpoints
          key: sadtalker-checkpoints-crop256-v1

      - name: Generate free talking Indian male avatar with SadTalker (CPU)
        # Use a purpose-generated, non-identifiable Indian presenter portrait first; fall back to attributed Commons media only if image API is unavailable.
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        continue-on-error: true
        timeout-minutes: 40
        run: |
          set -e
          mkdir -p output/media output/sadtalker_source
          python - <<'PY'
          import io, re, os, base64, requests
          from PIL import Image
          key = os.environ.get("OPENAI_API_KEY", "").strip()
          if key:
              try:
                  prompt = (
                      "Photorealistic head-and-shoulders portrait of a fictional adult Indian male field reporter, "
                      "age about 30, medium-brown Indian skin, short neat black hair, subtle stubble, wearing a plain "
                      "dark navy collared shirt, facing directly toward camera, neutral friendly expression, lips gently "
                      "closed, both eyes clearly visible, shoulders visible, centered symmetrical face, natural daylight, "
                      "realistic Indian street background softly blurred, documentary photojournalism, vertical portrait. "
                      "No text, no logo, no microphone covering the mouth, no famous person, no resemblance to any real person."
                  )
                  response = requests.post(
                      "https://api.openai.com/v1/images/generations",
                      headers={"Authorization": "Bearer " + key, "Content-Type": "application/json"},
                      json={"model": "gpt-image-1", "prompt": prompt, "size": "1024x1536", "quality": "medium", "output_format": "png", "n": 1},
                      timeout=180
                  )
                  if response.status_code == 200:
                      rows = response.json().get("data", [])
                      if rows and rows[0].get("b64_json"):
                          generated = Image.open(io.BytesIO(base64.b64decode(rows[0]["b64_json"]))).convert("RGB")
                          if generated.width >= 250 and generated.height >= 250:
                              generated.save("output/sadtalker_source/reporter.jpg", "JPEG", quality=94)
                              with open("output/sadtalker_source/portrait_attribution.txt", "w", encoding="utf-8") as f:
                                  f.write("AI-generated fictional Indian male presenter portrait; not a real person or documentary evidence.\n")
                              print("SADTALKER_PORTRAIT_SOURCE: purpose-generated fictional Indian presenter")
                              raise SystemExit(0)
                  print("AI_REPORTER_PORTRAIT_WARNING:", response.status_code, response.text[:500])
              except SystemExit:
                  raise
              except Exception as exc:
                  print("AI_REPORTER_PORTRAIT_WARNING:", repr(exc))
          else:
              print("AI_REPORTER_PORTRAIT_SKIPPED: OPENAI_API_KEY not configured; trying attributed Commons portrait.")
          # Never animate an unrelated archival portrait. If image generation fails,
          # block the talking-avatar path and let the topic-matched footage carry the story.
          raise SystemExit(
              "No AI-generated fictional reporter portrait available; refusing unrelated Commons portrait fallback."
          )
          PY

          # SadTalker needs an older Python stack; isolate it so the working
          # voice/render Python environment remains untouched.
          git clone --depth 1 https://github.com/OpenTalker/SadTalker.git /tmp/SadTalker
          python -m pip install --quiet --upgrade uv
          uv python install 3.8
          uv venv --python 3.8 /tmp/sadtalker-venv
          uv pip install --python /tmp/sadtalker-venv/bin/python \
            "torch==1.12.1+cpu" "torchvision==0.13.1+cpu" \
            --extra-index-url https://download.pytorch.org/whl/cpu
          grep -v -E '^[[:space:]]*(gradio|torch|torchvision)([[:space:]]|[<=>~!]|$)' /tmp/SadTalker/requirements.txt > /tmp/SadTalker/requirements-cpu.txt
          uv pip install --python /tmp/sadtalker-venv/bin/python -r /tmp/SadTalker/requirements-cpu.txt
          # Download only the crop/256px checkpoints required for this run.
          # The upstream helper downloads both 256px and 512px models plus optional
          # face-enhancement weights, wasting time and disk on a CPU-only runner.
          mkdir -p /tmp/sadtalker-checkpoints
          ln -s /tmp/sadtalker-checkpoints /tmp/SadTalker/checkpoints
          BASE="https://github.com/OpenTalker/SadTalker/releases/download/v0.0.2-rc"
          # Crop mode uses mapping_00229; full-frame fallback requires mapping_00109.
          if [ ! -s /tmp/sadtalker-checkpoints/mapping_00109-model.pth.tar ]; then
            curl -fL --retry 3 "$BASE/mapping_00109-model.pth.tar" -o /tmp/sadtalker-checkpoints/mapping_00109-model.pth.tar
          else
            echo "SADTALKER_CACHE_HIT: full-frame mapping checkpoint"
          fi
          if [ ! -s /tmp/sadtalker-checkpoints/mapping_00229-model.pth.tar ]; then
            curl -fL --retry 3 "$BASE/mapping_00229-model.pth.tar" -o /tmp/sadtalker-checkpoints/mapping_00229-model.pth.tar
          else
            echo "SADTALKER_CACHE_HIT: mapping checkpoint"
          fi
          if [ ! -s /tmp/sadtalker-checkpoints/SadTalker_V0.0.2_256.safetensors ]; then
            curl -fL --retry 3 "$BASE/SadTalker_V0.0.2_256.safetensors" -o /tmp/sadtalker-checkpoints/SadTalker_V0.0.2_256.safetensors
          else
            echo "SADTALKER_CACHE_HIT: 256px model checkpoint"
          fi

          # Animate only the opening greeting/hook; then cut to full-screen B-roll.
          # This is substantially faster than animating the entire narration on CPU.
          ffmpeg -y -i output/voiceover.wav -t 7.5 -ac 1 -ar 16000 output/sadtalker_source/reporter_audio.wav

          mkdir -p output/sadtalker
          # SadTalker resolves ./checkpoints relative to the current directory.
          # Run inference from its own repo so it detects the downloaded safetensors.
          cd /tmp/SadTalker
          # Attempt 1: crop-and-resize for a centered presenter headshot.
          /tmp/sadtalker-venv/bin/python inference.py \
            --driven_audio "$GITHUB_WORKSPACE/output/sadtalker_source/reporter_audio.wav" \
            --source_image "$GITHUB_WORKSPACE/output/sadtalker_source/reporter.jpg" \
            --result_dir "$GITHUB_WORKSPACE/output/sadtalker" \
            --preprocess crop \
            --size 256 \
            --cpu || echo "SADTALKER_PRIMARY_MODE_EXITED_WITH_ERROR"

          # Important: a zero exit code alone is not success; check for an actual video.
          if ! find "$GITHUB_WORKSPACE/output/sadtalker" -type f -name '*.mp4' -size +20k -print -quit 2>/dev/null | grep -q .; then
            echo "SADTALKER_PRIMARY_NO_VALID_MP4; trying alternate full-frame preprocessing."
            /tmp/sadtalker-venv/bin/python inference.py \
              --driven_audio "$GITHUB_WORKSPACE/output/sadtalker_source/reporter_audio.wav" \
              --source_image "$GITHUB_WORKSPACE/output/sadtalker_source/reporter.jpg" \
              --result_dir "$GITHUB_WORKSPACE/output/sadtalker_fallback" \
              --preprocess full \
              --size 256 \
              --cpu || echo "SADTALKER_FALLBACK_MODE_EXITED_WITH_ERROR"
          fi
          cd "$GITHUB_WORKSPACE"

          python - <<'PY'
          import glob, os, subprocess
          candidates = [
              p for pattern in ("output/sadtalker/**/*.mp4", "output/sadtalker_fallback/**/*.mp4")
              for p in glob.glob(pattern, recursive=True)
              if os.path.getsize(p) > 20000
          ]
          if not candidates:
              raise SystemExit("SadTalker created no MP4; keeping regular intro.")
          source = max(candidates, key=os.path.getmtime)
          target = "output/media/reporter_intro.mp4"
          # Keep generated talking face silent here; production narration is muxed later.
          subprocess.run([
              "ffmpeg", "-y", "-i", source, "-an",
              "-vf", "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30,format=yuv420p",
              "-c:v", "libx264", "-preset", "veryfast", "-pix_fmt", "yuv420p", target
          ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)
          if os.path.getsize(target) < 10000:
              raise SystemExit("Talking reporter output invalid; keep fallback intro.")
          print("SADTALKER_TALKING_REPORTER_SUCCESS:", source)
          with open("output/sadtalker_success.txt", "w", encoding="utf-8") as f:
              f.write(source + "\n")
          PY

      - name: Select honest reporter visual fallback
        if: always() && steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        run: |
          set -e
          if [ -s output/sadtalker_success.txt ] && [ -s output/media/reporter_intro.mp4 ]; then
            echo "REPORTER_MODE=talking_avatar_with_generated_lip_sync"
          elif [ -s output/media/reporter_stock_intro.mp4 ] && [ -s output/media/reporter_stock_intro_source.txt ]; then
            echo "REPORTER_MODE=real_moving_stock_reporter_with_voiceover_no_claim_of_lip_sync"
          else
            rm -f output/media/reporter_intro.mp4 output/media/reporter_intro_source.txt
            echo "REPORTER_MODE=unavailable; render quality gate will stop rather than use a still portrait"
          fi

      - name: Report talking-reporter generation status
        if: always() && steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        run: |
          if [ -s output/media/reporter_stock_intro.mp4 ] && [ -s output/media/reporter_stock_intro_source.txt ]; then
            echo "REPORTER_READY: moving reporter footage with Hindi voice-over; no lip-sync claim."
          elif compgen -G "output/media/clip_*.mp4" > /dev/null; then
            echo "REPORTER_MISSING_BROLL_FALLBACK_AVAILABLE: moving illustrative footage with Hindi voice-over; no reporter/lip-sync claim."
          else
            echo "REPORTER_MISSING: no suitable moving reporter or B-roll video; still-only preview remains blocked."
          fi

      - name: Create Ground Report video with Hindi captions
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra fonts-dejavu-core fontconfig
          fc-cache -f
          FONT_MATCH="$(fc-match 'Noto Sans Devanagari' | head -1)"
          echo "CAPTION_FONT_MATCH=$FONT_MATCH"
          if ! fc-match 'Noto Sans Devanagari' | grep -qi 'NotoSansDevanagari'; then
            echo "WARNING: Noto Sans Devanagari not selected; checking Noto Sans fallback"
            fc-match 'Noto Sans'
          fi

          python - <<'PY'
          import json
          import wave
          import re
          import os
          import glob
          import subprocess

          with open("output/metadata.json", encoding="utf-8") as f:
              script = json.load(f)["script"].strip()

          with wave.open("output/voiceover.wav", "rb") as wav:
              duration = wav.getnframes() / wav.getframerate()

          if duration <= 0:
              raise RuntimeError("Voice-over duration is invalid")

          # Generate word-level timestamps from the actual Hindi voice-over.
          # Use karaoke-style ASS tags so each spoken word lights up as it is spoken.
          timed_words = []
          try:
              subprocess.run(
                  ["python", "-m", "pip", "install", "--quiet", "--only-binary=av", "faster-whisper==1.1.1", "av>=14,<17"],
                  check=True, timeout=240
              )
              from faster_whisper import WhisperModel
              print("CAPTION_ALIGNMENT: loading multilingual Whisper base model")
              model = WhisperModel("base", device="cpu", compute_type="int8")
              segments, _info = model.transcribe(
                  "output/voiceover.wav", language="hi", word_timestamps=True,
                  vad_filter=True, beam_size=3
              )
              for segment in segments:
                  if segment.words:
                      for word in segment.words:
                          token = (word.word or "").strip()
                          if token:
                              timed_words.append({
                                  "text": token,
                                  "start": max(0.0, float(word.start)),
                                  "end": min(duration, max(float(word.end), float(word.start) + 0.08))
                              })
              print("CAPTION_WORD_TIMESTAMPS:", len(timed_words))
          except Exception as error:
              print("CAPTION_ALIGNMENT_FALLBACK:", repr(error))

          # Fallback retains every script word and distributes timings across the audio.
          if not timed_words:
              script_words = re.findall(r"\S+", script)
              if not script_words:
                  raise RuntimeError("No caption words generated")
              weights = [max(1, len(word.strip("।,!?;:")) ) for word in script_words]
              total = sum(weights)
              cursor = 0.0
              for token, weight in zip(script_words, weights):
                  end = cursor + duration * weight / total
                  timed_words.append({"text": token, "start": cursor, "end": end})
                  cursor = end

          def stamp(seconds):
              cs = max(0, int(round(seconds * 100)))
              h, cs = divmod(cs, 360000)
              m, cs = divmod(cs, 6000)
              s, cs = divmod(cs, 100)
              return f"{h}:{m:02}:{s:02}.{cs:02}"

          def ass_safe(value):
              return value.replace("{", "(").replace("}", ")").replace("\\", "")

          # Keep captions to short phrases that remain readable at large size.
          groups = []
          current = []
          char_count = 0
          for word in timed_words:
              token_len = len(word["text"])
              if current and (len(current) >= 3 or char_count + token_len > 17):
                  groups.append(current)
                  current = []
                  char_count = 0
              current.append(word)
              char_count += token_len + 1
          if current:
              groups.append(current)

          with open("output/captions.ass", "w", encoding="utf-8") as f:
              f.write("[Script Info]\n")
              f.write("ScriptType: v4.00+\n")
              f.write("PlayResX: 1080\nPlayResY: 1920\n\n")
              f.write("[V4+ Styles]\n")
              f.write("Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\n")
              # Large static phrase captions avoid karaoke-block artifacts; transparent background.
              f.write("Style: Default,Noto Sans Devanagari,68,&H00FFFFFF,&H00FFFFFF,&H00000000,&HFF000000,-1,0,0,0,100,100,0,0,1,4,0,2,64,64,250,1\n\n")
              f.write("[Events]\n")
              f.write("Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n")
              for group in groups:
                  group_start = max(0.0, group[0]["start"])
                  group_end = min(duration, max(group[-1]["end"], group_start + 0.18))
                  karaoke = []
                  for i, word in enumerate(group):
                      next_start = group[i + 1]["start"] if i + 1 < len(group) else word["end"]
                      # Include natural inter-word pause in the current word's highlight, but cap it.
                      span = max(0.08, min(1.2, next_start - word["start"]))
                      centiseconds = max(1, int(round(span * 100)))
                      karaoke.append(ass_safe(word["text"]))
                  f.write(
                      f"Dialogue: 0,{stamp(group_start)},{stamp(group_end)},Default,,0,0,0,,"
                      + " ".join(karaoke) + "\n"
                  )

          with open("output/caption_groups.json", "w", encoding="utf-8") as f:
              json.dump([{"start": max(0.0, float(g[0]["start"])), "end": min(duration, max(float(g[-1]["end"]), float(g[0]["start"]) + 0.18)), "text": " ".join(ass_safe(w["text"]) for w in g)} for g in groups], f, ensure_ascii=False, indent=2)
          print("PILLOW_CAPTION_TIMELINE_CREATED:", len(groups))

          # Create a headline as transparent text with a dark outline only:
          # no filled banner, no rounded rectangle, no "आज की बड़ी खबर" label.
          with open("output/metadata.json", encoding="utf-8") as f:
              metadata = json.load(f)
          headline = re.sub(r"\s+", " ", metadata.get("title", "MR AHLAWAT NEWS")).strip()
          headline = re.sub(r"#\w+", "", headline).replace("\\", " ").replace("'", "’").strip(" •|")
          ticker = re.sub(r"\s+", " ", metadata.get("description", script)).strip()
          with open("output/headline.txt", "w", encoding="utf-8") as f:
              f.write(headline[:90])
          with open("output/ticker.txt", "w", encoding="utf-8") as f:
              f.write(ticker[:240])
          from PIL import Image, ImageDraw, ImageFont, features
          if not features.check("raqm"):
              raise RuntimeError("Pillow RAQM unavailable for Hindi headline shaping")
          font_path = subprocess.run(["fc-match", "-f", "%{file}", "Noto Sans Devanagari:style=Bold"], capture_output=True, text=True, check=True).stdout.strip()
          if not font_path or not os.path.isfile(font_path) or "DejaVu" in font_path:
              raise RuntimeError("Noto Sans Devanagari font unavailable for headline")
          overlay = Image.new("RGBA", (1080, 300), (0, 0, 0, 0))
          draw = ImageDraw.Draw(overlay)
          headline_font = ImageFont.truetype(font_path, 48, layout_engine=ImageFont.Layout.RAQM)
          words = headline.split()
          rows, row = [], ""
          for word in words:
              candidate = (row + " " + word).strip()
              if row and draw.textbbox((0, 0), candidate, font=headline_font, stroke_width=3)[2] > 970:
                  rows.append(row)
                  row = word
              else:
                  row = candidate
          if row:
              rows.append(row)
          y = 28
          for line in rows[:2]:
              draw.text((54, y), line, font=headline_font, fill=(255,255,255,255),
                        stroke_width=4, stroke_fill=(0,0,0,245))
              y += 66
          overlay.save("output/headline_overlay.png")
          print("HEADLINE_OVERLAY_CREATED: transparent text only; no filled boxes")

          # Build a real storyboard: event-topic footage first, then relevant topic photos.
          # Do not use generic India Gate imagery unless the story is actually about that place.
          topic_text = " ".join([
              str(os.environ.get("SHORT_TOPIC", "")),
              str(json.load(open("output/metadata.json", encoding="utf-8")).get("title", "")),
              str(script)
          ]).lower()
          public_affairs_story = any(term in topic_text for term in (
              "protest", "demonstration", "rally", "dharna", "andolan",
              "जंतर मंतर", "प्रदर्शन", "धरना", "आंदोलन", "cjp",
              "ashu", "saurav", "abhijeet dipke", "gyanesh kumar"
          ))
          # New edit strategy: prefer actual moving clips recovered from the selected
          # public X post / relevant public social posts, then use licensed-source B-roll.
          # Social clips are included only in preview; source/rights are listed in attribution.
          social_clips = sorted(glob.glob("output/media/social_clip_*.mp4"))
          licensed_clips = sorted(glob.glob("output/media/clip_*.mp4"))
          video_clips = (social_clips + licensed_clips)[:7]
          if social_clips:
              print("REAL_SOCIAL_POST_FOOTAGE_QUEUED_FOR_PREVIEW:", len(social_clips))
          if licensed_clips:
              print("LICENSED_OR_STOCK_BROLL_QUEUED_FOR_PREVIEW:", len(licensed_clips))
          # Public-affairs B-roll is not labelled as footage of the exact event
          # unless it came from the selected/source post itself.
          if public_affairs_story and video_clips:
              print("PUBLIC_AFFAIRS_VIDEO_ASSETS_FOR_REVIEWED_PREVIEW:", len(video_clips))
              print("SOURCE_AND_USAGE_NOTES_SAVED_IN_OUTPUT_MEDIA_ATTRIBUTION")
          all_images = sorted(set(
              glob.glob("output/media/image_*")
              + glob.glob("output/media/social_image_*")
              + glob.glob("output/media/india_gate_landmark.jpg")
          ))
          other_images = [
              path for path in all_images
              if os.path.basename(path) != "image_00_cjp.png"
          ]
          if not any(term in topic_text for term in ("india gate", "इंडिया गेट")):
              other_images = [
                  path for path in other_images
                  if os.path.basename(path) != "india_gate_landmark.jpg"
              ]
          ai_images = [p for p in other_images if os.path.basename(p) == "image_00a_ai_generated.png"]
          images = (ai_images + [p for p in other_images if p not in ai_images])[:6]
          if ai_images:
              print("AI_ILLUSTRATION_PRIORITIZED_IN_STORYBOARD: clearly illustrative, not event evidence")
          avatar_path = "output/media/reporter_intro.mp4"
          stock_reporter_path = "output/media/reporter_stock_intro.mp4"
          base_assets = []
          if os.path.exists("output/sadtalker_success.txt") and os.path.exists(avatar_path):
              base_assets.append(("reporter", avatar_path))
              print("VISUAL_MODE=talking-avatar-intro-then-topic-storyboard")
          elif os.path.exists(stock_reporter_path) and os.path.exists("output/media/reporter_stock_intro_source.txt"):
              base_assets.append(("reporter", stock_reporter_path))
              print("VISUAL_MODE=real-moving-reporter-with-voiceover-no-lipsync-claim")
          base_assets += [("video", path) for path in video_clips]
          base_assets += [("image", path) for path in images]
          if not base_assets:
              raise RuntimeError("No image or video visuals found.")
          if not any(kind in ("reporter", "video") for kind, _path in base_assets):
              raise RuntimeError("No moving video footage or talking avatar is available; refusing a still-photo-only preview.")
          if not any(kind == "reporter" for kind, _path in base_assets):
              print("VISUAL_MODE=illustrative-moving-B-roll-with-voiceover-no-reporter-no-lipsync")
          # Avoid a misleading 'ground report' when the reporter generation/search failed.
          if len(video_clips) < 3 and not any(kind == "reporter" for kind, _path in base_assets):
              raise RuntimeError(f"VISUAL_QUALITY_GATE_FAILED: only {len(video_clips)} moving B-roll clips found; need at least 3 topic-related clips or a verified reporter shot. Refusing low-quality still-heavy preview.")
          if len(base_assets) < 2:
              raise RuntimeError("Need at least two distinct visual assets; refusing a single-image video.")

          # Short cinematic cuts: ~3.5s for stills, ~4.5s for moving footage,
          # and one short reporter opening. Reuse is only a last resort to fill narration.
          transition_duration = 0.28
          assets = []
          segment_durations = []
          elapsed = 0.0
          scene_index = 0
          while elapsed < duration + transition_duration * 3:
              candidate_index = scene_index % len(base_assets)
              kind, path = base_assets[candidate_index]
              # Never replay the talking reporter; keep it as a brief opening shot.
              if kind == "reporter" and scene_index >= len(base_assets):
                  scene_index += 1
                  if scene_index > len(base_assets) * 3:
                      break
                  continue
              if kind == "reporter":
                  segment_duration = min(5.0, max(3.0, duration * 0.09))
              elif kind == "video":
                  segment_duration = 4.2
              else:
                  segment_duration = 3.4
              first_scene = not assets
              assets.append((kind, path))
              segment_durations.append(segment_duration)
              elapsed += segment_duration - (0 if first_scene else transition_duration)
              scene_index += 1
              if scene_index > 60:
                  break
          if len(assets) < 2:
              raise RuntimeError("Storyboard has fewer than two scenes.")
          print("CINEMATIC_STORYBOARD_SCENES:", len(assets))
          print("CINEMATIC_CUT_LENGTHS_SECONDS:", ",".join(f"{x:.1f}" for x in segment_durations))
          print("TOPIC_VIDEO_CLIPS:", len(video_clips), "TOPIC_IMAGES:", len(images))

          args = ["ffmpeg", "-y"]
          for (kind, path), segment_duration in zip(assets, segment_durations):
              if kind in ("video", "reporter"):
                  args += ["-stream_loop", "-1", "-i", path]
              else:
                  args += ["-loop", "1", "-framerate", "30",
                           "-t", f"{segment_duration:.3f}", "-i", path]

          filters = []
          labels = []

          for i, ((kind, path), segment_duration) in enumerate(zip(assets, segment_durations)):
              label = f"v{i}"
              if kind in ("video", "reporter"):
                  filters.append(
                      f"[{i}:v]trim=duration={segment_duration:.3f},"
                      f"setpts=PTS-STARTPTS,scale=1080:1920:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop=1080:1920,setsar=1,fps=30,"
                      f"eq=contrast=1.04:saturation=1.08:brightness=-0.01,"
                      f"unsharp=5:5:0.35:3:3:0.12,"
                      f"format=yuv420p,settb=AVTB[{label}]"
                  )
              elif kind == "logo":
                  # Keep the entire CJP logo visible with clean margins; never crop it.
                  filters.append(
                      f"[{i}:v]scale=920:1500:force_original_aspect_ratio=decrease,"
                      f"pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=0x0c1426,"
                      f"setsar=1,fps=30,format=yuv420p,settb=AVTB[{label}]"
                  )
              else:
                  pan_x = "(iw-iw/zoom)*min(on/100,1)" if i % 2 == 0 else "(iw-iw/zoom)*(1-min(on/100,1))"
                  filters.append(
                      f"[{i}:v]scale=1080:1920:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop=1080:1920,setsar=1,fps=30,"
                      f"zoompan=z='min(zoom+0.0007,1.10)':"
                      f"x='{pan_x}':"
                      f"y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,"
                      f"eq=contrast=1.04:saturation=1.08:brightness=-0.01,"
                      f"unsharp=5:5:0.35:3:3:0.12,"
                      f"format=yuv420p,settb=AVTB[{label}]"
                  )
              labels.append(f"[{label}]")

          previous = labels[0]
          for i in range(1, len(labels)):
              output_label = f"xf{i}"
              offset = sum(segment_durations[:i]) - i * transition_duration
              filters.append(
                  f"{previous}{labels[i]}"
                  f"xfade=transition=fade:duration={transition_duration}:"
                  f"offset={offset:.3f}[{output_label}]"
              )
              previous = f"[{output_label}]"

          filters.append(f"{previous}format=yuv420p[outv]")

          args += [
              "-filter_complex", ";".join(filters),
              "-map", "[outv]", "-an",
              "-c:v", "libx264", "-preset", "veryfast",
              "-pix_fmt", "yuv420p",
              "-t", f"{duration:.3f}",
              "output/visuals.mp4"
          ]

          subprocess.run(args, check=True)
          print(f"GROUND_REPORT_VISUALS_CREATED: {len(assets)} segments ({len(video_clips)} video clips, {len(images)} photos)")
          print(f"VOICEOVER_DURATION: {duration:.2f} seconds")
          PY

          if { [ -s output/sadtalker_success.txt ] && [ -s output/media/reporter_intro.mp4 ]; } || \
             { [ -s output/media/reporter_stock_intro.mp4 ] && [ -s output/media/reporter_stock_intro_source.txt ]; } || \
             compgen -G "output/media/clip_*.mp4" > /dev/null || \
             compgen -G "output/media/social_clip_*.mp4" > /dev/null; then
            # New caption renderer: Pillow + RAQM shapes Devanagari and draws transparent text directly on frames.
            python - <<'PY'
          import json, os, subprocess
          from PIL import Image, ImageDraw, ImageFont
          W, H, FPS = 1080, 1920, 30
          with open("output/caption_groups.json", encoding="utf-8") as f:
              cues = json.load(f)
          import subprocess
          font_path = subprocess.run(["fc-match", "-f", "%{file}", "Noto Sans Devanagari:style=Bold"], capture_output=True, text=True, check=True).stdout.strip()
          if not font_path or not os.path.isfile(font_path) or "DejaVu" in font_path:
              raise RuntimeError("Noto Sans Devanagari font missing; refusing box-glyph captions")
          # Assert that Pillow's complex-script shaping engine is actually enabled.
          from PIL import features
          if not features.check("raqm"):
              raise RuntimeError("Pillow RAQM is unavailable; refusing Devanagari captions that may render as boxes")
          try:
              font = ImageFont.truetype(font_path, 66, layout_engine=ImageFont.Layout.RAQM)
          except Exception as e:
              raise RuntimeError("Pillow RAQM shaping unavailable: " + repr(e))
          print("CAPTION_RENDERER=Pillow-RAQM", font_path)
          headline = Image.open("output/headline_overlay.png").convert("RGBA")
          decoder = subprocess.Popen(["ffmpeg","-v","error","-i","output/visuals.mp4","-vf","scale=1080:1920:flags=lanczos,fps=30","-f","rawvideo","-pix_fmt","rgb24","pipe:1"], stdout=subprocess.PIPE)
          encoder = subprocess.Popen(["ffmpeg","-y","-v","error","-f","rawvideo","-pix_fmt","rgb24","-s","1080x1920","-r","30","-i","pipe:0","-an","-c:v","libx264","-preset","veryfast","-crf","20","-pix_fmt","yuv420p","output/captioned-visuals.mp4"], stdin=subprocess.PIPE)
          frame_bytes=W*H*3
          frame_index=0
          try:
              while True:
                  chunks=[]
                  remaining=frame_bytes
                  while remaining:
                      part=decoder.stdout.read(remaining)
                      if not part: break
                      chunks.append(part)
                      remaining-=len(part)
                  if remaining: break
                  raw=b"".join(chunks)
                  t=frame_index/FPS
                  frame=Image.frombytes("RGB",(W,H),raw).convert("RGBA")
                  # Composite transparent headline text only; it contains no filled shapes.
                  frame.alpha_composite(headline, (0, 0))
                  active=next((c for c in cues if c["start"]<=t<c["end"]),None)
                  if active and active.get("text","").strip():
                      draw=ImageDraw.Draw(frame)
                      words=active["text"].split()
                      lines=[]; line=""
                      for word in words:
                          trial=(line+" "+word).strip()
                          if line and draw.textbbox((0,0),trial,font=font,stroke_width=3)[2]>930:
                              lines.append(line); line=word
                          else: line=trial
                      if line: lines.append(line)
                      lines=lines[-2:]
                      heights=[draw.textbbox((0,0),ln,font=font,stroke_width=3)[3] for ln in lines]
                      y=1510-(sum(heights)+max(0,len(lines)-1)*10)//2
                      for ln,h in zip(lines,heights):
                          bb=draw.textbbox((0,0),ln,font=font,stroke_width=3)
                          x=(W-(bb[2]-bb[0]))//2
                          draw.text((x,y),ln,font=font,fill=(255,255,255,255),stroke_width=4,stroke_fill=(0,0,0,255))
                          y+=h+10
                  encoder.stdin.write(frame.convert("RGB").tobytes())
                  frame_index+=1
          finally:
              decoder.stdout.close()
              encoder.stdin.close()
          dr=decoder.wait(); er=encoder.wait()
          if dr or er or frame_index<1: raise RuntimeError(f"caption render failed decoder={dr} encoder={er} frames={frame_index}")
          print("PILLOW_CAPTION_RENDER_SUCCESS frames=",frame_index)
          PY
            ffmpeg -y -i output/captioned-visuals.mp4 -i output/voiceover.mp3 -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 160k -shortest output/mr-ahlawat-short.mp4
          else
            echo "ERROR: No moving video footage available; refusing still-only preview."
            exit 1
          fi


      - name: Create visual review sheet
        if: always() && steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false' && hashFiles('output/mr-ahlawat-short.mp4') != ''
        continue-on-error: true
        run: |
          mkdir -p output/review
          ffmpeg -y -v error -i output/mr-ahlawat-short.mp4 -vf "fps=1/4,scale=270:480,tile=2x3:padding=12:margin=12:color=black" -frames:v 1 output/preview-contact-sheet.jpg
          test -s output/preview-contact-sheet.jpg && echo "VISUAL_REVIEW_SHEET_CREATED=output/preview-contact-sheet.jpg"

      - name: Validate rendered Short before upload
        id: quality
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        env:
          PREVIEW_ONLY: ${{ inputs.preview_only || github.event_name != 'schedule' }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys, re

          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as f:
              f.write("valid=false\n")

          video = "output/mr-ahlawat-short.mp4"
          audio = "output/voiceover.wav"
          captions = "output/captions.ass"
          metadata = "output/metadata.json"

          def fail(message):
              print("QUALITY_CHECK_FAILED:", message)
              raise SystemExit(1)

          if not os.path.isfile(video) or os.path.getsize(video) < 100000:
              fail("Final MP4 is missing or suspiciously small.")
          if not os.path.isfile(audio) or os.path.getsize(audio) < 10000:
              fail("Voice-over WAV is missing or suspiciously small.")
          avatar_ready = os.path.isfile("output/sadtalker_success.txt") and os.path.isfile("output/media/reporter_intro.mp4")
          stock_ready = os.path.isfile("output/media/reporter_stock_intro.mp4") and os.path.isfile("output/media/reporter_stock_intro_source.txt")
          import glob
          broll_clips = sorted(glob.glob("output/media/clip_*.mp4") + glob.glob("output/media/social_clip_*.mp4"))
          if avatar_ready:
              print("REPORTER_QUALITY_MODE: talking avatar with generated lip-sync")
          elif stock_ready:
              print("REPORTER_QUALITY_MODE: real moving reporter with Hindi voice-over; lip-sync not claimed")
          elif broll_clips:
              print(f"VISUAL_QUALITY_MODE: illustrative moving B-roll with Hindi voice-over; no reporter/lip-sync claim ({len(broll_clips)} clips)")
          else:
              fail("No moving reporter or B-roll video was generated. Refusing a still-photo-only preview.")
          if not os.path.isfile(captions):
              fail("Hindi captions file is missing.")
          # Catch the two recent regressions before an artifact can be approved:
          # absent headline overlay and missing/empty caption timeline.
          from PIL import Image
          overlay_path = "output/headline_overlay.png"
          if not os.path.isfile(overlay_path):
              fail("Transparent headline text overlay file is missing.")
          overlay = Image.open(overlay_path).convert("RGBA")
          if overlay.getchannel("A").getbbox() is None:
              fail("Headline overlay is fully transparent; no headline text would appear.")
          groups_path = "output/caption_groups.json"
          if not os.path.isfile(groups_path):
              fail("Caption timing JSON is missing.")
          with open(groups_path, encoding="utf-8") as gf:
              caption_groups = json.load(gf)
          if len(caption_groups) < 3 or not any(str(g.get("text", "")).strip() for g in caption_groups):
              fail("Caption timing JSON has no usable subtitle text.")
          print("TEXT_OVERLAY_QA_PASSED: headline has visible text; subtitle timeline has", len(caption_groups), "groups")
          # Inspect pixels from the actual final MP4, not only source PNG/JSON files.
          # A caption cue is sampled at its midpoint and must leave visible light text
          # in the expected lower-third region; this catches missing/broken burn-in.
          first_cue = next((g for g in caption_groups if str(g.get("text", "")).strip() and float(g.get("end", 0)) > float(g.get("start", 0))), None)
          if first_cue:
              sample_t = max(0.1, (float(first_cue["start"]) + float(first_cue["end"])) / 2)
              sample_path = "output/qa-caption-frame.jpg"
              subprocess.run(["ffmpeg", "-y", "-v", "error", "-ss", str(sample_t), "-i", video, "-frames:v", "1", sample_path], check=True)
              sample = Image.open(sample_path).convert("RGB")
              crop = sample.crop((60, 1320, 1020, 1830))
              bright = sum(1 for r, g, b in crop.getdata() if r > 215 and g > 215 and b > 215)
              print("FINAL_MP4_CAPTION_PIXEL_CHECK:", bright, "bright pixels at", round(sample_t, 2), "seconds")
              if bright < 80:
                  fail("Caption files exist but visible subtitle pixels were not detected in the final MP4.")
          else:
              fail("No usable caption cue available for final MP4 pixel inspection.")
          with open(captions, encoding="utf-8") as f:
              caption_text = f.read()
          caption_count = caption_text.count("Dialogue:")
          if caption_count < 3:
              fail(f"Too few caption segments: {caption_count}")
          with open(metadata, encoding="utf-8") as f:
              data = json.load(f)
          title = str(data.get("title", "")).strip()
          description = str(data.get("description", "")).strip()
          if not title or len(title) > 100:
              fail(f"YouTube title missing or over 100 characters (length={len(title)}).")
          hashtag_count = len(re.findall(r"#(?:[A-Za-z0-9_]+|[\u0900-\u097F]+)", title))
          if hashtag_count < 3:
              fail(f"YouTube title needs at least 3 hashtags; found {hashtag_count}.")
          if not description:
              fail("YouTube description is empty.")

          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_streams", "-show_format",
               "-of", "json", video],
              check=True, capture_output=True, text=True
          )
          info = json.loads(probe.stdout)
          streams = info.get("streams", [])
          vstreams = [s for s in streams if s.get("codec_type") == "video"]
          astreams = [s for s in streams if s.get("codec_type") == "audio"]
          if not vstreams:
              fail("Final MP4 has no video stream.")
          if not astreams:
              fail("Final MP4 has no audio stream.")
          v = vstreams[0]
          width, height = int(v.get("width", 0)), int(v.get("height", 0))
          duration = float(info.get("format", {}).get("duration", 0))
          if (width, height) != (1080, 1920):
              fail(f"Expected 1080x1920 vertical video; got {width}x{height}.")
          if duration < 10 or duration > 90:
              fail(f"Duration outside expected 10-90 seconds: {duration:.2f}s.")
          print(f"QUALITY_CHECK_PASSED: {width}x{height}, {duration:.1f}s, captions={caption_count}, audio=yes")
          with open(out, "a", encoding="utf-8") as f:
              f.write("valid=true\n")
          PY

      - name: Save generated files
        if: always() && steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        uses: actions/upload-artifact@v6
        with:
          name: mr-ahlawat-ai-short
          path: output/
          retention-days: 3

      - name: Upload video to YouTube
        if: false # TEMPORARY SAFETY LOCK: preview-only phase; do not upload to YouTube
        id: upload
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import sys

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError, ResumableUploadError

          with open("output/metadata.json", encoding="utf-8") as f:
              metadata = json.load(f)

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"]
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials,
              cache_discovery=False
          )

          video = MediaFileUpload(
              "output/mr-ahlawat-short.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": metadata["title"],
                      "description": metadata["description"],
                      "categoryId": "22"
                  },
                  "status": {
                      "privacyStatus": "private",
                      "selfDeclaredMadeForKids": False
                  }
              },
              media_body=video
          )

          try:
              response = request.execute()
          except (HttpError, ResumableUploadError) as e:
              if "uploadLimitExceeded" in str(e):
                  print("ERROR: YOUTUBE_UPLOAD_LIMIT_REACHED")
                  print("YouTube refused the upload because the channel/account upload limit was reached.")
                  print("The generated MP4 was already saved in the workflow artifact.")
                  print("Wait for YouTube's upload limit to reset, then run the workflow again.")
                  sys.exit(1)
              raise

          print("YOUTUBE_UPLOAD_SUCCESS")
          print("Video ID:", response["id"])
          print("Video URL: https://www.youtube.com/watch?v=" + response["id"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output_file:
              output_file.write("uploaded=true\n")
          PY

      - name: Update daily upload counter after successful upload
        if: steps.upload.outputs.uploaded == 'true' && success()
        run: |
          python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          path = ".github/daily-upload-count.json"
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
          try:
              with open(path, encoding="utf-8") as f:
                  state = json.load(f)
          except (OSError, json.JSONDecodeError):
              state = {}
          count = int(state.get("count", 0)) if state.get("date") == today else 0
          state = {"date": today, "count": count + 1}
          with open(path, "w", encoding="utf-8") as f:
              json.dump(state, f)
          print(f"DAILY_UPLOAD_COUNT_SAVED: {state['count']}/3 for {today} IST")
          PY

      - name: Save daily upload counter
        if: steps.upload.outputs.uploaded == 'true' && success()
        uses: actions/cache/save@v5
        with:
          path: .github/daily-upload-count.json
          key: daily-upload-count-${{ github.run_id }}

      - name: Save CJP duplicate state after successful upload
        if: github.event_name == 'schedule' && steps.cjp.outputs.should_run == 'true' && steps.upload.outputs.uploaded == 'true' && success()
        uses: actions/cache/save@v5
        with:
          path: .github/cjp-seen.json
          key: cjp-seen-${{ github.run_id }}
