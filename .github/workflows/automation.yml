                  if video_count >= 2:
                      break
                  try:
                      api = session.get(
                          "https://pixabay.com/api/videos/",
                          params={"key": video_key, "q": search_term, "per_page": 5,
                                  "safesearch": "true", "video_type": "film"},
                          timeout=30
                      )
                      api.raise_for_status()
                      hits = api.json().get("hits", [])
                      for hit in hits:
                          if video_count >= 2:
                              break
                          variants = hit.get("videos", {})
                          clip = variants.get("medium") or variants.get("small") or variants.get("large")
                          if not clip or not clip.get("url"):
                              continue
                          try:
                              video_response = session.get(clip["url"], timeout=60)
                              video_response.raise_for_status()
                              if len(video_response.content) < 20000:
                                  continue
                              video_count += 1
                              video_path = f"output/media/clip_{video_count:02d}.mp4"
                              with open(video_path, "wb") as out:
                                  out.write(video_response.content)
