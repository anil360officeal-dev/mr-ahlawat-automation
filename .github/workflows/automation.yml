        run: |
          python - <<'PY'
          import os
          import json
          import re
          import requests
          import subprocess
          from urllib.parse import quote

          os.makedirs("output/media", exist_ok=True)

          for name in os.listdir("output/media"):
              path = os.path.join("output/media", name)
              if os.path.isfile(path):
                  os.remove(path)

          with open("output/metadata.json", encoding="utf-8") as f:
              metadata = json.load(f)

          topic = os.environ.get("SHORT_TOPIC", "").strip()
          title = str(metadata.get("title", "")).strip()
          generated_queries = metadata.get("visual_search_terms", [])
          if isinstance(generated_queries, str):
              generated_queries = [generated_queries]
          generated_queries = [
              q.strip() for q in generated_queries
              if isinstance(q, str) and q.strip()
          ]

          # Classify public-affairs stories for protest-style visuals even when the
          # generated title/script omits the word "protest" (e.g. CJP/government stories).
          topic_text = " ".join([topic, title] + generated_queries + [str(metadata.get("script", ""))]).lower()
          protest_terms = ("protest", "protests", "demonstration", "rally", "dharna", "andolan", "jantarmantar", "जंतर मंतर", "प्रदर्शन", "धरना", "आंदोलन", "मोर्चा")
          public_affairs_terms = ("cjp", "bjp", "modi", "government", "court", "election", "activist", "democracy", "citizens for justice", "राजनीति", "सरकार", "अदालत", "चुनाव", "विरोध")
          is_protest_story = any(term in topic_text for term in protest_terms) or any(term in topic_text for term in public_affairs_terms)

          # For protest/public-affairs stories, put protest footage queries FIRST.
          # Otherwise the first four AI queries were consuming the photo/video search
          # budget and generic newsroom-looking stock images kept winning.
          queries = []
          if is_protest_story:
              priority_queries = [
                  topic + " protest rally crowd",
                  topic + " demonstration banners police barricades",
                  "India public protest rally crowd police barricades",
                  "Jantar Mantar protest India crowd"
              ]
          else:
              priority_queries = []
          for q in priority_queries + generated_queries[:4] + [title, topic]:
              q = q.strip() if isinstance(q, str) else ""
              if q and q.lower() not in {item.lower() for item in queries}:
                  queries.append(q)
          if not queries:
              raise RuntimeError("No topic-specific visual search queries were generated.")
          print("TOPIC_FOCUSED_VISUAL_QUERIES:")
          for q in queries:
              print(" - " + q)
          print("PROTEST_VISUAL_MODE:", is_protest_story)

          # Force India-relevant visual search for public-affairs/protest stories.
          if is_protest_story:
              india_queries = [
                  "India protest rally crowd",
                  "Jantar Mantar protest New Delhi",
                  "Indian Parliament New Delhi",
                  "India Gate New Delhi India"
              ]
              generated_queries = [
                  q for q in generated_queries
                  if not any(term in q.lower() for term in (
                      "ukraine", "russia", "concert", "music festival",
                      "celebrity", "fashion model"
                  ))
              ]
              queries = []
              for q in india_queries + generated_queries[:3] + [title, topic]:
                  q = q.strip() if isinstance(q, str) else ""
                  if q and q.lower() not in {item.lower() for item in queries}:
                      queries.append(q)
              print("INDIA_RELEVANT_VISUALS_ENFORCED:", queries[:7])

          session = requests.Session()
          session.headers.update({
              "User-Agent": "MrAhlawatShorts/1.0 (image search)"
          })

          saved = 0
          attribution = []
          seen = set()

          # Start with the requested Cockroach Janata Party (CJP) logo, not a flag.
          # Direct image is from the CJP logo announcement post on its website.
          cjp_logo_path = "output/media/image_00_cjp.png"
          cjp_logo_url = "https://www.cockroachjantapartycjp.com/api/media/1781499503994-7b7ad39a-1644-40ae-b979-e5b39655dc0c.png"
          try:
              logo_response = session.get(cjp_logo_url, timeout=35)
              logo_response.raise_for_status()
              if len(logo_response.content) < 5000:
                  raise RuntimeError("CJP logo image download was too small")
              with open(cjp_logo_path, "wb") as logo_file:
                  logo_file.write(logo_response.content)
