
name: Mr Ahlawat Shorts Automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-short:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create test video
        run: |
          mkdir -p output
          ffmpeg -y -f lavfi -i "color=c=black:s=1080x1920:r=30:d=10" -vf "drawtext=text='MR AHWALAT':fontcolor=white:fontsize=80:x=(w-text_w)/2:y=(h-text_h)/2" -c:v libx264 -pix_fmt yuv420p output/mr-ahlawat-short.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v6
        with:
          name: mr-ahlawat-short
          path: output/mr-ahlawat-short.mp4
          retention-days: 3
```
