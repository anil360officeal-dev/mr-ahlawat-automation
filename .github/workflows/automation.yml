                              print("SKIP_NON_NEWS_RELEVANT_IMAGE:", tags[:160])
                              continue
                          if any(term in tags for term in (
                              "ukraine", "russia", "concert", "music festival",
                              "celebrity", "fashion model", "beauty portrait"
                          )):
                              print("SKIP_UNRELATED_STOCK_IMAGE:", tags[:160])
                              continue
                          image_url = hit.get("largeImageURL") or hit.get("webformatURL")
