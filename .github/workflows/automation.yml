                      continue
                  gate_detail = session.get(
                      "https://commons.wikimedia.org/w/api.php",
                      params={"action": "query", "format": "json", "titles": gate_title,
                              "prop": "imageinfo", "iiprop": "url|mime|extmetadata",
                              "iiurlwidth": 1280},
                      timeout=25
                  )
                  gate_detail.raise_for_status()
                  pages = gate_detail.json().get("query", {}).get("pages", {})
                  info = next((p["imageinfo"][0] for p in pages.values()
                               if p.get("imageinfo") and
                               p["imageinfo"][0].get("mime", "").startswith("image/")), {})
                  gate_url = info.get("thumburl") or info.get("url")
                  if not gate_url:
                      continue
                  gate_image = session.get(gate_url, timeout=35)
                  gate_image.raise_for_status()
                  if len(gate_image.content) < 8000:
                      continue
                  with open("output/media/india_gate_landmark.jpg", "wb") as out:
                      out.write(gate_image.content)
                  meta = info.get("extmetadata", {})
                  artist = meta.get("Artist", {}).get("value", "Unknown")
                  license_name = meta.get("LicenseShortName", {}).get("value", "Check license")
                  source_page = "https://commons.wikimedia.org/wiki/" + quote(gate_title.replace(" ", "_"))
                  attribution.append(
                      f"India Gate, New Delhi | Creator: {artist} | License: {license_name} | Source: {source_page}"
                  )
                  print("INDIA_LANDMARK_IMAGE_READY:", gate_title)
                  break
          except Exception as gate_error:
              print("INDIA_LANDMARK_IMAGE_WARNING:", repr(gate_error))

          # For public-affairs/protest stories, do NOT use loosely matched stock photos.
          # Use the India Gate landmark plus designed newsroom cards instead.
          image_key = os.environ.get("PIXABAY_API_KEY", "").strip()
          if image_key and not is_protest_story:
              for search_term in queries[:4]:
                  if saved >= 5:
                      break
                  try:
                      print(f"Searching Pixabay photos: {search_term}")
                      api = session.get(
                          "https://pixabay.com/api/",
                          params={
                              "key": image_key,
                              "q": search_term,
                              "image_type": "photo",
                              "orientation": "vertical",
                              "safesearch": "true",
                              "per_page": 5
                          },
                          timeout=30
                      )
                      api.raise_for_status()
                      for hit in api.json().get("hits", []):
                          if saved >= 5:
                              break
                          tags = str(hit.get("tags", "")).lower()
                          if is_protest_story and not any(term in tags for term in (
                              "india", "indian", "new delhi", "jantarmantar",
                              "indian parliament", "india gate"
                          )):
                              print("SKIP_NON_INDIA_PUBLIC_AFFAIRS_IMAGE:", tags[:160])
                              continue
                          if is_protest_story and not any(term in tags for term in (
                              "protest", "demonstration", "rally", "crowd", "parliament",
