name: Mr Ahlawat Shorts Automation

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Shayari, comedy, ya news ka topic"
        required: true
        default: "CJP से जुड़ी ताज़ा और सत्यापित दिल्ली-NCR खबर"
        type: string
      content_mode:
        description: "Manual Short ka content style"
        required: true
        default: news
        type: choice
        options:
          - both
          - shayari
          - comedy
          - news
      preview_only:
        description: "Build and save MP4 artifact only; NEVER upload to YouTube"
        required: true
        default: true
        type: boolean
  # Temporarily paused: run previews manually until the talking-avatar output passes review.
  # Re-enable scheduled news builds after the preview pipeline is verified.
  # schedule:
  #   # India time (IST): 08:00, 14:00, 19:00 = 02:30, 08:30, 13:30 UTC
  #   - cron: "30 2,8,13 * * *"

concurrency:
  group: mr-ahlawat-daily-news-upload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-short:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore daily upload counter
        uses: actions/cache/restore@v5
        with:
          path: .github/daily-upload-count.json
          key: daily-upload-count-${{ github.run_id }}
          restore-keys: |
            daily-upload-count-

      - name: Check daily upload limit
        id: daily
        env:
          PREVIEW_ONLY: ${{ inputs.preview_only || github.event_name != 'schedule' }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          path = ".github/daily-upload-count.json"
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
          try:
              with open(path, encoding="utf-8") as f:
                  state = json.load(f)
          except (OSError, json.JSONDecodeError):
              state = {}
          count = int(state.get("count", 0)) if state.get("date") == today else 0
          preview_only = os.environ.get("PREVIEW_ONLY", "false").lower() == "true"
          allowed = count < 3 or preview_only
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("allowed=" + ("true" if allowed else "false") + chr(10))
          print(f"IST_DATE={today}; successful_uploads_today={count}; preview_only={preview_only}; allowed={allowed}")
          if not allowed:
              print("DAILY_UPLOAD_LIMIT_REACHED: maximum 3 successful uploads per India calendar day.")
          PY

      - name: Restore CJP duplicate-post state
        if: github.event_name == 'schedule' && steps.daily.outputs.allowed != 'false'
        uses: actions/cache/restore@v5
        with:
          path: .github/cjp-seen.json
          key: cjp-seen-${{ github.run_id }}
          restore-keys: |
            cjp-seen-

      - name: Select and verify CJP or BJP-critical news
        id: cjp
        if: github.event_name == 'schedule' && steps.daily.outputs.allowed != 'false'
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime
          from urllib.parse import urlparse

          out_path = os.environ["GITHUB_OUTPUT"]
          state_path = ".github/cjp-seen.json"
          os.makedirs("output", exist_ok=True)
          try:
              with open(state_path, encoding="utf-8") as f:
                  state = json.load(f)
          except (OSError, json.JSONDecodeError):
              state = {"ids": []}
          seen = set(str(v) for v in state.get("ids", []))

          def output(key, value):
              with open(out_path, "a", encoding="utf-8") as f:
                  f.write(f"{key}={str(value).replace(chr(10), ' ').replace(chr(13), ' ')}\n")

          def get_json(url):
              req = urllib.request.Request(
                  url, headers={"Accept": "application/json",
                                "User-Agent": "MrAhlawatShorts/1.0"}
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  return json.loads(response.read().decode("utf-8"))

          def words(text):
              return set(re.findall(r"[A-Za-z0-9\u0900-\u097F]+", text.lower()))

          stop = {
              "cjp", "the", "and", "for", "with", "from", "that", "this",
              "have", "has", "was", "were", "are", "its", "into", "about",
              "after", "before", "over", "under", "their", "they", "them",
              "protest", "protests", "government", "india", "indian", "news",
              "update", "today", "latest", "viral", "breaking", "people",
              "says", "said", "claims", "claim", "video", "post", "https",
              "पर", "और", "का", "की", "के", "को", "से", "में", "है", "हैं",
              "एक", "यह", "कि", "भी", "लिए", "द्वारा", "आज", "कल", "अब",
          }
          trusted_domains = (
              "reuters.com", "thehindu.com", "indianexpress.com", "ndtv.com",
              "hindustantimes.com", "indiatimes.com", "indiatoday.in",
              "theprint.in", "scroll.in", "news18.com", "barandbench.com",
              "livelaw.in", "tribuneindia.com", "aninews.in", "ptinews.in",
              "bbc.com", "bbc.co.uk", "thewire.in", "newslaundry.com",
              "deccanherald.com", "outlookindia.com", "thequint.com",
              "telegraphindia.com", "livemint.com", "moneycontrol.com"
          )

          # Search CJP/BJP plus major India-wide public issues; no official X API key.
          search_queries = [
              'CJP -filter:replies',
              '"BJP" (against OR criticism OR protest OR scandal OR controversy OR viral) India -filter:replies',
              '"BJP government" (failure OR question OR protest OR corruption OR inflation OR unemployment) -filter:replies',
              'Modi government criticism viral India protest court election -filter:replies',
              'भारत BJP सरकार विरोध महंगाई बेरोजगारी किसान वायरल -filter:replies'
          ]
          items = []
          known_ids = set()
          search_failed = 0
          for query in search_queries:
              search_url = "https://unifapi.com/tools/x/search?" + urllib.parse.urlencode({"q": query})
              try:
                  payload = get_json(search_url)
                  found = payload.get("posts", {}).get("items", [])
                  if not isinstance(found, list):
                      found = []
                  for post in found:
                      post_id = str(post.get("id", "")).strip()
                      if post_id and post_id not in known_ids:
                          known_ids.add(post_id)
                          items.append(post)
              except Exception as e:
                  search_failed += 1
                  print("X_SEARCH_WARNING:", query, repr(e))
          if not items and search_failed == len(search_queries):
              print("X_SEARCH_UNAVAILABLE: all searches failed")
              output("should_run", "false")
              raise SystemExit(0)

          print("INDIA_ISSUE_X_POSTS_RETURNED:", len(items))
          now = datetime.now(timezone.utc)
          selected = None

          # Prioritize posts that explicitly concern CJP/BJP or a major national issue.
          issue_terms = {
              "cjp", "bjp", "parliament", "supreme", "court", "election",
              "government", "minister", "protest", "unemployment", "inflation",
              "farmers", "women", "safety", "corruption", "constitution",
              "democracy", "policy", "india", "लोकसभा", "संसद", "चुनाव",
              "सरकार", "महंगाई", "बेरोजगारी", "किसान", "भ्रष्टाचार",
              "संविधान", "न्यायालय", "विरोध", "महिला", "भारत"
          }
          def post_priority(post):
              body = str(post.get("text", "")).lower()
              tokens = words(body)
              relevant = len(tokens & issue_terms)
              created = str(post.get("createdAt", ""))
              return (relevant, created)
          items.sort(key=post_priority, reverse=True)

          for post in items[:40]:
              post_id = str(post.get("id", "")).strip()
              text = str(post.get("text", "")).strip()
              post_url = str(post.get("url", "")).strip()
              if not post_id or post_id in seen or not text or not post_url:
                  continue
              lower_text = text.lower()
              # Run any CJP-related post; for BJP stories, focus on criticism/opposition
              # and major controversies rather than generic/supportive BJP chatter.
              is_cjp = "cjp" in lower_text
              bjp_criticism_terms = (
                  "against bjp", "bjp government", "modi government", "protest",
                  "criticism", "scandal", "controversy", "corruption", "failure",
                  "unemployment", "inflation", "farmers", "women safety", "paper leak",
                  "electoral bonds", "vote", "election", "court", "constitution",
                  "विरोध", "आलोचना", "घोटाला", "भ्रष्टाचार", "नाकामी", "महंगाई",
                  "बेरोजगारी", "किसान", "पेपर लीक", "चुनाव", "सरकार", "मोदी"
              )
              is_bjp_criticism = ("bjp" in lower_text or "भारतीय जनता पार्टी" in lower_text
                                  or "modi" in lower_text or "मोदी" in lower_text) and any(
                                      term in lower_text for term in bjp_criticism_terms
                                  )
              if not (is_cjp or is_bjp_criticism):
                  continue

              substantive = [
                  t for t in words(text)
                  if len(t) >= 4 and t not in stop and not t.isdigit()
              ]
              if not substantive:
                  continue

              # Verify against a recent independent news article from an established outlet.
              # A social post alone is never treated as confirmation.
              # Search the actual issue keywords; don't force every story to mention CJP.
              query_terms = substantive[:6]
              rss_query = urllib.parse.quote(" ".join(query_terms))
              rss_url = (
                  "https://news.google.com/rss/search?q=" + rss_query
                  + "&hl=en-IN&gl=IN&ceid=IN:en"
              )
              try:
                  req = urllib.request.Request(
                      rss_url, headers={"User-Agent": "Mozilla/5.0 MrAhlawatShorts/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=20) as response:
                      xml_data = response.read()
                  root = ET.fromstring(xml_data)
              except Exception as e:
                  print("NEWS_CORROBORATION_SEARCH_WARNING:", repr(e))
                  continue

              matches = []
              for item in root.findall(".//item")[:15]:
                  article_title = (item.findtext("title") or "").strip()
                  article_link = (item.findtext("link") or "").strip()
                  source_node = item.find("source")
                  source_name = source_node.text.strip() if source_node is not None and source_node.text else ""
                  source_url = source_node.get("url", "") if source_node is not None else ""
                  domain = (urlparse(source_url or article_link).hostname or "").lower()
                  if not any(domain == d or domain.endswith("." + d) for d in trusted_domains):
                      continue
                  pub_date = item.findtext("pubDate") or ""
                  try:
                      published = parsedate_to_datetime(pub_date)
                      if published.tzinfo is None:
                          published = published.replace(tzinfo=timezone.utc)
                      if now - published.astimezone(timezone.utc) > timedelta(days=7):
                          continue
                  except Exception:
                      continue
                  title_words = words(article_title)
                  overlap = (set(substantive) & title_words)
                  if len(overlap) >= 2:
                      matches.append({
                          "title": article_title, "url": article_link,
                          "source": source_name, "matched_terms": sorted(overlap)
                      })
              if matches:
                  selected = {
                      "id": post_id, "text": text, "url": post_url,
                      "createdAt": post.get("createdAt", ""),
                      "author": post.get("author", {}),
                      "corroborating_articles": matches[:3],
                  "raw_post": post
                  }
                  break

          if not selected:
              print("NO_CJP_OR_BJP_CRITICISM_STORY_CORROBORATED_BY_RECENT_TRUSTED_NEWS; skipping upload.")
              output("should_run", "false")
              raise SystemExit(0)

          # Persist the selected ID in the cache file; cache is saved only after successful upload.
          seen.add(selected["id"])
          state["ids"] = list(seen)[-5000:]
          with open(state_path, "w", encoding="utf-8") as f:
              json.dump(state, f, ensure_ascii=False, indent=2)
          with open("output/cjp_source.json", "w", encoding="utf-8") as f:
              json.dump(selected, f, ensure_ascii=False, indent=2)

          topic = ("CJP update: " if "cjp" in selected["text"].lower() else "BJP-विरोधी वायरल/बड़ा मुद्दा: ") + selected["text"][:500]
          output("should_run", "true")
          output("topic", topic)
          output("post_id", selected["id"])
          print("INDIA_ISSUE_POST_SELECTED:", selected["url"])
          print("INDEPENDENT_NEWS_MATCHES:", len(selected["corroborating_articles"]))
          for article in selected["corroborating_articles"]:
              print("CORROBORATING_SOURCE:", article["source"], article["url"])
          PY

      - name: Install FFmpeg and Hindi fonts
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core

      - name: Install Python libraries
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests piper-tts edge-tts yt-dlp google-api-python-client google-auth-httplib2 google-auth-oauthlib Pillow
          python -c "from PIL import Image, ImageDraw, ImageFont; print('PILLOW_IMPORT_OK')"

      - name: Generate Hindi Short with Gemini AI
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHORT_TOPIC: ${{ steps.cjp.outputs.topic || inputs.topic || 'CJP से जुड़ी ताज़ा और सत्यापित दिल्ली-NCR खबर' }}
          CONTENT_MODE: ${{ inputs.content_mode || 'news' }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          topic = os.environ.get("SHORT_TOPIC", "").strip()
          mode = os.environ.get("CONTENT_MODE", "news").strip().lower()
          if mode not in {"news", "shayari", "comedy", "both"}:
              mode = "news"
          if mode == "shayari":
              mode_guidance = """Content mode: SHAYARI. Create original, memorable Hindi/Hinglish shayari for a male Indian creator to perform to camera. Use emotional, rhythmic lines and natural pauses. Do not make news claims. Avoid copied famous couplets. Start with “हेलो दोस्तों,” then move directly into the shayari. Do not say the channel name aloud."""
              verification_guidance = """For shayari mode, write original creative content only. Do not assert real-world news, quotes, or factual allegations."""
              length_guidance = "Aim for 25–35 seconds of natural speech (about 55–80 Hindi words)."
          elif mode == "comedy":
              mode_guidance = """Content mode: COMEDY. Create an original, family-friendly Hindi/Haryanvi comedy bit for a male Indian creator. Use everyday colloquial phrasing, a clear setup and funny punchline. No targeted insults, copied viral jokes, or news claims. Start with “हेलो दोस्तों,” then go straight into the joke. Do not say the channel name aloud."""
              verification_guidance = """For comedy mode, write original, harmless creative content only. Do not assert real-world news, quotes, or factual allegations."""
              length_guidance = "Aim for 25–35 seconds of natural speech (about 55–80 Hindi words)."
          elif mode == "both":
              mode_guidance = """Content mode: SHAYARI + COMEDY. Create one short, original Hindi/Haryanvi performance for a male Indian creator: open with a relatable light joke, then end with a memorable shayrana couplet or witty poetic twist. Keep it family-friendly, expressive and natural. Avoid copied famous lines and news claims. Start with “हेलो दोस्तों,” and do not say the channel name aloud."""
              verification_guidance = """For mixed shayari/comedy mode, write original creative content only. Do not assert real-world news, quotes, or factual allegations."""
              length_guidance = "Aim for 30–40 seconds of natural speech (about 65–90 Hindi words)."
          else:
              mode_guidance = """Content mode: CURRENT-AFFAIRS NEWS. Prioritize a verified Hindi news explainer. If the topic/source is about CJP, cover relevant CJP updates without requiring an anti-BJP angle; otherwise use a major public-interest issue. For manual runs, do not pretend to know today's latest news unless supported. Start with “हेलो दोस्तों,” and do not say the channel name aloud. Deliver in a graceful, credible field-reporter style."""
              verification_guidance = """Treat any supplied social post as a lead, not proof. Only state claims supported by corroborating sources. Omit unsupported claims or label them unconfirmed. Do not invent quotes, dates, arrests, motives, identities, or event details. If evidence is weak or contradictory, say what remains unverified. Include available source links in the description."""
              length_guidance = "Script should be around 40–48 seconds when spoken (roughly 95–110 Hindi words), with a brisk pace and no padding."

          source_context = {}
          if os.path.exists("output/cjp_source.json"):
              with open("output/cjp_source.json", encoding="utf-8") as source_file:
                  source_context = json.load(source_file)

          if not api_key:
              raise RuntimeError("GEMINI_API_KEY secret is missing")

          prompt = f"""
          Create metadata and a spoken script for a YouTube Short
          for the Hindi/Hinglish channel Mr Ahlawat.

          Topic: {topic}

          {mode_guidance}
          - Do NOT say “Mr Ahlawat”, “मिस्टर अहलावत”, “मैं Mr Ahlawat”, or any channel-name self-introduction anywhere in the spoken script. The channel name may appear only as on-screen branding.
          - Speak directly to the viewer in natural, expressive Hindi/Haryanvi; avoid robotic delivery and generic filler.

          X source post and independent corroborating coverage (empty for manual topic runs):
          {json.dumps(source_context, ensure_ascii=False)}

          Verification rules:
          {verification_guidance}

          Rules:
          - Write like a real Indian TV field reporter speaking naturally to one viewer, not like a formal TV studio anchor, formal article, or AI announcement.
          - Use natural spoken Devanagari Hindi with everyday Indian phrasing and smooth word connections.
          - Avoid writing Hindi words in Roman letters. Keep only unavoidable names and technical terms in English; write common terms in Hindi phonetics when that improves pronunciation.
          - Sound like a confident Indian male creator speaking naturally to a phone camera with human conversational flow, varied emphasis, and decisive sentence endings. Avoid sleepy, flat, breathless, or robotic delivery.
          - Vary sentence length and rhythm naturally; use commas and full stops for short, purposeful pauses. Prefer active voice and punchy spoken sentences.
          - Use emphasis only on the most important facts. Keep transitions conversational and the ending crisp, not theatrical.
          - Prefer easy-to-pronounce words and clean sentence structure; avoid tongue-twisters, stacked English terms, repeated filler, and generic AI phrases.
          - Never shout, over-dramatize, sensationalize, invent facts, or claim unverified breaking news.
          - {length_guidance}
          - Begin with the exact greeting “हेलो दोस्तों,” then move immediately into the news hook; do not introduce the reporter or channel by name.
          - Include a strong opening hook, clear explanation, and a short closing line.
          - Keep the narration tight; never stretch it just to fill time.
          - Do not invent facts, quotes, or breaking news.
          - Title must be under 100 characters and include 3 relevant hashtags.
          - Description should explain the topic and include relevant hashtags.
          - Return valid JSON only with these keys:
          - script, title, description, hashtags, visual_search_terms
          - visual_search_terms must be a JSON array containing 3 short English search queries tied to THIS exact topic. Include the real person, place, event, company, product, or technology named in the topic whenever applicable. For protest, rally, dharna, demonstration, or police-action stories, prioritize visuals of that specific event, its named people/place, protest crowds, banners, and police barricades; use generic India protest visuals only as a fallback. Never imply illustrative footage is from the exact event unless verified. Avoid unrelated stock photos.
          """

          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.5-flash-lite:generateContent"
          )

          import time
          response = None

          for attempt in range(5):
              try:
                  response = requests.post(
                      url,
                      params={"key": api_key},
                      json={
                          "contents": [
                              {"parts": [{"text": prompt}]}
                          ],
                          "generationConfig": {
                              "responseMimeType": "application/json"
                          }
                      },
                      timeout=90
                  )

                  if response.ok:
                      break

                  if response.status_code not in (429, 500, 502, 503, 504):
                      break

                  print(
                      f"Gemini temporary error HTTP {response.status_code}; "
                      f"attempt {attempt + 1}/5"
                  )

              except requests.RequestException as e:
                  print(f"Gemini connection error: {e}")
                  response = None

              if attempt < 4:
                  delay = 5 * (2 ** attempt)
                  print(f"Retrying in {delay} seconds...")
                  time.sleep(delay)

          if response is None or not response.ok:
              status = (
                  response.status_code
                  if response is not None
                  else "connection error"
              )
              raise RuntimeError(
                  f"Gemini API failed: {status}. "
                  "Check model availability, API access, quota, and billing."
              )

          
          result = response.json()
          candidates = result.get("candidates", [])

          if not candidates:
              raise RuntimeError(
                  "Gemini returned no candidates. Check API response, "
                  "safety blocking, model access, or quota."
              )

          parts = candidates[0].get("content", {}).get("parts", [])
          text_parts = [
              part["text"] for part in parts
              if isinstance(part, dict) and "text" in part
          ]

          if not text_parts:
              raise RuntimeError("Gemini response contains no text")

          text = "\n".join(text_parts)
          data = json.loads(text)
          required = ["script", "title", "description", "hashtags"]
          if any(key not in data for key in required):
              raise RuntimeError("Gemini response is missing required fields")

          # Normalize hashtags before truncating so the title never loses its tags.
          import re
          title_original = str(data.get("title", "")).strip()
          title_tags = re.findall(r"#(?:[A-Za-z0-9_]+|[\u0900-\u097F]+)", title_original)
          raw_tags = data.get("hashtags", [])
          if isinstance(raw_tags, str):
              raw_tags = re.findall(r"#(?:[A-Za-z0-9_]+|[\u0900-\u097F]+)", raw_tags)
          if not isinstance(raw_tags, list):
              raw_tags = []
          tags = []
          for item in list(raw_tags) + title_tags:
              value = str(item).strip()
              found = re.findall(r"#?(?:[A-Za-z0-9_]+|[\u0900-\u097F]+)", value)
              if found:
                  tag = "#" + found[0].lstrip("#")
                  if tag.lower() not in [t.lower() for t in tags]:
                      tags.append(tag)
          for fallback in ["#HindiNews", "#IndiaNews", "#MrAhlawat"]:
              if len(tags) >= 3:
                  break
              if fallback.lower() not in [t.lower() for t in tags]:
                  tags.append(fallback)
          tags = tags[:3]
          title_base = re.sub(r"#(?:[A-Za-z0-9_]+|[\u0900-\u097F]+)", "", title_original)
          title_base = re.sub(r"\s+", " ", title_base).strip(" -|•")
          suffix = " ".join(tags)
          while title_base and len(title_base + " " + suffix) > 100:
              title_base = title_base[:-1].rstrip()
          data["title"] = (title_base + " " + suffix).strip()[:100]
          data["hashtags"] = tags
          data["description"] = str(data.get("description", "")).strip()

          # Enforce the requested spoken opening and remove any channel-name self-introduction.
          spoken = str(data.get("script", "")).strip()
          spoken = re.sub(
              r"^\s*(?:(?:नमस्कार|हेलो|हाय)\s+दोस्तों[,!।:—-]*\s*)+",
              "", spoken, flags=re.IGNORECASE
          )
          spoken = re.sub(
              r"^\s*(?:(?:Mr\.?\s*Ahlawat|मिस्टर\s+अहलावत|एमआर\s+अहलावत)"
              r"[,!।:—-]*\s*)+",
              "", spoken, flags=re.IGNORECASE
          )
          data["script"] = "हेलो दोस्तों, " + spoken.lstrip(" ,।!—-")
          if source_context:
              source_urls = []
              post_url = source_context.get("url", "")
              if post_url:
                  source_urls.append(post_url)
              for article in source_context.get("corroborating_articles", []):
                  article_url = article.get("url", "")
                  if article_url and article_url not in source_urls:
                      source_urls.append(article_url)
              if source_urls:
                  data["description"] += "\n\nSources: " + " | ".join(source_urls)

          os.makedirs("output", exist_ok=True)
          with open("output/metadata.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print("GEMINI_SCRIPT_SUCCESS")
          print("Generated title:", data["title"])
          print("Generated script:", data["script"])
          PY

