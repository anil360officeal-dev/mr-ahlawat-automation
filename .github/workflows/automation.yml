name: Mr Ahlawat Shorts Automation

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Hindi Short ka topic"
        required: true
        default: "भारत और दुनिया की टेक्नोलॉजी पर एक रोचक खबर"
        type: string

permissions:
  contents: read

jobs:
  create-short:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip
          pip install requests piper-tts google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Generate Hindi Short with Gemini AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHORT_TOPIC: ${{ inputs.topic }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          topic = os.environ.get("SHORT_TOPIC", "").strip()

          if not api_key:
              raise RuntimeError("GEMINI_API_KEY secret is missing")

          prompt = f"""
          Create metadata and a spoken script for a YouTube Short
          for the Hindi/Hinglish channel Mr Ahlawat.

          Topic: {topic}

          Rules:
          - Natural, engaging Hindi/Hinglish, suitable for a professional Hindi TV news report.
          - Script should be around 55–60 seconds when spoken naturally (roughly 110–130 Hindi words).
          - Include a strong opening hook, clear explanation, and a short closing line.
          - Do not make the script too short; aim for a full one-minute narration.
          - Do not invent facts, quotes, or breaking news.
          - Title must be under 100 characters and include 3 relevant hashtags.
          - Description should explain the topic and include relevant hashtags.
          - Return valid JSON only with these keys:
          - script, title, description, hashtags, visual_search_terms
          - visual_search_terms must be a JSON array containing 3 short English search queries for relevant news photos or video B-roll.
          """

          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.5-flash-lite:generateContent"
          )

          import time
          response = None

          for attempt in range(5):
              try:
                  response = requests.post(
                      url,
                      params={"key": api_key},
                      json={
                          "contents": [
                              {"parts": [{"text": prompt}]}
                          ],
                          "generationConfig": {
                              "responseMimeType": "application/json"
                          }
                      },
                      timeout=90
                  )

                  if response.ok:
                      break

                  if response.status_code not in (429, 500, 502, 503, 504):
                      break

                  print(
                      f"Gemini temporary error HTTP {response.status_code}; "
                      f"attempt {attempt + 1}/5"
                  )

              except requests.RequestException as e:
                  print(f"Gemini connection error: {e}")
                  response = None

              if attempt < 4:
                  delay = 5 * (2 ** attempt)
                  print(f"Retrying in {delay} seconds...")
                  time.sleep(delay)

          if response is None or not response.ok:
              status = (
                  response.status_code
                  if response is not None
                  else "connection error"
              )
              raise RuntimeError(
                  f"Gemini API failed: {status}. "
                  "Check model availability, API access, quota, and billing."
              )

          
          result = response.json()
          candidates = result.get("candidates", [])

          if not candidates:
              raise RuntimeError(
                  "Gemini returned no candidates. Check API response, "
                  "safety blocking, model access, or quota."
              )

          parts = candidates[0].get("content", {}).get("parts", [])
          text_parts = [
              part["text"] for part in parts
              if isinstance(part, dict) and "text" in part
          ]

          if not text_parts:
              raise RuntimeError("Gemini response contains no text")

          text = "\n".join(text_parts)
          data = json.loads(text)
          required = ["script", "title", "description", "hashtags"]
          if any(key not in data for key in required):
              raise RuntimeError("Gemini response is missing required fields")

          data["title"] = data["title"].strip()[:100]
          data["description"] = data["description"].strip()

          os.makedirs("output", exist_ok=True)
          with open("output/metadata.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("GEMINI_SCRIPT_SUCCESS")
          print("Generated title:", data["title"])
          print("Generated script:", data["script"])
          PY

      - name: Generate Hindi male voice-over
        run: |
          set -e
          mkdir -p models output

          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/rohan/medium"

          curl -fL "$BASE/hi_IN-rohan-medium.onnx" \
            -o models/hi_IN-rohan-medium.onnx

          curl -fL "$BASE/hi_IN-rohan-medium.onnx.json" \
            -o models/hi_IN-rohan-medium.onnx.json

          python - <<'PY'
          import json
          import subprocess
          import os

          with open("output/metadata.json", encoding="utf-8") as f:
              data = json.load(f)

          script = data["script"].strip()
          if not script:
              raise RuntimeError("AI script is empty")

          subprocess.run(
              [
                  "piper",
                  "--model", "models/hi_IN-rohan-medium.onnx",
                  "--output_file", "output/voiceover.wav"
              ],
              input=script,
              text=True,
              check=True
          )

          subprocess.run(
              [
                  "ffmpeg", "-y",
                  "-i", "output/voiceover.wav",
                  "output/voiceover.mp3"
              ],
              check=True
          )

          if os.path.getsize("output/voiceover.mp3") < 1000:
              raise RuntimeError("Voice-over file is too small")

          print("HINDI_MALE_VOICE_SUCCESS")
          PY
    

      - name: Download relevant Wikimedia images
        env:
          SHORT_TOPIC: ${{ inputs.topic }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          import subprocess
          from urllib.parse import quote

          os.makedirs("output/media", exist_ok=True)

          for name in os.listdir("output/media"):
              path = os.path.join("output/media", name)
              if os.path.isfile(path):
                  os.remove(path)

          with open("output/metadata.json", encoding="utf-8") as f:
              metadata = json.load(f)

          queries = metadata.get("visual_search_terms", [])
          if isinstance(queries, str):
              queries = [queries]
          queries = [q.strip() for q in queries if isinstance(q, str) and q.strip()]

          if not queries:
              topic = os.environ.get("SHORT_TOPIC", "").strip()
              queries = [topic] if topic else ["India news"]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "MrAhlawatShorts/1.0 (image search)"
          })

          saved = 0
          attribution = []
          seen = set()

          # Prefer Pixabay photos first, using the configured repository secret.
          # If Pixabay has no matching photos, Wikimedia and Unsplash remain as fallbacks.
          image_key = os.environ.get("PIXABAY_API_KEY", "").strip()
          if image_key:
              for search_term in queries[:4]:
                  if saved >= 5:
                      break
                  try:
                      print(f"Searching Pixabay photos: {search_term}")
                      api = session.get(
                          "https://pixabay.com/api/",
                          params={
                              "key": image_key,
                              "q": search_term,
                              "image_type": "photo",
                              "orientation": "vertical",
                              "safesearch": "true",
                              "per_page": 5
                          },
                          timeout=30
                      )
                      api.raise_for_status()
                      for hit in api.json().get("hits", []):
                          if saved >= 5:
                              break
                          image_url = hit.get("largeImageURL") or hit.get("webformatURL")
                          if not image_url or image_url in seen:
                              continue
                          seen.add(image_url)
                          image = session.get(image_url, timeout=45)
                          image.raise_for_status()
                          if len(image.content) < 5000:
                              continue
                          saved += 1
                          with open(f"output/media/image_{saved:02d}.jpg", "wb") as out:
                              out.write(image.content)
                          attribution.append(
                              f"Pixabay photo | ID: {hit.get('id', 'unknown')} | "
                              f"Source: https://pixabay.com/"
                          )
                          print(f"PIXABAY_IMAGE_DOWNLOADED: {saved}")
                  except Exception as pixabay_error:
                      print(f"Pixabay photo search warning for '{search_term}': {pixabay_error}")

          for search_term in queries[:4]:
              if saved >= 5:
                  break

              try:
                  print(f"Searching Wikimedia Commons: {search_term}")

                  response = session.get(
                      "https://commons.wikimedia.org/w/api.php",
                      params={
                          "action": "query",
                          "format": "json",
                          "list": "search",
                          "srnamespace": 6,
                          "srsearch": search_term,
                          "srlimit": 10
                      },
                      timeout=30
                  )
                  response.raise_for_status()
                  results = response.json().get("query", {}).get("search", [])

                  for result in results:
                      if saved >= 5:
                          break

                      title = result.get("title", "")
                      if not title or title in seen:
                          continue
                      seen.add(title)

                      detail = session.get(
                          "https://commons.wikimedia.org/w/api.php",
                          params={
                              "action": "query",
                              "format": "json",
                              "titles": title,
                              "prop": "imageinfo",
                              "iiprop": "url|mime|extmetadata",
                              "iiurlwidth": 1280
                          },
                          timeout=30
                      )
                      detail.raise_for_status()
                      pages = detail.json().get("query", {}).get("pages", {})

                      for page in pages.values():
                          info = page.get("imageinfo", [{}])[0]
                          mime = info.get("mime", "")
                          if mime not in ("image/jpeg", "image/png", "image/webp"):
                              continue

                          url = info.get("thumburl") or info.get("url")
                          if not url:
                              continue

                          image = session.get(url, timeout=45)
                          image.raise_for_status()
                          if len(image.content) < 5000:
                              continue

                          ext = {
                              "image/jpeg": "jpg",
                              "image/png": "png",
                              "image/webp": "webp"
                          }[mime]

                          saved += 1
                          with open(f"output/media/image_{saved:02d}.{ext}", "wb") as out:
                              out.write(image.content)

                          meta = info.get("extmetadata", {})
                          artist = meta.get("Artist", {}).get("value", "Unknown")
                          license_name = meta.get("LicenseShortName", {}).get("value", "Check license")
                          source_page = "https://commons.wikimedia.org/wiki/" + quote(title.replace(" ", "_"))
                          attribution.append(
                              f"{title} | Creator: {artist} | "
                              f"License: {license_name} | Source: {source_page}"
                          )
                          print(f"Downloaded image {saved}: {title}")
                          break

              except Exception as e:
                  print(f"Search warning for '{search_term}': {e}")
          
          with open("output/media_attribution.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(attribution))

          print(f"WIKIMEDIA_IMAGES_DOWNLOADED: {saved}")

          if saved == 0:
              print("Wikimedia is rate-limited; downloading real stock photos instead.")
              stock_urls = [
                  "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=1080&h=1920&q=85",
                  "https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1080&h=1920&q=85",
                  "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1080&h=1920&q=85",
                  "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=1080&h=1920&q=85",
                  "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=1080&h=1920&q=85"
              ]
              for image_url in stock_urls:
                  try:
                      image = session.get(image_url, timeout=45)
                      image.raise_for_status()
                      if len(image.content) < 5000:
                          continue
                      saved += 1
                      with open(f"output/media/image_{saved:02d}.jpg", "wb") as out:
                          out.write(image.content)
                      attribution.append("Unsplash stock photo | Source: https://unsplash.com/")
                      print(f"Downloaded stock photo {saved}")
                  except Exception as image_error:
                      print(f"Stock-photo warning: {image_error}")

          if saved == 0:
              print("All photo sources failed; creating newsroom graphic fallback.")
              fallback_colors = ["0x101b30", "0x17243a", "0x202b40", "0x152033", "0x101827"]
              for i, color in enumerate(fallback_colors, start=1):
                  output_path = f"output/media/image_{i:02d}.png"
                  subprocess.run(
                      ["ffmpeg", "-y", "-f", "lavfi", "-i", f"color=c={color}:s=1080x1920", "-frames:v", "1", output_path],
                      check=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE,
                  )
              print("NEWSROOM_GRAPHIC_FALLBACKS_CREATED: 5")

          # Try to add genuine moving B-roll from Pixabay when its API key is configured.
          video_key = os.environ.get("PIXABAY_API_KEY", "").strip()
          video_count = 0
          if video_key:
              for search_term in queries[:3]:
                  if video_count >= 2:
                      break
                  try:
                      api = session.get(
                          "https://pixabay.com/api/videos/",
                          params={"key": video_key, "q": search_term, "per_page": 5,
                                  "safesearch": "true", "video_type": "film"},
                          timeout=30
                      )
                      api.raise_for_status()
                      hits = api.json().get("hits", [])
                      for hit in hits:
                          if video_count >= 2:
                              break
                          variants = hit.get("videos", {})
                          clip = variants.get("medium") or variants.get("small") or variants.get("large")
                          if not clip or not clip.get("url"):
                              continue
                          try:
                              video_response = session.get(clip["url"], timeout=60)
                              video_response.raise_for_status()
                              if len(video_response.content) < 20000:
                                  continue
                              video_count += 1
                              video_path = f"output/media/clip_{video_count:02d}.mp4"
                              with open(video_path, "wb") as out:
                                  out.write(video_response.content)
                              attribution.append(
                                  f"Pixabay video | ID: {hit.get('id', 'unknown')} | "
                                  f"Source: https://pixabay.com/videos/"
                              )
                              print(f"PIXABAY_VIDEO_DOWNLOADED: {video_count}")
                          except Exception as clip_error:
                              print(f"Video download warning: {clip_error}")
                  except Exception as api_error:
                      print(f"Pixabay video search unavailable: {api_error}")
          else:
              print("PIXABAY_API_KEY not configured; using photo visuals for this run.")

          with open("output/media_attribution.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(attribution))

          visuals = [
              name for name in os.listdir("output/media")
              if name.startswith("image_")
              and name.lower().endswith((".jpg", ".jpeg", ".png", ".webp"))
          ]
          if not visuals:
              raise RuntimeError("No visuals were downloaded or generated")
          print(f"VISUAL_FILES_READY: {len(visuals)}")
          PY

      - name: Generate optional D-ID field reporter intro
        env:
          DID_API_KEY: \${{ secrets.DID_API_KEY }}
          PIXABAY_API_KEY: \${{ secrets.PIXABAY_API_KEY }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import time
          import json
          import requests
          import subprocess

          api_key = os.environ.get("DID_API_KEY", "").strip()
          pixabay_key = os.environ.get("PIXABAY_API_KEY", "").strip()
          media_dir = "output/media"
          os.makedirs(media_dir, exist_ok=True)

          if not api_key:
              print("D-ID intro skipped: DID_API_KEY secret is not configured.")
              raise SystemExit(0)
          if not pixabay_key:
              print("D-ID intro skipped: PIXABAY_API_KEY is not configured for reporter portrait search.")
              raise SystemExit(0)

          session = requests.Session()
          session.headers.update({"accept": "application/json"})

          try:
              # Find a suitable portrait photo for a generic AI field reporter.
              search = session.get(
                  "https://pixabay.com/api/",
                  params={
                      "key": pixabay_key,
                      "q": "male news reporter microphone",
                      "image_type": "photo",
                      "orientation": "vertical",
                      "safesearch": "true",
                      "per_page": 10
                  },
                  timeout=30
              )
              search.raise_for_status()
              hits = search.json().get("hits", [])
              if not hits:
                  print("D-ID intro skipped: no reporter portrait found.")
                  raise SystemExit(0)

              portrait_path = os.path.join(media_dir, "reporter_portrait.jpg")
              portrait_url = None
              for hit in hits:
                  candidate = hit.get("largeImageURL") or hit.get("webformatURL")
                  if not candidate:
                      continue
                  response = session.get(candidate, timeout=45)
                  response.raise_for_status()
                  if len(response.content) > 5000:
                      with open(portrait_path, "wb") as out:
                          out.write(response.content)
                      break
              if not os.path.exists(portrait_path):
                  print("D-ID intro skipped: reporter portrait download failed.")
                  raise SystemExit(0)

              auth = {"Authorization": "Basic " + api_key, "accept": "application/json"}

              with open(portrait_path, "rb") as photo:
                  uploaded_image = session.post(
                      "https://api.d-id.com/images",
                      headers=auth,
                      files={"image": ("reporter.jpg", photo, "image/jpeg")},
                      timeout=60
                  )
              uploaded_image.raise_for_status()
              image_data = uploaded_image.json()
              portrait_url = image_data.get("url") or image_data.get("image_url")
              if not portrait_url:
                  raise RuntimeError("D-ID image upload response did not contain a URL")

              # Use the exact existing Hindi voice-over, limited to a short intro.
              intro_audio = os.path.join(media_dir, "reporter_intro.wav")
              subprocess.run([
                  "ffmpeg", "-y", "-i", "output/voiceover.wav",
                  "-t", "7.5", "-ac", "1", "-ar", "16000", intro_audio
              ], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE)

              if os.path.getsize(intro_audio) > 6 * 1024 * 1024:
                  raise RuntimeError("D-ID intro audio exceeds the 6 MB upload limit")

              with open(intro_audio, "rb") as audio:
                  uploaded_audio = session.post(
                      "https://api.d-id.com/audios",
                      headers=auth,
                      files={"audio": ("reporter_intro.wav", audio, "audio/wav")},
                      timeout=60
                  )
              uploaded_audio.raise_for_status()
              audio_data = uploaded_audio.json()
              audio_url = audio_data.get("url") or audio_data.get("audio_url")
              if not audio_url:
                  raise RuntimeError("D-ID audio upload response did not contain a URL")

              created = session.post(
                  "https://api.d-id.com/talks",
                  headers={**auth, "content-type": "application/json"},
                  json={
                      "source_url": portrait_url,
                      "script": {"type": "audio", "audio_url": audio_url},
                      "name": "Mr Ahlawat Ground Report Intro"
                  },
                  timeout=60
              )
              created.raise_for_status()
              talk_id = created.json().get("id")
              if not talk_id:
                  raise RuntimeError("D-ID create-talk response did not contain an ID")

              result_url = None
              for attempt in range(36):
                  status_response = session.get(
                      f"https://api.d-id.com/talks/{talk_id}",
                      headers=auth,
                      timeout=30
                  )
                  status_response.raise_for_status()
                  status_data = status_response.json()
                  status = status_data.get("status", "")
                  if status == "done":
                      result_url = status_data.get("result_url")
                      break
                  if status in ("error", "rejected"):
                      raise RuntimeError("D-ID returned status: " + status)
                  time.sleep(5)

              if not result_url:
                  raise RuntimeError("D-ID reporter intro did not finish within 3 minutes")

              video_response = session.get(result_url, timeout=90)
              video_response.raise_for_status()
              output_path = os.path.join(media_dir, "reporter_intro.mp4")
              with open(output_path, "wb") as out:
                  out.write(video_response.content)
              if os.path.getsize(output_path) < 10000:
                  os.remove(output_path)
                  raise RuntimeError("D-ID reporter video file is unexpectedly small")

              print("DID_REPORTER_INTRO_SUCCESS")
          except SystemExit:
              raise
          except Exception as error:
              print("D-ID reporter intro unavailable; continuing with existing visuals.")
              print(type(error).__name__ + ": " + str(error))
          PY

      - name: Create Ground Report video with Hindi captions
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-dejavu-core

          python - <<'PY'
          import json
          import wave
          import re
          import os
          import glob
          import subprocess

          with open("output/metadata.json", encoding="utf-8") as f:
              script = json.load(f)["script"].strip()

          with wave.open("output/voiceover.wav", "rb") as wav:
              duration = wav.getnframes() / wav.getframerate()

          if duration <= 0:
              raise RuntimeError("Voice-over duration is invalid")

          sentences = re.split(r'(?<=[।!?])\s+', script)
          chunks = []

          for sentence in sentences:
              words = sentence.split()
              line = ""
              for word in words:
                  candidate = (line + " " + word).strip()
                  if len(candidate) > 32 and line:
                      chunks.append(line)
                      line = word
                  else:
                      line = candidate
              if line:
                  chunks.append(line)

          if not chunks:
              raise RuntimeError("No captions generated")

          def stamp(seconds):
              cs = int(round(seconds * 100))
              h, cs = divmod(cs, 360000)
              m, cs = divmod(cs, 6000)
              s, cs = divmod(cs, 100)
              return f"{h}:{m:02}:{s:02}.{cs:02}"

          weights = [max(1, len(c)) for c in chunks]
          total_weight = sum(weights)
          elapsed = 0.0

          with open("output/captions.ass", "w", encoding="utf-8") as f:
              f.write("[Script Info]\n")
              f.write("ScriptType: v4.00+\n")
              f.write("PlayResX: 1080\nPlayResY: 1920\n\n")
              f.write("[V4+ Styles]\n")
              f.write("Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\n")
              f.write("Style: Default,Noto Sans Devanagari,54,&H00FFFFFF,&H0000FFFF,&H0010152B,&H90000000,-1,0,0,0,100,100,0,0,1,4,1,2,70,70,480,1\n\n")
              f.write("[Events]\n")
              f.write("Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n")

              for chunk, weight in zip(chunks, weights):
                  start = elapsed
                  elapsed += duration * weight / total_weight
                  safe_chunk = chunk.replace("{", "(").replace("}", ")")
                  f.write(
                      f"Dialogue: 0,{stamp(start)},{stamp(elapsed)},Default,,0,0,0,,{safe_chunk}\n"
                  )

          # Create topic-specific text assets for the newsroom layout.
          with open("output/metadata.json", encoding="utf-8") as f:
              metadata = json.load(f)
          headline = re.sub(r"\s+", " ", metadata.get("title", "MR AHLAWAT NEWS")).strip()
          headline = headline.replace("\\", " ").replace("'", "’")
          ticker = re.sub(r"\s+", " ", metadata.get("description", script)).strip()
          ticker = ticker.replace("\\", " ").replace("'", "’")
          with open("output/headline.txt", "w", encoding="utf-8") as f:
              f.write(headline[:90])
          with open("output/ticker.txt", "w", encoding="utf-8") as f:
              f.write(("  •  BREAKING UPDATE  •  " + ticker + "  •  ")[:240])

          video_clips = sorted(glob.glob("output/media/clip_*.mp4"))[:2]
          images = sorted(glob.glob("output/media/image_*"))[:5]
          reporter_path = "output/media/reporter_intro.mp4"
          assets = ([("reporter", reporter_path)] if os.path.exists(reporter_path) else [])
          assets += [("video", path) for path in video_clips] + [
              ("image", path) for path in images
          ]

          if not assets:
              raise RuntimeError("No image or video visuals found.")

          # If D-ID succeeded, show the lip-synced reporter first, then B-roll/photos.
          transition_duration = 0.45
          if assets[0][0] == "reporter" and len(assets) > 1:
              reporter_duration = min(7.5, max(3.0, duration * 0.2))
              remaining_duration = (
                  duration + transition_duration * (len(assets) - 1) - reporter_duration
              ) / (len(assets) - 1)
              segment_durations = [reporter_duration] + [
                  remaining_duration for _ in assets[1:]
              ]
          else:
              segment_duration = (
                  duration + transition_duration * (len(assets) - 1)
              ) / len(assets)
              segment_durations = [segment_duration] * len(assets)

          args = ["ffmpeg", "-y"]
          for (kind, path), segment_duration in zip(assets, segment_durations):
              if kind in ("video", "reporter"):
                  args += ["-stream_loop", "-1", "-i", path]
              else:
                  args += ["-loop", "1", "-framerate", "30",
                           "-t", f"{segment_duration:.3f}", "-i", path]

          filters = []
          labels = []

          for i, ((kind, path), segment_duration) in enumerate(zip(assets, segment_durations)):
              label = f"v{i}"
              if kind in ("video", "reporter"):
                  filters.append(
                      f"[{i}:v]trim=duration={segment_duration:.3f},"
                      f"setpts=PTS-STARTPTS,scale=1080:1920:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop=1080:1920,setsar=1,fps=30,"
                      f"format=yuv420p,settb=AVTB[{label}]"
                  )
              else:
                  filters.append(
                      f"[{i}:v]scale=1080:1920:"
                      f"force_original_aspect_ratio=increase,"
                      f"crop=1080:1920,setsar=1,fps=30,"
                      f"zoompan=z='min(zoom+0.0005,1.08)':"
                      f"x='iw/2-(iw/zoom/2)':"
                      f"y='ih/2-(ih/zoom/2)':d=1:s=1080x1920:fps=30,"
                      f"format=yuv420p,settb=AVTB[{label}]"
                  )
              labels.append(f"[{label}]")

          previous = labels[0]
          for i in range(1, len(labels)):
              output_label = f"xf{i}"
              offset = sum(segment_durations[:i]) - i * transition_duration
              filters.append(
                  f"{previous}{labels[i]}"
                  f"xfade=transition=fade:duration={transition_duration}:"
                  f"offset={offset:.3f}[{output_label}]"
              )
              previous = f"[{output_label}]"

          filters.append(f"{previous}format=yuv420p[outv]")

          args += [
              "-filter_complex", ";".join(filters),
              "-map", "[outv]", "-an",
              "-c:v", "libx264", "-preset", "veryfast",
              "-pix_fmt", "yuv420p",
              "-t", f"{duration:.3f}",
              "output/visuals.mp4"
          ]

          subprocess.run(args, check=True)
          print(f"GROUND_REPORT_VISUALS_CREATED: {len(assets)} segments ({len(video_clips)} video clips, {len(images)} photos)")
          print(f"VOICEOVER_DURATION: {duration:.2f} seconds")
          PY

          ffmpeg -y \
            -i output/visuals.mp4 \
            -i output/voiceover.mp3 \
            -filter_complex "[0:v]drawbox=x=0:y=0:w=1080:h=112:color=0x071426@0.62:t=fill,drawbox=x=0:y=108:w=14:h=112:color=0xE53935:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='MR AHLAWAT':fontcolor=white:fontsize=42:x=42:y=27:shadowcolor=black:shadowx=2:shadowy=2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='GROUND REPORT':fontcolor=0x00D9FF:fontsize=25:x=42:y=76,drawbox=x=0:y=1570:w=1080:h=230:color=0x071426@0.78:t=fill,drawbox=x=0:y=1570:w=1080:h=8:color=0xE53935:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/noto/NotoSansDevanagari-Bold.ttf:textfile=output/headline.txt:fontcolor=white:fontsize=38:x=48:y=1620:shadowcolor=black:shadowx=2:shadowy=2,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='ON LOCATION  •  MR AHLAWAT':fontcolor=0x00D9FF:fontsize=26:x=48:y=1710,subtitles=filename=output/captions.ass[v]" \\
            -map "[v]" \
            -map 1:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -tune stillimage \
            -shortest \
            output/mr-ahlawat-short.mp4

      - name: Save generated files
        uses: actions/upload-artifact@v6
        with:
          name: mr-ahlawat-ai-short
          path: output/
          retention-days: 3

      - name: Upload video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import sys

          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from googleapiclient.errors import HttpError, ResumableUploadError

          with open("output/metadata.json", encoding="utf-8") as f:
              metadata = json.load(f)

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"]
          )

          youtube = build(
              "youtube",
              "v3",
              credentials=credentials,
              cache_discovery=False
          )

          video = MediaFileUpload(
              "output/mr-ahlawat-short.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": metadata["title"],
                      "description": metadata["description"],
                      "categoryId": "22"
                  },
                  "status": {
                      "privacyStatus": "private",
                      "selfDeclaredMadeForKids": False
                  }
              },
              media_body=video
          )

          try:
              response = request.execute()
          except (HttpError, ResumableUploadError) as e:
              if "uploadLimitExceeded" in str(e):
                  print("YOUTUBE_UPLOAD_LIMIT_REACHED")
                  print("Generated video is saved in the workflow artifact.")
                  sys.exit(0)
              raise

          print("YOUTUBE_UPLOAD_SUCCESS")
          print("Video ID:", response["id"])
          print("Video URL: https://www.youtube.com/watch?v=" + response["id"])
          PY
