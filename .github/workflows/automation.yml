          ]:
              source_links.append(f"{site}: {base}")
          encoded_topic = urllib.parse.quote_plus(topic or title or "India news")
          source_links.append(f"YouTube search (review license/ask creator; not auto-downloaded): https://www.youtube.com/results?search_query={encoded_topic}")
          
          # YouTube Data API: list only Creative Commons-labelled video links.
          # The API terms prohibit downloading/storing audiovisual content via the API.
          yt_key = os.environ.get("YOUTUBE_API_KEY", "").strip()
          if yt_key:
              try:
                  yt_response = session.get(
                      "https://www.googleapis.com/youtube/v3/search",
                      params={
                          "key": yt_key, "part": "snippet", "type": "video",
