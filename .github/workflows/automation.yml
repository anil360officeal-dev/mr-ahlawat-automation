name: Mr Ahlawat Shorts Automation

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Hindi Short ka topic"
        required: true
        default: "आज की ताज़ा वायरल खबर: CJP की नई जानकारी या BJP के खिलाफ बड़ा राष्ट्रीय मुद्दा"
        type: string
  schedule:
    # India time (IST): 08:00, 14:00, 19:00 = 02:30, 08:30, 13:30 UTC
    - cron: "30 2,8,13 * * *"

concurrency:
  group: mr-ahlawat-daily-news-upload
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  create-short:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Restore daily upload counter
        uses: actions/cache/restore@v4
        with:
          path: .github/daily-upload-count.json
          key: daily-upload-count-${{ github.run_id }}
          restore-keys: |
            daily-upload-count-

      - name: Check daily upload limit
        id: daily
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          path = ".github/daily-upload-count.json"
          today = datetime.now(ZoneInfo("Asia/Kolkata")).date().isoformat()
          try:
              with open(path, encoding="utf-8") as f:
                  state = json.load(f)
          except (OSError, json.JSONDecodeError):
              state = {}
          count = int(state.get("count", 0)) if state.get("date") == today else 0
          allowed = count < 3
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("allowed=" + ("true" if allowed else "false") + chr(10))
          print(f"IST_DATE={today}; successful_uploads_today={count}; allowed={allowed}")
          if not allowed:
              print("DAILY_UPLOAD_LIMIT_REACHED: maximum 3 successful uploads per India calendar day.")
          PY

      - name: Restore CJP duplicate-post state
        if: github.event_name == 'schedule' && steps.daily.outputs.allowed != 'false'
        uses: actions/cache/restore@v4
        with:
          path: .github/cjp-seen.json
          key: cjp-seen-${{ github.run_id }}
          restore-keys: |
            cjp-seen-

      - name: Select and verify CJP or BJP-critical news
        id: cjp
        if: github.event_name == 'schedule' && steps.daily.outputs.allowed != 'false'
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from email.utils import parsedate_to_datetime
          from urllib.parse import urlparse

          out_path = os.environ["GITHUB_OUTPUT"]
          state_path = ".github/cjp-seen.json"
          os.makedirs("output", exist_ok=True)
          try:
              with open(state_path, encoding="utf-8") as f:
                  state = json.load(f)
          except (OSError, json.JSONDecodeError):
              state = {"ids": []}
          seen = set(str(v) for v in state.get("ids", []))

          def output(key, value):
              with open(out_path, "a", encoding="utf-8") as f:
                  f.write(f"{key}={str(value).replace(chr(10), ' ').replace(chr(13), ' ')}\n")

          def get_json(url):
              req = urllib.request.Request(
                  url, headers={"Accept": "application/json",
                                "User-Agent": "MrAhlawatShorts/1.0"}
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  return json.loads(response.read().decode("utf-8"))

          def words(text):
              return set(re.findall(r"[A-Za-z0-9\u0900-\u097F]+", text.lower()))

          stop = {
              "cjp", "the", "and", "for", "with", "from", "that", "this",
              "have", "has", "was", "were", "are", "its", "into", "about",
              "after", "before", "over", "under", "their", "they", "them",
              "protest", "protests", "government", "india", "indian", "news",
              "update", "today", "latest", "viral", "breaking", "people",
              "says", "said", "claims", "claim", "video", "post", "https",
              "पर", "और", "का", "की", "के", "को", "से", "में", "है", "हैं",
              "एक", "यह", "कि", "भी", "लिए", "द्वारा", "आज", "कल", "अब",
          }
          trusted_domains = (
              "reuters.com", "thehindu.com", "indianexpress.com", "ndtv.com",
              "hindustantimes.com", "indiatimes.com", "indiatoday.in",
              "theprint.in", "scroll.in", "news18.com", "barandbench.com",
              "livelaw.in", "tribuneindia.com", "aninews.in", "ptinews.in",
              "bbc.com", "bbc.co.uk", "thewire.in", "newslaundry.com",
              "deccanherald.com", "outlookindia.com", "thequint.com",
              "telegraphindia.com", "livemint.com", "moneycontrol.com"
          )

          # Search CJP/BJP plus major India-wide public issues; no official X API key.
          search_queries = [
              'CJP -filter:replies',
              '"BJP" (against OR criticism OR protest OR scandal OR controversy OR viral) India -filter:replies',
              '"BJP government" (failure OR question OR protest OR corruption OR inflation OR unemployment) -filter:replies',
              'Modi government criticism viral India protest court election -filter:replies',
              'भारत BJP सरकार विरोध महंगाई बेरोजगारी किसान वायरल -filter:replies'
          ]
          items = []
          known_ids = set()
          search_failed = 0
          for query in search_queries:
              search_url = "https://unifapi.com/tools/x/search?" + urllib.parse.urlencode({"q": query})
              try:
                  payload = get_json(search_url)
                  found = payload.get("posts", {}).get("items", [])
                  if not isinstance(found, list):
                      found = []
                  for post in found:
                      post_id = str(post.get("id", "")).strip()
                      if post_id and post_id not in known_ids:
                          known_ids.add(post_id)
                          items.append(post)
              except Exception as e:
                  search_failed += 1
                  print("X_SEARCH_WARNING:", query, repr(e))
          if not items and search_failed == len(search_queries):
              print("X_SEARCH_UNAVAILABLE: all searches failed")
              output("should_run", "false")
              raise SystemExit(0)

          print("INDIA_ISSUE_X_POSTS_RETURNED:", len(items))
          now = datetime.now(timezone.utc)
          selected = None

          # Prioritize posts that explicitly concern CJP/BJP or a major national issue.
          issue_terms = {
              "cjp", "bjp", "parliament", "supreme", "court", "election",
              "government", "minister", "protest", "unemployment", "inflation",
              "farmers", "women", "safety", "corruption", "constitution",
              "democracy", "policy", "india", "लोकसभा", "संसद", "चुनाव",
              "सरकार", "महंगाई", "बेरोजगारी", "किसान", "भ्रष्टाचार",
              "संविधान", "न्यायालय", "विरोध", "महिला", "भारत"
          }
          def post_priority(post):
              body = str(post.get("text", "")).lower()
              tokens = words(body)
              relevant = len(tokens & issue_terms)
              created = str(post.get("createdAt", ""))
              return (relevant, created)
          items.sort(key=post_priority, reverse=True)

          for post in items[:40]:
              post_id = str(post.get("id", "")).strip()
              text = str(post.get("text", "")).strip()
              post_url = str(post.get("url", "")).strip()
              if not post_id or post_id in seen or not text or not post_url:
                  continue
              lower_text = text.lower()
              # Run any CJP-related post; for BJP stories, focus on criticism/opposition
              # and major controversies rather than generic/supportive BJP chatter.
              is_cjp = "cjp" in lower_text
              bjp_criticism_terms = (
                  "against bjp", "bjp government", "modi government", "protest",
                  "criticism", "scandal", "controversy", "corruption", "failure",
                  "unemployment", "inflation", "farmers", "women safety", "paper leak",
                  "electoral bonds", "vote", "election", "court", "constitution",
                  "विरोध", "आलोचना", "घोटाला", "भ्रष्टाचार", "नाकामी", "महंगाई",
                  "बेरोजगारी", "किसान", "पेपर लीक", "चुनाव", "सरकार", "मोदी"
              )
              is_bjp_criticism = ("bjp" in lower_text or "भारतीय जनता पार्टी" in lower_text
                                  or "modi" in lower_text or "मोदी" in lower_text) and any(
                                      term in lower_text for term in bjp_criticism_terms
                                  )
              if not (is_cjp or is_bjp_criticism):
                  continue

              substantive = [
                  t for t in words(text)
                  if len(t) >= 4 and t not in stop and not t.isdigit()
              ]
              if not substantive:
                  continue

              # Verify against a recent independent news article from an established outlet.
              # A social post alone is never treated as confirmation.
              # Search the actual issue keywords; don't force every story to mention CJP.
              query_terms = substantive[:6]
              rss_query = urllib.parse.quote(" ".join(query_terms))
              rss_url = (
                  "https://news.google.com/rss/search?q=" + rss_query
                  + "&hl=en-IN&gl=IN&ceid=IN:en"
              )
              try:
                  req = urllib.request.Request(
                      rss_url, headers={"User-Agent": "Mozilla/5.0 MrAhlawatShorts/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=20) as response:
                      xml_data = response.read()
                  root = ET.fromstring(xml_data)
              except Exception as e:
                  print("NEWS_CORROBORATION_SEARCH_WARNING:", repr(e))
                  continue

              matches = []
              for item in root.findall(".//item")[:15]:
                  article_title = (item.findtext("title") or "").strip()
                  article_link = (item.findtext("link") or "").strip()
                  source_node = item.find("source")
                  source_name = source_node.text.strip() if source_node is not None and source_node.text else ""
                  source_url = source_node.get("url", "") if source_node is not None else ""
                  domain = (urlparse(source_url or article_link).hostname or "").lower()
                  if not any(domain == d or domain.endswith("." + d) for d in trusted_domains):
                      continue
                  pub_date = item.findtext("pubDate") or ""
                  try:
                      published = parsedate_to_datetime(pub_date)
                      if published.tzinfo is None:
                          published = published.replace(tzinfo=timezone.utc)
                      if now - published.astimezone(timezone.utc) > timedelta(days=7):
                          continue
                  except Exception:
                      continue
                  title_words = words(article_title)
                  overlap = (set(substantive) & title_words)
                  if len(overlap) >= 2:
                      matches.append({
                          "title": article_title, "url": article_link,
                          "source": source_name, "matched_terms": sorted(overlap)
                      })
              if matches:
                  selected = {
                      "id": post_id, "text": text, "url": post_url,
                      "createdAt": post.get("createdAt", ""),
                      "author": post.get("author", {}),
                      "corroborating_articles": matches[:3]
                  }
                  break

          if not selected:
              print("NO_CJP_OR_BJP_CRITICISM_STORY_CORROBORATED_BY_RECENT_TRUSTED_NEWS; skipping upload.")
              output("should_run", "false")
              raise SystemExit(0)

          # Persist the selected ID in the cache file; cache is saved only after successful upload.
          seen.add(selected["id"])
          state["ids"] = list(seen)[-5000:]
          with open(state_path, "w", encoding="utf-8") as f:
              json.dump(state, f, ensure_ascii=False, indent=2)
          with open("output/cjp_source.json", "w", encoding="utf-8") as f:
              json.dump(selected, f, ensure_ascii=False, indent=2)

          topic = ("CJP update: " if "cjp" in selected["text"].lower() else "BJP-विरोधी वायरल/बड़ा मुद्दा: ") + selected["text"][:500]
          output("should_run", "true")
          output("topic", topic)
          output("post_id", selected["id"])
          print("INDIA_ISSUE_POST_SELECTED:", selected["url"])
          print("INDEPENDENT_NEWS_MATCHES:", len(selected["corroborating_articles"]))
          for article in selected["corroborating_articles"]:
              print("CORROBORATING_SOURCE:", article["source"], article["url"])
          PY

      - name: Install FFmpeg
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python libraries
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        run: |
          python -m pip install --upgrade pip
          pip install requests piper-tts edge-tts google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Generate Hindi Short with Gemini AI
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHORT_TOPIC: ${{ steps.cjp.outputs.topic || inputs.topic }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests

          api_key = os.environ.get("GEMINI_API_KEY", "").strip()
          topic = os.environ.get("SHORT_TOPIC", "").strip()
          source_context = {}
          if os.path.exists("output/cjp_source.json"):
              with open("output/cjp_source.json", encoding="utf-8") as source_file:
                  source_context = json.load(source_file)

          if not api_key:
              raise RuntimeError("GEMINI_API_KEY secret is missing")

          prompt = f"""
          Create metadata and a spoken script for a YouTube Short
          for the Hindi/Hinglish channel Mr Ahlawat.

          Topic: {topic}

          Editorial focus for Mr Ahlawat:
          - This is a current-affairs/news channel, not a technology explainer channel.
          - If the topic/source is about CJP, cover any relevant update or information about CJP, without requiring it to be anti-BJP.
          - Otherwise prioritize a genuinely newsworthy viral story critical of BJP/the BJP-led government, including major controversies, protests, court/election developments, public-policy failures, inflation, unemployment, farmers, women's safety, corruption allegations, or other major public-interest issues.
          - For manual runs where no source is supplied, do not pretend to know today's latest news. Ask the model to produce a factual, cautious news explainer only if it can support the topic; never invent a current event. Scheduled runs must be grounded in the selected post and corroborating coverage.
          - Make the opening sound like a concise Hindi TV news bulletin. Give the key fact, why it matters, and what is confirmed versus alleged. Avoid generic filler.

          X source post and independent corroborating coverage (empty for manual topic runs):
          {json.dumps(source_context, ensure_ascii=False)}

          Verification rules:
          - Treat the X post as a lead, not as proof. Only state factual claims supported by the corroborating articles above.
          - If the post makes claims not supported by those articles, omit them or clearly attribute them as unconfirmed claims in the post.
          - Do not invent quotes, dates, arrests, motives, identities, or event details. Include the source post/article links in the description.
          - If corroborating evidence is weak or contradictory, produce a cautious update and say what remains unverified.

          Rules:
          - Write like a real Indian TV field reporter speaking naturally to one viewer, not like a formal article or AI announcement.
          - Use natural spoken Devanagari Hindi with everyday Indian phrasing and smooth word connections.
          - Avoid writing Hindi words in Roman letters. Keep only unavoidable names and technical terms in English; write common terms in Hindi phonetics when that improves pronunciation.
          - Sound warm, grounded, confident, and human. Keep the news-anchor energy, but do not make every sentence sound like a dramatic headline.
          - Vary sentence length and rhythm naturally; use commas and full stops where a real speaker would breathe.
          - Use emphasis only on the most important facts. Keep transitions conversational and the ending crisp, not theatrical.
          - Prefer easy-to-pronounce words and clean sentence structure; avoid tongue-twisters, stacked English terms, repeated filler, and generic AI phrases.
          - Never shout, over-dramatize, sensationalize, invent facts, or claim unverified breaking news.
          - Script should be around 45–52 seconds when spoken (roughly 105–120 Hindi words).
          - Include a strong opening hook, clear explanation, and a short closing line.
          - Do not make the script too short; aim for a full one-minute narration.
          - Do not invent facts, quotes, or breaking news.
          - Title must be under 100 characters and include 3 relevant hashtags.
          - Description should explain the topic and include relevant hashtags.
          - Return valid JSON only with these keys:
          - script, title, description, hashtags, visual_search_terms
          - visual_search_terms must be a JSON array containing 3 short English search queries tied to THIS exact topic. Include the real person, place, event, company, product, or technology named in the topic whenever applicable. Do not return generic terms such as 'India news', 'technology background', or 'people talking'. Prefer queries that would find visuals of the exact event/person, then closely related context.
          """

          url = (
              "https://generativelanguage.googleapis.com/v1beta/"
              "models/gemini-3.5-flash-lite:generateContent"
          )

          import time
          response = None

          for attempt in range(5):
              try:
                  response = requests.post(
                      url,
                      params={"key": api_key},
                      json={
                          "contents": [
                              {"parts": [{"text": prompt}]}
                          ],
                          "generationConfig": {
                              "responseMimeType": "application/json"
                          }
                      },
                      timeout=90
                  )

                  if response.ok:
                      break

                  if response.status_code not in (429, 500, 502, 503, 504):
                      break

                  print(
                      f"Gemini temporary error HTTP {response.status_code}; "
                      f"attempt {attempt + 1}/5"
                  )

              except requests.RequestException as e:
                  print(f"Gemini connection error: {e}")
                  response = None

              if attempt < 4:
                  delay = 5 * (2 ** attempt)
                  print(f"Retrying in {delay} seconds...")
                  time.sleep(delay)

          if response is None or not response.ok:
              status = (
                  response.status_code
                  if response is not None
                  else "connection error"
              )
              raise RuntimeError(
                  f"Gemini API failed: {status}. "
                  "Check model availability, API access, quota, and billing."
              )

          
          result = response.json()
          candidates = result.get("candidates", [])

          if not candidates:
              raise RuntimeError(
                  "Gemini returned no candidates. Check API response, "
                  "safety blocking, model access, or quota."
              )

          parts = candidates[0].get("content", {}).get("parts", [])
          text_parts = [
              part["text"] for part in parts
              if isinstance(part, dict) and "text" in part
          ]

          if not text_parts:
              raise RuntimeError("Gemini response contains no text")

          text = "\n".join(text_parts)
          data = json.loads(text)
          required = ["script", "title", "description", "hashtags"]
          if any(key not in data for key in required):
              raise RuntimeError("Gemini response is missing required fields")

          data["title"] = data["title"].strip()[:100]
          data["description"] = data["description"].strip()
          if source_context:
              source_urls = []
              post_url = source_context.get("url", "")
              if post_url:
                  source_urls.append(post_url)
              for article in source_context.get("corroborating_articles", []):
                  article_url = article.get("url", "")
                  if article_url and article_url not in source_urls:
                      source_urls.append(article_url)
              if source_urls:
                  data["description"] += "\n\nSources: " + " | ".join(source_urls)

          os.makedirs("output", exist_ok=True)
          with open("output/metadata.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print("GEMINI_SCRIPT_SUCCESS")
          print("Generated title:", data["title"])
          print("Generated script:", data["script"])
          PY

      - name: Generate Hindi male voice-over
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        run: |
          set -e
          mkdir -p models output

          python - <<'PY'
          import asyncio
          import json
          import os
          import subprocess

          with open("output/metadata.json", encoding="utf-8") as f:
              data = json.load(f)

          script = data["script"].strip()
          if not script:
              raise RuntimeError("AI script is empty")

          # First try Microsoft's free Hindi neural voice. If its service is
          # unavailable (for example HTTP 403), fall back to the known Piper voice.
          source_audio = None
          try:
              import edge_tts

              async def make_neural_voice():
                  communicate = edge_tts.Communicate(
                      script,
                      "hi-IN-MadhurNeural",
                      rate="+12%",
                      pitch="+2Hz"
                  )
                  await communicate.save("output/voiceover-edge.mp3")

              asyncio.run(make_neural_voice())
              if os.path.getsize("output/voiceover-edge.mp3") > 1000:
                  source_audio = "output/voiceover-edge.mp3"
                  print("VOICE_ENGINE=edge-tts hi-IN-MadhurNeural")
          except Exception as e:
              print("Neural Hindi voice unavailable; using Piper fallback:", repr(e))

          if source_audio is None:
              BASE = "https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/rohan/medium"
              subprocess.run(
                  ["curl", "-fL", BASE + "/hi_IN-rohan-medium.onnx",
                   "-o", "models/hi_IN-rohan-medium.onnx"],
                  check=True
              )
              subprocess.run(
                  ["curl", "-fL", BASE + "/hi_IN-rohan-medium.onnx.json",
                   "-o", "models/hi_IN-rohan-medium.onnx.json"],
                  check=True
              )
              subprocess.run(
                  [
                      "piper",
                      "--model", "models/hi_IN-rohan-medium.onnx",
                      "--length_scale", "0.90",
                      "--noise_scale", "0.60",
                      "--noise_w_scale", "0.75",
                      "--sentence_silence", "0.18",
                      "--output_file", "output/voiceover.wav"
                  ],
                  input=script,
                  text=True,
                  check=True
              )
              source_audio = "output/voiceover.wav"
              print("VOICE_ENGINE=piper hi_IN-rohan-medium")

          subprocess.run(
              [
                  "ffmpeg", "-y",
                  "-i", source_audio,
                  "-af", "highpass=f=75,lowpass=f=11000,equalizer=f=180:t=q:w=1:g=0.8,equalizer=f=2800:t=q:w=1:g=0.8,equalizer=f=4200:t=q:w=1:g=0.3,acompressor=threshold=-22dB:ratio=2.2:attack=15:release=140,loudnorm=I=-16:TP=-1.5:LRA=11",
                  "-b:a", "192k",
                  "output/voiceover.mp3"
              ],
              check=True
          )

          if os.path.getsize("output/voiceover.mp3") < 1000:
              raise RuntimeError("Voice-over file is too small")

          # Downstream caption timing reads voiceover.wav, so always create it
          # from the final processed MP3 regardless of which voice engine won.
          subprocess.run(
              [
                  "ffmpeg", "-y",
                  "-i", "output/voiceover.mp3",
                  "-ar", "24000",
                  "-ac", "1",
                  "output/voiceover.wav"
              ],
              check=True
          )
          if not os.path.exists("output/voiceover.wav") or os.path.getsize("output/voiceover.wav") < 1000:
              raise RuntimeError("Compatibility WAV for caption timing was not created")

          print("HINDI_MALE_VOICE_SUCCESS")
          PY
    

      - name: Generate free Hindi voice comparison samples
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        continue-on-error: true
        run: |
          set -e
          mkdir -p models output

          # Keep the production voiceover.mp3 untouched. Create a separate Pratham sample
          # so both free Hindi male voices can be compared from the workflow artifact.
          cp output/voiceover.mp3 output/voice-test-rohan.mp3

          BASE="https://huggingface.co/rhasspy/piper-voices/resolve/main/hi/hi_IN/pratham/medium"
          curl -fL --retry 3 "$BASE/hi_IN-pratham-medium.onnx" -o models/hi_IN-pratham-medium.onnx
          curl -fL --retry 3 "$BASE/hi_IN-pratham-medium.onnx.json" -o models/hi_IN-pratham-medium.onnx.json

          python - <<'PY'
          import json
          import os
          import subprocess

          with open("output/metadata.json", encoding="utf-8") as f:
              script = json.load(f)["script"].strip()

          if not script:
              raise RuntimeError("Voice comparison script is empty")

          subprocess.run(
              [
                  "piper",
                  "--model", "models/hi_IN-pratham-medium.onnx",
                  "--length_scale", "0.94",
                  "--noise_scale", "0.60",
                  "--noise_w_scale", "0.75",
                  "--sentence_silence", "0.26",
                  "--output_file", "output/voice-test-pratham.wav"
              ],
              input=script,
              text=True,
              check=True
          )

          subprocess.run(
              [
                  "ffmpeg", "-y", "-i", "output/voice-test-pratham.wav",
                  "-af", "highpass=f=75,lowpass=f=11000,equalizer=f=180:t=q:w=1:g=1.5,equalizer=f=3200:t=q:w=1:g=1.2,acompressor=threshold=-18dB:ratio=2.5:attack=15:release=120,loudnorm=I=-16:TP=-1.5:LRA=11",
                  "-b:a", "192k", "output/voice-test-pratham.mp3"
              ],
              check=True
          )

          for name in ("output/voice-test-rohan.mp3", "output/voice-test-pratham.mp3"):
              if not os.path.exists(name) or os.path.getsize(name) < 1000:
                  raise RuntimeError(f"Voice comparison sample missing or too small: {name}")

          print("VOICE_COMPARISON_SAMPLES_READY")
          print("Compare output/voice-test-rohan.mp3 with output/voice-test-pratham.mp3 in the workflow artifact.")
          PY

      - name: Download relevant Wikimedia images
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        env:
          SHORT_TOPIC: ${{ inputs.topic }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          import subprocess
          from urllib.parse import quote

          os.makedirs("output/media", exist_ok=True)

          for name in os.listdir("output/media"):
              path = os.path.join("output/media", name)
              if os.path.isfile(path):
                  os.remove(path)

          with open("output/metadata.json", encoding="utf-8") as f:
              metadata = json.load(f)

          topic = os.environ.get("SHORT_TOPIC", "").strip()
          title = str(metadata.get("title", "")).strip()
          generated_queries = metadata.get("visual_search_terms", [])
          if isinstance(generated_queries, str):
              generated_queries = [generated_queries]
          generated_queries = [
              q.strip() for q in generated_queries
              if isinstance(q, str) and q.strip()
          ]

          # Keep search focused on the requested topic. Topic-specific AI queries
          # lead; title and original input are included as additional exact anchors.
          queries = []
          for q in generated_queries[:4] + [title, topic]:
              q = q.strip() if isinstance(q, str) else ""
              if q and q.lower() not in {item.lower() for item in queries}:
                  queries.append(q)
          if not queries:
              raise RuntimeError("No topic-specific visual search queries were generated.")
          print("TOPIC_FOCUSED_VISUAL_QUERIES:")
          for q in queries:
              print(" - " + q)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "MrAhlawatShorts/1.0 (image search)"
          })

          saved = 0
          attribution = []
          seen = set()

          # Prefer Pixabay photos first, using the configured repository secret.
          # If Pixabay has no matching photos, Wikimedia Commons is the topic-focused fallback.
          image_key = os.environ.get("PIXABAY_API_KEY", "").strip()
          if image_key:
              for search_term in queries[:4]:
                  if saved >= 5:
                      break
                  try:
                      print(f"Searching Pixabay photos: {search_term}")
                      api = session.get(
                          "https://pixabay.com/api/",
                          params={
                              "key": image_key,
                              "q": search_term,
                              "image_type": "photo",
                              "orientation": "vertical",
                              "safesearch": "true",
                              "per_page": 5
                          },
                          timeout=30
                      )
                      api.raise_for_status()
                      for hit in api.json().get("hits", []):
                          if saved >= 5:
                              break
                          image_url = hit.get("largeImageURL") or hit.get("webformatURL")
                          if not image_url or image_url in seen:
                              continue
                          seen.add(image_url)
                          image = session.get(image_url, timeout=45)
                          image.raise_for_status()
                          if len(image.content) < 5000:
                              continue
                          saved += 1
                          with open(f"output/media/image_{saved:02d}.jpg", "wb") as out:
                              out.write(image.content)
                          attribution.append(
                              f"Pixabay photo | ID: {hit.get('id', 'unknown')} | "
                              f"Source: https://pixabay.com/"
                          )
                          print(f"PIXABAY_IMAGE_DOWNLOADED: {saved}")
                  except Exception as pixabay_error:
                      print(f"Pixabay photo search warning for '{search_term}': {pixabay_error}")

          for search_term in queries[:4]:
              if saved >= 5:
                  break

              try:
                  print(f"Searching Wikimedia Commons: {search_term}")

                  response = session.get(
                      "https://commons.wikimedia.org/w/api.php",
                      params={
                          "action": "query",
                          "format": "json",
                          "list": "search",
                          "srnamespace": 6,
                          "srsearch": search_term,
                          "srlimit": 10
                      },
                      timeout=30
                  )
                  response.raise_for_status()
                  results = response.json().get("query", {}).get("search", [])

                  for result in results:
                      if saved >= 5:
                          break

                      title = result.get("title", "")
                      if not title or title in seen:
                          continue
                      seen.add(title)

                      detail = session.get(
                          "https://commons.wikimedia.org/w/api.php",
                          params={
                              "action": "query",
                              "format": "json",
                              "titles": title,
                              "prop": "imageinfo",
                              "iiprop": "url|mime|extmetadata",
                              "iiurlwidth": 1280
                          },
                          timeout=30
                      )
                      detail.raise_for_status()
                      pages = detail.json().get("query", {}).get("pages", {})

                      for page in pages.values():
                          info = page.get("imageinfo", [{}])[0]
                          mime = info.get("mime", "")
                          if mime not in ("image/jpeg", "image/png", "image/webp"):
                              continue

                          url = info.get("thumburl") or info.get("url")
                          if not url:
                              continue

                          image = session.get(url, timeout=45)
                          image.raise_for_status()
                          if len(image.content) < 5000:
                              continue

                          ext = {
                              "image/jpeg": "jpg",
                              "image/png": "png",
                              "image/webp": "webp"
                          }[mime]

                          saved += 1
                          with open(f"output/media/image_{saved:02d}.{ext}", "wb") as out:
                              out.write(image.content)

                          meta = info.get("extmetadata", {})
                          artist = meta.get("Artist", {}).get("value", "Unknown")
                          license_name = meta.get("LicenseShortName", {}).get("value", "Check license")
                          source_page = "https://commons.wikimedia.org/wiki/" + quote(title.replace(" ", "_"))
                          attribution.append(
                              f"{title} | Creator: {artist} | "
                              f"License: {license_name} | Source: {source_page}"
                          )
                          print(f"Downloaded image {saved}: {title}")
                          break

              except Exception as e:
                  print(f"Search warning for '{search_term}': {e}")
          
          with open("output/media_attribution.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(attribution))

          print(f"WIKIMEDIA_IMAGES_DOWNLOADED: {saved}")

          if saved == 0:
              print("No topic-matched photos found; will use clearly designed newsroom graphics rather than unrelated stock photos.")

          if saved == 0:
              print("All photo sources failed; creating newsroom graphic fallback.")
              fallback_colors = ["0x101b30", "0x17243a", "0x202b40", "0x152033", "0x101827"]
              for i, color in enumerate(fallback_colors, start=1):
                  output_path = f"output/media/image_{i:02d}.png"
                  subprocess.run(
                      ["ffmpeg", "-y", "-f", "lavfi", "-i", f"color=c={color}:s=1080x1920", "-frames:v", "1", output_path],
                      check=True, stdout=subprocess.DEVNULL, stderr=subprocess.PIPE,
                  )
              print("NEWSROOM_GRAPHIC_FALLBACKS_CREATED: 5")

          # Try to add genuine moving B-roll from Pixabay when its API key is configured.
          video_key = os.environ.get("PIXABAY_API_KEY", "").strip()
          video_count = 0
          if video_key:
              for search_term in queries[:3]:
                  if video_count >= 2:
                      break
                  try:
                      api = session.get(
                          "https://pixabay.com/api/videos/",
                          params={"key": video_key, "q": search_term, "per_page": 5,
                                  "safesearch": "true", "video_type": "film"},
                          timeout=30
                      )
                      api.raise_for_status()
                      hits = api.json().get("hits", [])
                      for hit in hits:
                          if video_count >= 2:
                              break
                          variants = hit.get("videos", {})
                          clip = variants.get("medium") or variants.get("small") or variants.get("large")
                          if not clip or not clip.get("url"):
                              continue
                          try:
                              video_response = session.get(clip["url"], timeout=60)
                              video_response.raise_for_status()
                              if len(video_response.content) < 20000:
                                  continue
                              video_count += 1
                              video_path = f"output/media/clip_{video_count:02d}.mp4"
                              with open(video_path, "wb") as out:
                                  out.write(video_response.content)
                              attribution.append(
                                  f"Pixabay video | ID: {hit.get('id', 'unknown')} | "
                                  f"Source: https://pixabay.com/videos/"
                              )
                              print(f"PIXABAY_VIDEO_DOWNLOADED: {video_count}")
                          except Exception as clip_error:
                              print(f"Video download warning: {clip_error}")
                  except Exception as api_error:
                      print(f"Pixabay video search unavailable: {api_error}")
          else:
              print("PIXABAY_API_KEY not configured; using photo visuals for this run.")

          with open("output/media_attribution.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(attribution))

          visuals = [
              name for name in os.listdir("output/media")
              if name.startswith("image_")
              and name.lower().endswith((".jpg", ".jpeg", ".png", ".webp"))
          ]
          if not visuals:
              raise RuntimeError("No visuals were downloaded or generated")
          print(f"VISUAL_FILES_READY: {len(visuals)}")
          PY

      - name: Create free reporter-style intro with FFmpeg
        if: steps.daily.outputs.allowed != 'false' && steps.cjp.outputs.should_run != 'false'
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import os
          import requests
          import subprocess

          media_dir = "output/media"
          os.makedirs(media_dir, exist_ok=True)
          api_key = os.environ.get("PIXABAY_API_KEY", "").strip()
          portrait_path = os.path.join(media_dir, "reporter_portrait.jpg")
          output_path = os.path.join(media_dir, "reporter_intro.mp4")

          # Free photo-based intro; no D-ID or paid avatar API is used.
          try:
              if not api_key:
                  print("Free reporter intro skipped: PIXABAY_API_KEY is not configured.")
                  raise SystemExit(0)

              response = requests.get(
                  "https://pixabay.com/api/",
                  params={
                      "key": api_key,
                      "q": "male news reporter microphone",
                      "image_type": "photo",
                      "orientation": "vertical",
                      "safesearch": "true",
                      "per_page": 10
                  },
                  timeout=30
              )
              response.raise_for_status()
              hits = response.json().get("hits", [])
              if not hits:
                  print("Free reporter intro skipped: Pixabay returned no reporter photos.")
                  raise SystemExit(0)

              downloaded = False
              for hit in hits:
                  image_url = hit.get("largeImageURL") or hit.get("webformatURL")
                  if not image_url:
                      continue
                  try:
                      image = requests.get(image_url, timeout=45)
                      image.raise_for_status()
                      if len(image.content) < 5000:
                          continue
                      with open(portrait_path, "wb") as out:
                          out.write(image.content)
                      downloaded = True
                      print("FREE_REPORTER_PHOTO_DOWNLOADED")
