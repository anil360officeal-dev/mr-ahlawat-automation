name: Mr Ahlawat Shorts Automation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  create-short:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Create test video
        run: |
          mkdir -p output
          ffmpeg -y \
            -f lavfi \
            -i "color=c=black:s=1080x1920:r=30:d=10" \
            -vf "drawtext=text='MR AHWALAT':fontcolor=white:fontsize=80:x=(w-text_w)/2:y=(h-text_h)/2" \
            -c:v libx264 \
            -pix_fmt yuv420p \
            output/mr-ahlawat-short.mp4

      - name: Save video artifact
        uses: actions/upload-artifact@v6
        with:
          name: mr-ahlawat-short
          path: output/mr-ahlawat-short.mp4
          retention-days: 3

      - name: Install YouTube API libraries
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Upload video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          credentials = Credentials(
              token=None,
              refresh_token=os.environ["YOUTUBE_REFRESH_TOKEN"],
              token_uri="https://oauth2.googleapis.com/token",
              client_id=os.environ["YOUTUBE_CLIENT_ID"],
              client_secret=os.environ["YOUTUBE_CLIENT_SECRET"],
              scopes=["https://www.googleapis.com/auth/youtube.upload"]
          )

          youtube = build(
              "youtube", "v3",
              credentials=credentials,
              cache_discovery=False
          )

          video = MediaFileUpload(
              "output/mr-ahlawat-short.mp4",
              mimetype="video/mp4",
              resumable=True
          )

          request = youtube.videos().insert(
              part="snippet,status",
              body={
                  "snippet": {
                      "title": "Mr Ahlawat - Test Short",
                      "description": "Testing YouTube upload automation.",
                      "categoryId": "22"
                  },
                  "status": {
                      "privacyStatus": "private",
                      "selfDeclaredMadeForKids": False
                  }
              },
              media_body=video
          )

          response = request.execute()
          print("YOUTUBE_UPLOAD_SUCCESS")
          print("Video ID:", response["id"])
          print("Video URL: https://www.youtube.com/watch?v=" + response["id"])
          PY
