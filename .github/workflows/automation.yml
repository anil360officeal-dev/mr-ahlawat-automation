                                  f"Pixabay video | ID: {hit.get('id', 'unknown')} | "
                                  f"Source: https://pixabay.com/videos/"
                              )
                              print(f"PIXABAY_VIDEO_DOWNLOADED: {video_count}")
                          except Exception as clip_error:
                              print(f"Video download warning: {clip_error}")
